<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:PM;src:url(PermanentMarker.ttf)}
@font-face{font-family:CV;src:url(Caveat.ttf);font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const INK='#1d2a4a', PEN='#22306b', RED='#d8322a', YEL='rgba(255,226,60,0.75)', GRN='#1f9a55', PAPER='#f5f0e3', BLUE='#2a6fd6';
let TIM=null, BOIL=0, PAPERC=null, PENCIL=null, IMG={};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>x<0?0:x>1?1:(x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2);
const easeOut=x=>{x=clamp(x,0,1);return 1-Math.pow(1-x,3);};
const back=x=>{x=clamp(x,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,f)=>a+(b-a)*f;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const jit=(i,a)=>(rnd(i+BOIL*17.3)-.5)*a; // boiling jitter

function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}
// ---------- paper ----------
function makePaper(){
  const c=document.createElement('canvas');c.width=W+200;c.height=H+200;const x=c.getContext('2d');
  x.fillStyle=PAPER;x.fillRect(0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height);
  for(let i=0;i<im.data.length;i+=4){const n=(rnd(i*0.013)-.5)*14;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n*0.8;}
  x.putImageData(im,0,0);
  x.strokeStyle='rgba(80,120,190,0.16)';x.lineWidth=2;
  for(let gx=0;gx<c.width;gx+=48){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,c.height);x.stroke();}
  for(let gy=0;gy<c.height;gy+=48){x.beginPath();x.moveTo(0,gy);x.lineTo(c.width,gy);x.stroke();}
  x.strokeStyle='rgba(216,50,42,0.35)';x.lineWidth=3;x.beginPath();x.moveTo(150,0);x.lineTo(150,c.height);x.stroke();
  // coffee ring
  x.strokeStyle='rgba(140,90,40,0.13)';x.lineWidth=14;x.beginPath();x.arc(1010,1900,120,0.3,5.9);x.stroke();
  x.lineWidth=4;x.strokeStyle='rgba(140,90,40,0.10)';x.beginPath();x.arc(1015,1905,104,0,6.2);x.stroke();
  // spiral binding top
  for(let sx=150;sx<c.width-60;sx+=58){x.fillStyle='rgba(0,0,0,0.55)';x.beginPath();x.arc(sx,148,11,0,7);x.fill();
    x.strokeStyle='#8d939c';x.lineWidth=7;x.beginPath();x.moveTo(sx-6,150);x.bezierCurveTo(sx-10,100,sx+18,90,sx+14,140);x.stroke();
    x.strokeStyle='#d7dbe0';x.lineWidth=2.5;x.beginPath();x.moveTo(sx-4,145);x.bezierCurveTo(sx-8,104,sx+14,96,sx+11,136);x.stroke();}
  return c;
}
// ---------- sketch primitives ----------
function sketchPath(pts,color,w,frac,seed,double){
  frac=frac==null?1:frac; if(frac<=0||pts.length<2)return;
  let L=0;const ls=[0];for(let i=1;i<pts.length;i++){L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);ls.push(L);}
  const end=L*frac;
  for(let pass=0;pass<(double===false?1:2);pass++){
    g.save();g.strokeStyle=color;g.lineWidth=w*(pass?0.6:1);g.globalAlpha=pass?0.55:0.95;g.lineCap='round';g.lineJoin='round';
    g.beginPath();
    for(let i=0;i<pts.length;i++){ if(ls[i]>end){const a=pts[i-1],b=pts[i],f=(end-ls[i-1])/(ls[i]-ls[i-1]);if(pass===0&&w>=5&&frac<0.995){const m=g.getTransform();const px=a.x+(b.x-a.x)*f,py=a.y+(b.y-a.y)*f;PENCIL={x:m.a*px+m.c*py+m.e,y:m.b*px+m.d*py+m.f};}g.lineTo(a.x+(b.x-a.x)*f+jit(seed+i+pass*99,2.2),a.y+(b.y-a.y)*f+jit(seed+i*3+pass*77,2.2));break;}
      const px=pts[i].x+jit(seed+i+pass*99,2.2*(pass+1)), py=pts[i].y+jit(seed+i*3+pass*77,2.2*(pass+1));
      i?g.lineTo(px,py):g.moveTo(px,py);}
    g.stroke();g.restore();}
}
function lineP(a,b,n){const p=[];n=n||Math.max(2,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/18));for(let i=0;i<=n;i++)p.push({x:lerp(a.x,b.x,i/n),y:lerp(a.y,b.y,i/n)});return p;}
function arcP(c,r,a0,a1,n){const p=[];n=n||40;for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);p.push({x:c.x+r*Math.cos(a),y:c.y+r*Math.sin(a)});}return p;}
function curveP(pts,n){ // catmull-rom
  const out=[];n=n||20;
  for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      out.push({x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
                y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});}}
  out.push(pts[pts.length-1]);return out;}
function at(pts,f){let L=0;const ls=[0];for(let i=1;i<pts.length;i++){L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);ls.push(L);}
  const l=clamp(f,0,1)*L;let i=1;while(i<pts.length-1&&ls[i]<l)i++;const a=pts[i-1],b=pts[i],q=(l-ls[i-1])/Math.max(1e-6,ls[i]-ls[i-1]);
  return {x:lerp(a.x,b.x,q),y:lerp(a.y,b.y,q),ang:Math.atan2(b.y-a.y,b.x-a.x)};}
function arrowHead(p,ang,color,s){s=s||26;const a1=ang+2.6,a2=ang-2.6;
  sketchPath([{x:p.x+Math.cos(a1)*s,y:p.y+Math.sin(a1)*s},p,{x:p.x+Math.cos(a2)*s,y:p.y+Math.sin(a2)*s}],color,7,1,p.x|0);}
function arrow(pts,color,w,frac,seed){sketchPath(pts,color,w||7,frac,seed);if(frac>=0.98){const a=at(pts,1),b=at(pts,0.97);arrowHead(a,Math.atan2(a.y-b.y,a.x-b.x),color);}}
function highlight(x,y,w,h,frac,color){ if(frac<=0)return; g.save();g.fillStyle=color||YEL;g.globalCompositeOperation='multiply';
  g.beginPath();g.moveTo(x,y+jit(1,4));g.lineTo(x+w*frac,y+jit(2,4)-4);g.lineTo(x+w*frac+6,y+h+jit(3,4));g.lineTo(x-4,y+h+4);g.closePath();g.fill();g.restore();}
function hand(txt,x,y,size,color,align,font,rot){g.save();g.translate(x,y);g.rotate((rot||0)+jit(txt.length,0.01));g.font=`${font==='PM'?'':'700 '}${size}px ${font||'CV'}`;
  g.fillStyle=color||INK;g.textAlign=align||'center';g.textBaseline='middle';g.fillText(txt,0,0);g.restore();}
function writeOn(txt,x,y,size,color,frac,font,align){ // reveal handwriting left to right
  if(frac<=0)return; g.save(); g.font=`${font==='PM'?'':'700 '}${size}px ${font||'PM'}`; const w=g.measureText(txt).width;
  const x0=align==='left'?x:x-w/2; if(frac<0.99){const m=g.getTransform();const px=x0+(w+40)*frac-20,py=y+size*0.3;PENCIL={x:m.a*px+m.c*py+m.e,y:m.b*px+m.d*py+m.f};} g.beginPath(); g.rect(x0-20,y-size,(w+40)*frac,size*2); g.clip();
  g.fillStyle=color||INK; g.textAlign='left'; g.textBaseline='middle'; g.fillText(txt,x0+jit(5,1.5),y+jit(6,1.5)); g.restore(); return w;}
function circleScribble(x,y,rx,ry,color,frac,seed){const p=[];for(let i=0;i<=46;i++){const a=-0.6+i/40*Math.PI*2;p.push({x:x+Math.cos(a)*rx*(1+0.04*Math.sin(i)),y:y+Math.sin(a)*ry});}sketchPath(p,color,6,frac,seed||3);}
function tape(x,y,w,h,rot){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle='rgba(235,220,170,0.85)';g.shadowColor='rgba(0,0,0,0.15)';g.shadowBlur=8;
  g.beginPath();g.moveTo(-w/2,-h/2);for(let i=0;i<=8;i++)g.lineTo(-w/2+w*i/8,-h/2+(i%2?3:-3));g.lineTo(w/2,h/2);for(let i=8;i>=0;i--)g.lineTo(-w/2+w*i/8,h/2+(i%2?3:-3));g.closePath();g.fill();g.restore();}
function sticky(x,y,w,h,rot,color,a){g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(rot);g.shadowColor='rgba(0,0,0,0.25)';g.shadowBlur=22;g.shadowOffsetY=10;
  g.fillStyle=color;g.fillRect(-w/2,-h/2,w,h);g.shadowColor='transparent';g.fillStyle='rgba(0,0,0,0.06)';g.fillRect(-w/2,-h/2,w,26);g.restore();}

function drawPencil(p){g.save();g.translate(p.x,p.y);g.rotate(-0.95);
  g.shadowColor='rgba(0,0,0,0.28)';g.shadowBlur=16;g.shadowOffsetX=18;g.shadowOffsetY=22;
  g.fillStyle='#f2b632';g.fillRect(44,-13,320,26);g.shadowColor='transparent';
  g.fillStyle='#d9971a';g.fillRect(44,5,320,8);g.fillStyle='#ffd25e';g.fillRect(44,-13,320,6);
  g.fillStyle='#f1d3a6';g.beginPath();g.moveTo(44,-13);g.lineTo(0,0);g.lineTo(44,13);g.closePath();g.fill();
  g.fillStyle='#2a2d35';g.beginPath();g.moveTo(13,-4);g.lineTo(0,0);g.lineTo(13,4);g.closePath();g.fill();
  g.fillStyle='#bfc3c9';g.fillRect(364,-13,30,26);g.fillStyle='#9aa0a8';g.fillRect(372,-13,4,26);g.fillRect(382,-13,4,26);
  g.fillStyle='#e88d93';rr2(394,-13,34,26,8);g.fill();g.restore();}
function rr2(x,y,w,h,r){g.beginPath();g.moveTo(x,y);g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.lineTo(x,y+h);g.closePath();}
function polaroid(img,x,y,w,h,rot,cap,a,sc){ if(a<=0)return; sc=sc||1;
  g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(rot);g.scale(sc,sc);
  const pad=26,bottom=120,W2=w+pad*2,H2=h+pad+bottom;
  g.shadowColor='rgba(40,30,10,0.35)';g.shadowBlur=34;g.shadowOffsetY=16;g.fillStyle='#fdfcf8';g.fillRect(-W2/2,-H2/2,W2,H2);g.shadowColor='transparent';
  g.drawImage(img,-w/2,-H2/2+pad,w,h);
  const vg=g.createRadialGradient(0,-H2/2+pad+h/2,h*0.3,0,-H2/2+pad+h/2,h*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(40,20,0,0.25)');
  g.fillStyle=vg;g.fillRect(-w/2,-H2/2+pad,w,h);g.fillStyle='rgba(255,215,160,0.07)';g.fillRect(-w/2,-H2/2+pad,w,h);
  if(cap){g.font='700 66px CV';g.fillStyle=INK;g.textAlign='center';g.textBaseline='middle';g.fillText(cap,0,H2/2-bottom/2+6);}
  g.save();g.translate(0,-H2/2+4);g.rotate(0.05);g.fillStyle='rgba(235,220,170,0.88)';g.fillRect(-100,-26,200,52);g.restore();
  g.restore();}
function stamp(txt,x,y,rot,color,a,size){ if(a<=0)return; size=size||64; const sc=lerp(1.8,1,easeOut(a));
  g.save();g.globalAlpha=Math.min(1,a*1.5)*0.88;g.translate(x,y);g.rotate(rot);g.scale(sc,sc);g.font=size+'px PM';const w=g.measureText(txt).width+60,h=size*1.55;
  g.strokeStyle=color;g.lineWidth=7;g.strokeRect(-w/2,-h/2,w,h);g.lineWidth=3;g.strokeRect(-w/2+10,-h/2+10,w-20,h-20);
  g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,4);
  g.globalCompositeOperation='destination-out';for(let i=0;i<160;i++){g.fillStyle=`rgba(0,0,0,${0.5+rnd(i)*0.5})`;g.fillRect((rnd(i+3)-.5)*w,(rnd(i+7)-.5)*h,2+rnd(i+1)*5,2+rnd(i+2)*4);}
  g.restore();}
function star(x,y,r,color,seed){const p=[];for(let i=0;i<=10;i++){const rr_=i%2?r*0.45:r;const an=-Math.PI/2+i/10*Math.PI*2;p.push({x:x+Math.cos(an)*rr_,y:y+Math.sin(an)*rr_});}sketchPath(p,color,4,1,seed,false);}

// ---------- karts (doodled, top view) ----------
function kartDoodle(x,y,ang,color,label,s,seed){
  s=s||1;g.save();g.translate(x,y);g.rotate(ang+Math.PI/2);g.scale(s,s);
  const box=(bx,by,bw,bh,c,w,fill)=>{const p=[{x:bx,y:by},{x:bx+bw,y:by},{x:bx+bw,y:by+bh},{x:bx,y:by+bh},{x:bx,y:by}];
    if(fill){g.save();g.fillStyle=fill;g.globalAlpha=.85;g.beginPath();p.forEach((q,i)=>i?g.lineTo(q.x+jit(seed+i,3),q.y+jit(seed+i+5,3)):g.moveTo(q.x,q.y));g.fill();g.restore();}
    sketchPath(p,c,w,1,seed+bx|0);};
  for(const [wx,wy] of [[-36,-38],[36,-38],[-38,30],[38,30]])box(wx-10,wy-15,20,30,INK,4,'#2b2b2b');
  if(color==='M'){box(-22,-52,44,104,INK,5,'#1c1c22');
    for(const [a,b] of [[-14,-40],[10,-20],[-12,0],[12,22],[-10,40]]){} 
    sketchPath([{x:-16,y:-44},{x:12,y:-30},{x:-14,y:-18},{x:14,y:-6}],RED,5,1,seed+3,false);
    sketchPath([{x:-16,y:36},{x:14,y:24},{x:-12,y:46}],RED,5,1,seed+7,false);}
  else box(-22,-52,44,104,INK,5,color);
  box(-16,-4,32,34,INK,4,'#fff');
  g.fillStyle=color==='M'?'#2456c9':INK;g.beginPath();g.arc(jit(seed,1.5),10,11,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(jit(seed,1.5),10,5,0,7);g.fill();
  g.restore();
  if(color==='M'){g.save();g.translate(x,y);g.rotate(ang+Math.PI/2);g.font='40px PM';g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText('2',0,-30*s);g.restore();}
  if(label){if(color==='M')hand('Mauro',x+62*s,y+10,46,RED,'left','CV');else hand(label,x-62*s,y+10,46,BLUE,'right','CV');}
}
function speedLines(x,y,n,len,seed,color){for(let i=0;i<n;i++){const ox=(rnd(seed+i)-.5)*90, oy=60+rnd(seed+i+3)*50;sketchPath(lineP({x:x+ox,y:y+oy},{x:x+ox,y:y+oy+len*(0.6+rnd(i)*0.6)},3),color||INK,3,1,seed+i*7,false);}}
function airSwirls(x,y,t,frac){ // turbulent air behind rival
  for(let i=0;i<5;i++){const yy=y+70+i*42+((t*120)%42); const amp=10+i*5; const p=[];
    for(let k=0;k<=12;k++)p.push({x:x-70+k*12,y:yy+Math.sin(k*0.9+t*8+i)*amp*0.4});
    g.save();g.globalAlpha=0.6*frac*(1-i/6);sketchPath(p,BLUE,3,1,i*13,false);g.restore();}
}
function boom(x,y,s,a){if(a<=0)return;g.save();g.globalAlpha=a;g.translate(x,y);g.scale(s,s);const p=[];
  for(let i=0;i<=16;i++){const r=i%2?60:120;const an=i/16*Math.PI*2;p.push({x:Math.cos(an)*r,y:Math.sin(an)*r});}
  g.fillStyle='#ffd23d';g.beginPath();p.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.closePath();g.fill();
  sketchPath(p,RED,6,1,9);hand('¡PUM!',0,4,64,RED,'center','PM');g.restore();}

// ---------- track (screen coords) ----------
const C={x:820,y:880}, RIN=70, ROUT=490, XL=C.x-ROUT, XR=C.x-RIN, YB=1330;
function drawTrack(frac){
  const outer=[...lineP({x:XL,y:YB},{x:XL,y:C.y}),...arcP(C,ROUT,Math.PI,1.5*Math.PI,40),...lineP({x:C.x,y:C.y-ROUT},{x:1120,y:C.y-ROUT})];
  const inner=[...lineP({x:XR,y:YB},{x:XR,y:C.y}),...arcP(C,RIN,Math.PI,1.5*Math.PI,12),...lineP({x:C.x,y:C.y-RIN},{x:1120,y:C.y-RIN})];
  // pencil hatching of asphalt
  if(frac>0.9){g.save();g.globalAlpha=0.10;g.beginPath();
    outer.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)); [...inner].reverse().forEach(q=>g.lineTo(q.x,q.y)); g.closePath(); g.clip();
    g.strokeStyle=INK;g.lineWidth=2;for(let k=-1600;k<1600;k+=22){g.beginPath();g.moveTo(k,0);g.lineTo(k+1500,1500);g.stroke();}g.restore();}
  sketchPath(outer,INK,7,frac,11); sketchPath(inner,INK,7,frac,23);
  // kerb ticks on inner corner
  if(frac>0.95){const ks=arcP(C,RIN+14,Math.PI,1.5*Math.PI,10);for(let i=0;i<ks.length-1;i+=2)sketchPath([ks[i],ks[i+1]],RED,12,1,i,false);}
}
// lanes
const LANE_OUT=XL+120, LANE_IN=XR-110;
const PATH_M_IN=curveP([{x:LANE_IN,y:1170},{x:LANE_IN,y:950},{x:C.x-RIN-55,y:C.y-20},{x:C.x-40,y:C.y-RIN-60},{x:1150,y:C.y-RIN-70}],24);
const PATH_R_OUT=curveP([{x:LANE_OUT,y:1150},{x:LANE_OUT,y:900},{x:LANE_OUT+90,y:620},{x:C.x,y:C.y-ROUT+120},{x:1150,y:C.y-ROUT+110}],24);

// ---------- chrome ----------
function title(l1,l2,lt,a){
  g.save();g.globalAlpha=a;
  writeOn(l1,W/2,190,74,INK,prog(lt,0.0,0.45),'PM');
  g.font='92px PM'; const w=g.measureText(l2).width;
  highlight(W/2-w/2-20,262,w+40,74,easeOut(prog(lt,0.35,0.75)));
  writeOn(l2,W/2,300,92,RED,prog(lt,0.3,0.8),'PM');
  g.restore();
}
function caption(t){
  let sc=TIM.scenes.find(s=>t>=s.start-0.05&&t<=s.end+0.35); if(!sc)return;
  const ws=sc.words; let idx=ws.findIndex(w=>t<w.e); if(idx<0)idx=ws.length-1;
  const start=Math.floor(idx/3)*3, chunk=ws.slice(start,start+3);
  const txts=chunk.map(w=>w.w.replace(/[¿?,.:]/g,''));
  g.save(); g.font='700 84px CV'; const gap=26; const widths=txts.map(s=>g.measureText(s).width); const tw=widths.reduce((a,b)=>a+b,0)+gap*(txts.length-1);
  const y=1475; tape(W/2,y,tw+150,128,-0.015+jit(1,0.004));
  let x=W/2-tw/2;
  txts.forEach((s,k)=>{const i=start+k, w=chunk[k], active=i===idx&&t>=w.s-0.05;
    hand(s,x,y+4,84,active?RED:(i<idx?INK:'rgba(29,42,74,0.45)'),'left','CV');
    if(active){const f=prog(t,w.s-0.05,w.s+0.25);sketchPath(lineP({x:x,y:y+44},{x:x+widths[k]*f,y:y+40}),RED,6,1,i*5,false);}
    x+=widths[k]+gap;});
  g.restore();
}
function stepBadges(active){
  const labels=['1 REBUFO','2 POR DENTRO','3 FRENA RECTO']; const y=1665; const xs=[215,535,865];
  labels.forEach((l,i)=>{const on=active.includes(i+1); g.save(); g.globalAlpha=on?1:0.35;
    g.font='700 44px CV'; const w=g.measureText(l).width;
    hand(l,xs[i],y,44,on?INK:INK,'center','CV');
    if(on)circleScribble(xs[i],y+2,w/2+18,40,RED,1,i*11);
    g.restore();});
}
