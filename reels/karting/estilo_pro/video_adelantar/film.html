<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:BC;src:url(bc_800.ttf);font-weight:100 900;font-style:italic}@font-face{font-family:BC6;src:url(bc_600.ttf);font-weight:100 900;font-style:italic}html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,cv=document.getElementById('c'),g=cv.getContext('2d');
const RED='#E10600',RED2='#8C0400',INK='#0B0B0E',WH='#FFFFFF',GREY='#2A2A31';
let TIM,IM={},CARB;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,f)=>a+(b-a)*f;
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)},eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const S=i=>TIM.scenes[i];
function wT(k,p,n){const ws=S(k).words.filter(w=>w.w.toLowerCase().replace(/[¡!¿?,.:]/g,'').startsWith(p));return ws[n||0]?ws[n||0].s:1e9;}
function talking(t){for(const s of TIM.scenes)for(const w of s.words)if(t>=w.s-0.02&&t<=w.e)return 1;return 0;}
// ---------- primitives ----------
function F(sz,w){return `italic ${w||900} ${sz}px ${w===600?'BC6':'BC'}`;}
function txt(s,x,y,sz,c,al,w,a){g.save();if(a!=null)g.globalAlpha*=a;g.font=F(sz,w);g.fillStyle=c;g.textAlign=al||'left';g.textBaseline='alphabetic';g.fillText(s,x,y);g.restore();}
function tw(s,sz,w){g.font=F(sz,w);return g.measureText(s).width;}
function slash(x,y,w,h,c,k){k=k==null?0.35:k;g.fillStyle=c;g.beginPath();g.moveTo(x+h*k,y);g.lineTo(x+w+h*k,y);g.lineTo(x+w,y+h);g.lineTo(x,y+h);g.closePath();g.fill();}
function makeCarbon(){const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.fillStyle='#0d0d10';x.fillRect(0,0,24,24);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){const gr=x.createLinearGradient(i*12,j*12,i*12+12,j*12+12);const a=(i+j)%2;gr.addColorStop(0,a?'#1d1d23':'#121217');gr.addColorStop(1,a?'#121217':'#1d1d23');x.fillStyle=gr;x.fillRect(i*12,j*12,12,12);}return g.createPattern(c,'repeat');}
function bg(t,tint){g.fillStyle=CARB;g.fillRect(0,0,W,H);
  if(tint){g.fillStyle=tint;g.fillRect(0,0,W,H);}
  g.save();for(let i=0;i<10;i++){const o=((t*60+i*90)%900);g.strokeStyle=`rgba(225,6,0,${0.05+0.03*(i%3)})`;g.lineWidth=3;g.beginPath();g.moveTo(-300+o,H);g.lineTo(600+o,0);g.stroke();}g.restore();
  const v=g.createRadialGradient(W/2,H*0.45,150,W/2,H*0.5,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.88)');g.fillStyle=v;g.fillRect(0,0,W,H);}
function glow(x,y,r,a){const rg=g.createRadialGradient(x,y,10,x,y,r);rg.addColorStop(0,`rgba(225,6,0,${0.55*a})`);rg.addColorStop(1,'rgba(225,6,0,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,2*r,2*r);}
function logoTop(t){g.drawImage(IM.mo,64,150,250,250*IM.mo.height/IM.mo.width);}
// mascot: origin at feet, h = height
function mascot(x,y,h,t,o){o=o||{};const m=IM.m,k=h/m.height;const tk=talking(t);const bob=Math.sin(t*3)*4+(tk?Math.abs(Math.sin(t*16))*5:0);
  g.save();g.globalAlpha*=o.a==null?1:o.a;
  glow(x,y-h*0.55,h*0.6,0.9);
  g.fillStyle='rgba(0,0,0,0.6)';g.beginPath();g.ellipse(x,y+6,h*0.17,h*0.025,0,0,7);g.fill();
  g.translate(x,y-bob);g.rotate((o.rot||0)+Math.sin(t*1.7)*0.012);const sq=o.sq||1;g.scale(k/sq,k*sq);
  g.drawImage(m,-m.width/2,-m.height);
  // visor glint sweep every 2.5s
  const gp=((t+ (o.ph||0))%2.6)/0.6;if(gp<1){g.save();g.beginPath();g.ellipse(-m.width/2+285,-m.height+202,184,95,0,0,7);g.clip();g.globalCompositeOperation='lighter';
    const gx=-m.width/2+100+gp*400;const gr=g.createLinearGradient(gx-60,0,gx+60,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(0.5,'rgba(255,255,255,0.75)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.save();g.translate(gx,-m.height+200);g.rotate(0.4);g.fillRect(-60,-200,120,400);g.restore();g.restore();}
  g.restore();}
function mascotBust(x,y,r,t){const m=IM.m;g.save();g.translate(x,y+Math.sin(t*3)*4);
  g.fillStyle='rgba(0,0,0,0.6)';g.beginPath();g.arc(6,8,r,0,7);g.fill();g.beginPath();g.arc(0,0,r,0,7);g.fillStyle='#141418';g.fill();
  g.save();g.beginPath();g.arc(0,0,r-6,0,7);g.clip();glow(0,0,r*1.2,0.9);const s=(2*r)/430*(1+(talking(t)?0.03*Math.sin(t*30):0));g.drawImage(m,70,0,430,520,-215*s,-210*s,430*s,520*s);g.restore();
  g.lineWidth=8;g.strokeStyle=RED;g.beginPath();g.arc(0,0,r-2,0,7);g.stroke();g.restore();}
// broadcast caption (lower third)
function caption(t){const sc=TIM.scenes.find(s=>t>=s.start-0.05&&t<=s.end+0.3);if(!sc)return;const ws=sc.words;let idx=ws.findIndex(w=>t<w.e);if(idx<0)idx=ws.length-1;
  const st=Math.floor(idx/4)*4,ch=ws.slice(st,st+4);const sz=58;const words=ch.map(w=>w.w.toUpperCase().replace(/[,.:]/g,''));const gap=18;
  const wsz=words.map(s=>tw(s,sz));const tot=wsz.reduce((a,b)=>a+b,0)+gap*(words.length-1);const x0=W/2-tot/2,y=1430;
  g.save();g.fillStyle='rgba(0,0,0,0.88)';g.fillRect(x0-50,y-66,tot+100,96);g.fillStyle=RED;g.fillRect(x0-50,y-66,12,96);
  let x=x0;words.forEach((s,k)=>{const i=st+k,on=i===idx&&t>=ch[k].s-0.05;txt(s,x,y,sz,on?RED:(i<idx?WH:'rgba(255,255,255,0.45)'));x+=wsz[k]+gap;});g.restore();}
function stepHead(n,title,t,t0){const a=eo(prog(t,t0,t0+0.35));if(a<=0)return;g.save();
  txt(String(n).padStart(2,'0'),60,520,420,'rgba(255,255,255,0.06)');
  g.translate((1-a)*-300,0);g.fillStyle=RED;g.fillRect(70,300,14,150);txt('PASO '+String(n).padStart(2,'0'),110,360,52,RED);txt(title,110,445,104,WH);g.restore();}
function callout(x,y,x2,y2,label,sub,t,t0,col){const a=eo(prog(t,t0,t0+0.3));if(a<=0)return;g.save();g.strokeStyle=col||WH;g.lineWidth=4;g.beginPath();g.moveTo(x,y);const mx=lerp(x,x2,a),my=lerp(y,y2,a);g.lineTo(mx,my);if(a>0.99){g.lineTo(x2+(x2>x?220:-220),y2);}g.stroke();
  g.fillStyle=col||WH;g.beginPath();g.arc(x,y,9,0,7);g.fill();
  if(a>0.99){const al=x2>x?'left':'right';const ox=x2>x?10:-10;txt(label,x2+ox,y2-14,56,col||WH,al);if(sub)txt(sub,x2+ox,y2+36,30,'rgba(255,255,255,0.6)',al,600);}g.restore();}
function tag(s,x,y,bgc,fg,sz,t,t0){const a=back(prog(t,t0,t0+0.25));if(a<=0)return;g.save();g.translate(x,y);g.scale(a,a);const w=tw(s,sz)+sz*0.9;slash(-w/2,-sz*0.85,w,sz*1.25,bgc);txt(s,0,sz*0.18,sz,fg,'center');g.restore();}
// ---------- track world ----------
function kart(x,y,ang,s,body,hl,num){g.save();g.translate(x,y);g.rotate(ang+Math.PI/2);g.scale(s,s);
  g.fillStyle='rgba(0,0,0,0.6)';g.fillRect(-40,-60,84,140);
  g.fillStyle='#050506';[[-36,-40,22],[36,-40,22],[-40,36,26],[40,36,26]].forEach(([wx,wy,w])=>g.fillRect(wx-w/2,wy-17,w,34));
  g.fillStyle=body;g.beginPath();g.moveTo(0,-76);g.lineTo(26,-44);g.lineTo(28,56);g.lineTo(-28,56);g.lineTo(-26,-44);g.closePath();g.fill();
  if(body===WH){g.fillStyle=RED;g.fillRect(-6,-70,12,120);}
  g.fillStyle=hl;g.beginPath();g.arc(0,10,18,0,7);g.fill();if(num){txt(num,0,-24,30,body===WH?INK:WH,'center');}
  g.restore();}
const mK=(x,y,a,s)=>kart(x,y,a,s,WH,RED,'2'),rK=(x,y,a,s)=>kart(x,y,a,s,'#5A5A63','#232328');
function straight(t,off){const L=250,R=830;g.fillStyle=GREY;g.fillRect(L,0,R-L,H);
  g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=5;g.beginPath();g.moveTo(L+20,0);g.lineTo(L+20,H);g.moveTo(R-20,0);g.lineTo(R-20,H);g.stroke();
  g.save();g.setLineDash([60,80]);g.lineDashOffset=-off;g.strokeStyle='rgba(255,255,255,0.25)';g.lineWidth=6;g.beginPath();g.moveTo(540,0);g.lineTo(540,H);g.stroke();
  g.setLineDash([26,26]);g.lineWidth=16;g.strokeStyle=RED;g.beginPath();g.moveTo(L,0);g.lineTo(L,H);g.moveTo(R,0);g.lineTo(R,H);g.stroke();g.restore();}
const C={x:860,y:880},RIN=100,ROUT=520,XL=C.x-ROUT,XR=C.x-RIN;
function corner(t){g.save();g.strokeStyle=GREY;g.lineWidth=ROUT-RIN;g.lineCap='butt';const rm=(ROUT+RIN)/2;g.beginPath();g.moveTo(C.x-rm,H+20);g.lineTo(C.x-rm,C.y);g.arc(C.x,C.y,rm,Math.PI,1.5*Math.PI);g.lineTo(W+40,C.y-rm);g.stroke();
  g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=5;for(const r of [ROUT-18,RIN+18]){g.beginPath();g.moveTo(C.x-r,H+20);g.lineTo(C.x-r,C.y);g.arc(C.x,C.y,r,Math.PI,1.5*Math.PI);g.lineTo(W+40,C.y-r);g.stroke();}
  g.setLineDash([26,26]);g.lineWidth=16;g.strokeStyle=RED;g.beginPath();g.arc(C.x,C.y,RIN+4,Math.PI,1.5*Math.PI);g.stroke();g.beginPath();g.moveTo(W+40,C.y-ROUT+4);g.lineTo(C.x+120,C.y-ROUT+4);g.stroke();g.restore();
  // brake boards
  for(const [y,l] of [[1360,'100'],[1150,'50']]){g.fillStyle=WH;g.fillRect(XL-120,y-34,86,68);txt(l,XL-77,y+14,40,INK,'center');}
}
function curve(pts,n){n=n||24;const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  for(let k=0;k<n;k++){const u=k/n,u2=u*u,u3=u2*u;out.push([.5*(2*p1[0]+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),.5*(2*p1[1]+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)]);}}
  out.push(pts[pts.length-1]);let L=0;out[0].l=0;for(let i=1;i<out.length;i++){L+=Math.hypot(out[i][0]-out[i-1][0],out[i][1]-out[i-1][1]);out[i].l=L;}out.L=L;return out;}
function at(P,f){const l=clamp(f)*P.L;let i=1;while(i<P.length-1&&P[i].l<l)i++;const a=P[i-1],b=P[i],q=(l-a.l)/Math.max(1e-6,b.l-a.l);return {x:lerp(a[0],b[0],q),y:lerp(a[1],b[1],q),ang:Math.atan2(b[1]-a[1],b[0]-a[0])};}
function rline(P,f,col,lw,glowOn){if(f<=0)return;const e=at(P,f);g.save();g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';if(glowOn){g.shadowColor=col;g.shadowBlur=28;}
  g.beginPath();g.moveTo(P[0][0],P[0][1]);for(const p of P){if(p.l>f*P.L)break;g.lineTo(p[0],p[1]);}g.lineTo(e.x,e.y);g.stroke();g.restore();}
const LIN=XR-115,LOUT=XL+130;
const P_M=curve([[LIN,1200],[LIN,920],[C.x-RIN-70,C.y-30],[C.x-30,C.y-RIN-80],[1220,C.y-RIN-90]]);
const P_R=curve([[LOUT,1140],[LOUT,900],[LOUT+130,610],[C.x,C.y-ROUT+140],[1220,C.y-ROUT+130]]);
// ---------- transitions ----------
function wipes(t){for(let i=1;i<TIM.scenes.length;i++){const c=S(i).start-0.3;const f=prog(t,c-0.25,c+0.25);if(f<=0||f>=1)continue;const x=lerp(-1600,W+1600,eio(f));
  g.save();g.translate(x,H/2);g.rotate(0.38);g.fillStyle=INK;g.fillRect(-700,-2200,1400,4400);g.fillStyle=RED;g.fillRect(-760,-2200,60,4400);g.fillRect(700,-2200,24,4400);g.restore();}}
function flash(t,t0,d){const a=1-prog(t,t0,t0+(d||0.25));if(t>=t0&&a>0){g.fillStyle=`rgba(255,255,255,${0.7*a})`;g.fillRect(0,0,W,H);}}
// ---------- scenes ----------
function sceneIntro(t){bg(t);logoTop(t);
  // hook title at t=0
  const a1=eo(prog(t,0,0.35)),a2=eo(prog(t,0.15,0.5));
  g.save();g.translate((1-a1)*-400,0);txt('¿CÓMO',70,600,170,WH);g.restore();
  g.save();g.translate((1-a2)*400,0);txt('ADELANTAR?',70,770,190,RED);g.restore();
  const a3=eo(prog(t,0.5,0.8));if(a3>0){g.save();g.globalAlpha=a3;slash(70,810,430*a3,80,WH);txt('EN 3 PASOS',105,870,58,INK);g.restore();}
  // mascot slides in from right
  const m=eo(prog(t,0.7,1.4));mascot(lerp(1300,790,m),1720,860,t,{rot:(1-m)*0.2});
  // name plate
  const n=eo(prog(t,wT(0,'soy')-0.1,wT(0,'soy')+0.3));if(n>0){g.save();g.translate((1-n)*-500,0);slash(60,1120,470,96,RED);txt('MAURITO',90,1192,76,WH);slash(60,1220,300,58,WH);txt('PILOTO #2',85,1264,42,INK);g.restore();}
  flash(t,wT(0,'soy')-0.1,0.2);
  const q=back(prog(t,wT(0,'adelantar')-0.1,wT(0,'adelantar')+0.2));if(q>0){g.save();g.translate(820,330);g.rotate(-0.06);g.scale(q,q);slash(-170,-48,340,80,WH);txt('¿TE CUESTA?',0,14,48,INK,'center');g.restore();}
}
function scene1(t){bg(t);straight(t,t*900);const s0=S(1).start;
  const ry=860+Math.sin(t*2)*6,my=lerp(1560,1150,eio(prog(t,s0+0.4,s0+4.5)));
  const air=eo(prog(t,wT(1,'rompe')-0.2,wT(1,'rompe')+0.3));
  if(air>0){g.save();g.globalAlpha=air;const gr=g.createLinearGradient(0,ry+70,0,ry+400);gr.addColorStop(0,'rgba(225,6,0,0.45)');gr.addColorStop(1,'rgba(225,6,0,0)');g.fillStyle=gr;g.beginPath();g.moveTo(490,ry+70);g.lineTo(590,ry+70);g.lineTo(660,ry+420);g.lineTo(420,ry+420);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,0.5)';g.lineWidth=3;for(let i=0;i<7;i++){const yy=ry+90+((t*420+i*48)%330);g.beginPath();g.moveTo(470,yy);for(let x=470;x<=610;x+=10)g.lineTo(x,yy+Math.sin(x*0.07+t*12+i)*7);g.stroke();}g.restore();}
  rK(540,ry,-Math.PI/2,1.5);mK(540,my,-Math.PI/2,1.5);
  g.save();g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=3;for(let i=0;i<6;i++){const x=505+i*14;g.beginPath();g.moveTo(x,my+120+rnd(i)*20);g.lineTo(x,my+200+rnd(i+3)*80);g.stroke();}g.restore();
  stepHead(1,'EL REBUFO',t,s0-0.1);
  callout(600,ry+250,700,ry+170,'REBUFO','EL AIRE YA ESTÁ "ROTO"',t,wT(1,'rebufo')-0.15,RED);
  callout(470,my+20,330,my-40,'+ VELOCIDAD','MENOS AIRE EN CONTRA',t,wT(1,'velocidad')-0.15,WH);
  // telemetry
  const v=eo(prog(t,s0+0.4,s0+5));const kmh=Math.round(lerp(82,97,v));g.save();g.fillStyle='rgba(0,0,0,0.75)';g.fillRect(560,1240,450,110);txt('VELOCIDAD',590,1282,30,'rgba(255,255,255,0.7)');txt(kmh+' KM/H',985,1282,34,WH,'right');
  g.fillStyle='rgba(255,255,255,0.1)';g.fillRect(590,1305,390,14);g.fillStyle=RED;g.fillRect(590,1305,390*lerp(0.55,0.95,v),14);g.restore();
  mascotBust(940,1200,90,t);}
function scene2(t){bg(t);corner(t);const s0=S(2).start,d=S(2).end-s0+0.4;
  const f=eio(prog(t,s0+0.4,s0+d-0.5));const ry=lerp(1560,1230,prog(t,s0,s0+d));const mx=lerp(LOUT+10,LIN,f),my=lerp(1760,ry+20,f);
  const ar=eo(prog(t,s0+0.2,s0+1.1));if(ar>0){const P=curve([[LOUT+10,1760],[lerp(LOUT,LIN,0.6),1560],[LIN,ry+70]]);rline(P,ar,RED,10,true);}
  rK(LOUT,ry,-Math.PI/2,1.3);mK(mx,my,-Math.PI/2+0.3*Math.sin(f*Math.PI),1.3);
  stepHead(2,'POR DENTRO',t,s0-0.1);
  callout(LIN+40,ry-40,LIN+160,ry-190,'POR DENTRO','ANTES DE LA CURVA',t,wT(2,'dentro')-0.15,RED);
  mascotBust(940,1200,90,t);}
function scene3(t){bg(t);corner(t);const s0=S(3).start,ft=wT(3,'frena')-0.1,vt=wT(3,'vértice')-0.1,pass=vt+1.4;
  const z=eo(prog(t,ft,ft+0.3));if(z>0){g.save();g.globalAlpha=z;g.fillStyle='rgba(225,6,0,0.35)';g.fillRect(LIN-90,980,180,210);g.strokeStyle=RED;g.lineWidth=4;g.strokeRect(LIN-90,980,180,210);
    g.beginPath();g.rect(LIN-90,980,180,210);g.clip();g.strokeStyle='rgba(225,6,0,0.6)';g.lineWidth=6;for(let k=-10;k<10;k++){g.beginPath();g.moveTo(LIN-90+k*30,980);g.lineTo(LIN-90+k*30+210,1190);g.stroke();}g.restore();}
  tag('FRENA AQUÍ',LIN,1250,RED,WH,40,t,ft);
  const f=eio(prog(t,s0+0.9,pass)),g2=prog(t,pass,pass+1.3);
  const fm=lerp(0,0.86,f)+0.14*g2,fr=lerp(0,0.62,f)+0.25*g2;
  rline(P_M,fm,RED,9,true);const pm=at(P_M,fm),pr=at(P_R,fr);rK(pr.x,pr.y,pr.ang,1.2);mK(pm.x,pm.y,pm.ang,1.2);
  const av=eo(prog(t,vt,vt+0.3));if(av>0){g.save();g.globalAlpha=av;g.strokeStyle=WH;g.lineWidth=5;g.setLineDash([12,10]);g.beginPath();g.arc(C.x-RIN-45,C.y-45,62+Math.sin(t*8)*5,0,7);g.stroke();g.restore();
    callout(C.x-RIN-15,C.y-15,790,990,'VÉRTICE','PEGADO ADENTRO',t,vt,WH);}
  stepHead(3,'FRENA RECTO',t,s0-0.1);
  if(t>pass){tag('P1',pm.x,pm.y+150,RED,WH,64,t,pass);flash(t,pass,0.2);}
  mascotBust(940,1200,90,t);}
function scene4(t){const s0=S(4).start,ct=wT(4,'choques')-0.35,mt=wT(4,'metas')-0.1;
  const pulse=0.5+0.5*Math.sin(t*8);bg(t,`rgba(140,4,0,${0.25+0.15*pulse})`);
  const sh=t>ct?Math.exp(-(t-ct)*5)*16:0;g.save();g.translate(Math.sin(t*60)*sh,Math.cos(t*47)*sh);
  // warning stripes top/bottom
  for(const y of [220,1530]){g.save();g.beginPath();g.rect(0,y,W,40);g.clip();for(let x=-80+((t*140)%80);x<W+80;x+=80){g.fillStyle=RED;g.beginPath();g.moveTo(x,y);g.lineTo(x+40,y);g.lineTo(x+10,y+40);g.lineTo(x-30,y+40);g.closePath();g.fill();}g.restore();}
  const a=back(prog(t,s0-0.1,s0+0.2));g.save();g.translate(330,430);g.rotate(-0.06);g.scale(a,a);txt('¡OJO!',0,60,200,RED,'center');g.restore();

  const ia=eo(prog(t,s0+0.5,s0+0.9));if(ia>0){g.save();g.globalAlpha=ia;g.translate(W/2,860);g.fillStyle='rgba(0,0,0,0.85)';g.fillRect(-380,-300,760,600);g.strokeStyle=RED;g.lineWidth=4;g.strokeRect(-380,-300,760,600);
    g.fillStyle=GREY;g.fillRect(-230,-270,460,540);
    const dv=eio(prog(t,mt,ct));rK(-80,-50,-Math.PI/2,1.2);mK(lerp(110,0,dv),lerp(160,-10,dv),-Math.PI/2-0.55*dv,1.2);
    g.save();g.setLineDash([16,12]);g.strokeStyle=RED;g.lineWidth=5;g.beginPath();g.moveTo(-230,0);g.lineTo(230,0);g.stroke();g.restore();
    txt('SUS LLANTAS DE ATRÁS',0,-224,40,WH,'center');
    if(t<ct&&t>mt){g.save();g.translate(180,170);g.strokeStyle=RED;g.lineWidth=14;g.lineCap='round';g.beginPath();g.moveTo(-34,-34);g.lineTo(34,34);g.moveTo(34,-34);g.lineTo(-34,34);g.stroke();g.restore();}
    if(t>ct){const b=back(prog(t,ct,ct+0.2));g.save();g.translate(0,0);g.scale(b,b);g.fillStyle=RED;g.beginPath();for(let i=0;i<=20;i++){const rr=i%2?70:150,an=i/20*Math.PI*2;g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}g.closePath();g.fill();txt('¡PUM!',0,22,72,WH,'center');g.restore();}
    g.restore();}
  tag('NO TE METAS',W/2,1250,RED,WH,64,t,mt);
  g.restore();flash(t,ct,0.25);mascotBust(940,1300,90,t);}

  items.forEach(([n,l,s,ts],i)=>{const a=eo(prog(t,ts-0.2,ts+0.15));if(a<=0)return;const y=700+i*200;g.save();g.translate((1-a)*-700,0);

function scene6(t){bg(t);const s0=S(6).start-0.3;glow(W/2,700,600,0.8);

function render(t){g.setTransform(1,0,0,1,0,0);let k=0;TIM.scenes.forEach((s,i)=>{if(t>=s.start-0.3)k=i;});
  [sceneIntro,scene1,scene2,scene3,scene4,scene5,scene6][k](t);
  if(k>=1&&k<=4)caption(t);
  wipes(t);

  g.fillStyle='rgba(255,255,255,0.12)';g.fillRect(0,H-10,W,10);g.fillStyle=RED;g.fillRect(0,H-10,W*t/TIM.total,10);
  const fo=prog(t,TIM.total-0.5,TIM.total);if(fo>0){g.fillStyle=`rgba(0,0,0,${fo})`;g.fillRect(0,0,W,H);}}
