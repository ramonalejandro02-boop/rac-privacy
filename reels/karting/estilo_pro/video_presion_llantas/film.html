<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:BC;src:url(bc_800.ttf);font-weight:100 900;font-style:italic}@font-face{font-family:BC6;src:url(bc_600.ttf);font-weight:100 900;font-style:italic}html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,OUT=document.getElementById('c'),OG=OUT.getContext('2d');
const offA=document.createElement('canvas'),offB=document.createElement('canvas');offA.width=offB.width=W;offA.height=offB.height=H;
let g=OG;
const RED='#FF1E1E',RED2='#B30F0F',WH='#FFFFFF',BLUE='#3BA4FF',ORANGE='#FF8A1F';
let TIM,IM={};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,f)=>a+(b-a)*f;
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)},eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},eo5=x=>{x=clamp(x);return 1-Math.pow(1-x,5)};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6*x)*Math.cos(8*x);};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const S=i=>TIM.scenes[i];
function wT(k,p,n){const ws=S(k).words.filter(w=>w.w.toLowerCase().replace(/[¡!¿?,.:]/g,'').startsWith(p));return ws[n||0]?ws[n||0].s:S(k).start+0.5;}
function F(sz,w){return `italic ${w||900} ${sz}px ${w===600?'BC6':'BC'}`;}
function txt(s,x,y,sz,c,al,w,a){g.save();if(a!=null)g.globalAlpha*=a;g.font=F(sz,w);g.fillStyle=c;g.textAlign=al||'left';g.textBaseline='alphabetic';g.fillText(s,x,y);g.restore();}
function tw(s,sz,w){g.font=F(sz,w);return g.measureText(s).width;}
// mask-reveal title: slides up from a clip line with a soft glow
function reveal(s,x,y,sz,c,t,t0,al,glowC){const p=eo5(prog(t,t0,t0+0.55));if(p<=0)return;g.save();g.beginPath();g.rect(0,y-sz*1.05,W,sz*1.3);g.clip();
  g.translate(0,(1-p)*sz*1.1);if(glowC){g.shadowColor=glowC;g.shadowBlur=30;}txt(s,x,y,sz,c,al||'center');g.restore();}
function pill(s,x,y,sz,bgc,fg,t,t0){const p=eo5(prog(t,t0,t0+0.45));if(p<=0)return;g.save();g.globalAlpha=p;g.translate(x,y+(1-p)*30);const w=tw(s,sz)+sz*1.2,h=sz*1.5;
  g.fillStyle=bgc;g.beginPath();g.roundRect(-w/2,-h/2,w,h,h/2);g.fill();txt(s,0,sz*0.36,sz,fg,'center');g.restore();}
// ambient: black stage with soft red light, slow bokeh dust and a gentle light sweep
function stage(t,col){g.fillStyle='#000';g.fillRect(0,0,W,H);
  const c=col||'255,30,30';const rg=g.createRadialGradient(W/2,H*0.42,40,W/2,H*0.42,900);rg.addColorStop(0,`rgba(${c},0.16)`);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
  for(let i=0;i<26;i++){const x=(rnd(i)*W+t*12*(0.5+rnd(i+1)))%W,y=(rnd(i+2)*H-t*18*(0.4+rnd(i+3))+H*2)%H,r=2+rnd(i+4)*5;g.fillStyle=`rgba(255,${120+rnd(i+5)*120|0},${100+rnd(i+6)*100|0},${0.06+0.08*rnd(i+7)})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
}
function lightSweep(t,t0,dur){const p=prog(t,t0,t0+(dur||1.2));if(p<=0||p>=1)return;const x=lerp(-400,W+400,eio(p));g.save();g.globalCompositeOperation='lighter';const gr=g.createLinearGradient(x-200,0,x+200,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(0.5,'rgba(255,255,255,0.10)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore();}
// ---------- the kart tyre (side view) ----------
// heat: 0 cold(blue rim light) .. 1 hot (orange/red glow). spin: rotation angle. squash: -1 underinflated .. +1 over
function tyre(x,y,R,spin,heat,o){o=o||{};g.save();g.translate(x,y);
  const hot=clamp(heat||0);const glowC=hot>0.5?`rgba(255,${(140-110*(hot-0.5)*2)|0},40,${0.35+0.35*hot})`:`rgba(${(60+380*hot)|0},${(160-40*hot)|0},255,${0.25+0.2*(1-hot)})`;
  // outer glow
  const og=g.createRadialGradient(0,0,R*0.6,0,0,R*1.45);og.addColorStop(0,glowC);og.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=og;g.fillRect(-R*1.5,-R*1.5,R*3,R*3);
  // tyre rubber
  const rg=g.createRadialGradient(-R*0.25,-R*0.3,R*0.2,0,0,R);rg.addColorStop(0,'#2b2c31');rg.addColorStop(0.75,'#141518');rg.addColorStop(1,'#060607');g.fillStyle=rg;g.beginPath();g.arc(0,0,R,0,7);g.fill();
  // heat colouring of the rubber
  if(hot>0.05){g.save();g.globalCompositeOperation='lighter';const hg=g.createRadialGradient(0,0,R*0.62,0,0,R);hg.addColorStop(0,'rgba(0,0,0,0)');hg.addColorStop(1,`rgba(255,${(110-80*hot)|0},20,${0.55*hot})`);g.fillStyle=hg;g.beginPath();g.arc(0,0,R,0,7);g.fill();g.restore();}
  // sidewall rim-light arc + lettering
  g.save();g.strokeStyle='rgba(255,255,255,0.18)';g.lineWidth=R*0.03;g.beginPath();g.arc(0,0,R*0.96,-2.6,-1.1);g.stroke();g.restore();
  g.save();g.rotate(spin);g.font=F(R*0.11);g.fillStyle='rgba(255,255,255,0.22)';g.textAlign='center';g.textBaseline='middle';
  for(const [txt_,a0] of [['SLICK',0],['KART',Math.PI]]){const str=txt_;for(let i=0;i<str.length;i++){const a=a0-0.22+i*0.11;g.save();g.rotate(a);g.translate(0,-R*0.81);g.fillText(str[i],0,0);g.restore();}}g.restore();
  // rim (magnesium kart wheel)
  const r2=R*0.6;const mg=g.createLinearGradient(-r2,-r2,r2,r2);mg.addColorStop(0,'#F2F4F7');mg.addColorStop(0.45,'#A9AFB9');mg.addColorStop(1,'#5D636D');g.fillStyle=mg;g.beginPath();g.arc(0,0,r2,0,7);g.fill();
  g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=R*0.02;g.beginPath();g.arc(0,0,r2,0,7);g.stroke();
  g.fillStyle='rgba(0,0,0,0.18)';g.beginPath();g.arc(0,0,r2*0.82,0,7);g.fill();
  g.save();g.rotate(spin);for(let i=0;i<3;i++){g.rotate(Math.PI*2/3);g.fillStyle='#2A2D33';g.beginPath();g.arc(0,-r2*0.5,r2*0.09,0,7);g.fill();g.fillStyle='rgba(255,255,255,0.5)';g.beginPath();g.arc(-r2*0.02,-r2*0.52,r2*0.03,0,7);g.fill();}
  // valve
  g.fillStyle='#D9DDE3';g.fillRect(-r2*0.03,-r2*0.98,r2*0.06,r2*0.16);g.restore();
  const hub=g.createRadialGradient(-r2*0.1,-r2*0.1,2,0,0,r2*0.3);hub.addColorStop(0,'#fff');hub.addColorStop(1,'#7c828c');g.fillStyle=hub;g.beginPath();g.arc(0,0,r2*0.26,0,7);g.fill();
  g.fillStyle=RED;g.beginPath();g.arc(0,0,r2*0.1,0,7);g.fill();
  // glossy highlight
  g.save();g.globalAlpha=0.35;const gl=g.createLinearGradient(0,-R,0,0);gl.addColorStop(0,'rgba(255,255,255,0.7)');gl.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gl;g.beginPath();g.ellipse(-R*0.15,-R*0.62,R*0.55,R*0.22,-0.3,0,7);g.fill();g.restore();
  g.restore();}
// ---------- pressure gauge ----------
function gauge(x,y,R,val,max,t,label,col,band){col=col||RED;g.save();g.translate(x,y);
  const a0=Math.PI*0.75,a1=Math.PI*2.25,av=a0+(a1-a0)*clamp(val/max);
  g.shadowColor='rgba(0,0,0,0.8)';g.shadowBlur=40;const bz=g.createLinearGradient(0,-R,0,R);bz.addColorStop(0,'#3a3d44');bz.addColorStop(1,'#101114');g.fillStyle=bz;g.beginPath();g.arc(0,0,R,0,7);g.fill();g.shadowBlur=0;
  g.fillStyle='#07070A';g.beginPath();g.arc(0,0,R*0.9,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,0.08)';g.lineWidth=R*0.08;g.beginPath();g.arc(0,0,R*0.74,a0,a1);g.stroke();
  if(band){g.strokeStyle='rgba(59,164,255,0.55)';g.beginPath();g.arc(0,0,R*0.74,a0+(a1-a0)*band[0]/max,a0+(a1-a0)*band[1]/max);g.stroke();}
  g.save();g.shadowColor=col;g.shadowBlur=24;g.strokeStyle=col;g.lineWidth=R*0.08;g.lineCap='round';g.beginPath();g.arc(0,0,R*0.74,a0,av);g.stroke();g.restore();
  for(let i=0;i<=max;i+=(max>20?5:1)){const a=a0+(a1-a0)*i/max,big=i%(max>20?10:5)===0;g.strokeStyle=big?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.3)';g.lineWidth=big?4:2;g.beginPath();g.moveTo(Math.cos(a)*R*0.86,Math.sin(a)*R*0.86);g.lineTo(Math.cos(a)*R*(big?0.95:0.91)*0.95,Math.sin(a)*R*(big?0.95:0.91)*0.95);g.stroke();}
  g.save();g.rotate(av);g.shadowColor=col;g.shadowBlur=14;g.fillStyle=WH;g.beginPath();g.moveTo(-R*0.08,-R*0.025);g.lineTo(R*0.7,0);g.lineTo(-R*0.08,R*0.025);g.closePath();g.fill();g.restore();
  g.fillStyle='#1b1c20';g.beginPath();g.arc(0,0,R*0.1,0,7);g.fill();g.fillStyle=col;g.beginPath();g.arc(0,0,R*0.05,0,7);g.fill();
  txt(String(Math.round(val)),0,R*0.48,R*0.36,WH,'center');txt(label||'PSI',0,R*0.66,R*0.12,'rgba(255,255,255,0.6)','center');
  g.restore();}
// ---------- tyre cross-section on the ground ----------
// p: -1 underinflated (wide flat) .. 0 ok .. +1 over (round, small patch)
function section(x,y,w,p,col,t){g.save();g.translate(x,y);const hgt=w*0.62*(1+0.18*p),bot=lerp(w*0.48,w*0.14,(p+1)/2),side=w*(0.5+0.05*(-p));
  g.fillStyle='rgba(255,255,255,0.08)';g.fillRect(-W,0,2*W,3);
  // contact patch glow
  g.save();g.shadowColor=col;g.shadowBlur=30;g.fillStyle=col;g.beginPath();g.roundRect(-bot,-4,bot*2,10,5);g.fill();g.restore();
  // tyre profile
  const pr=new Path2D();pr.moveTo(-bot,0);pr.bezierCurveTo(-side*1.05,0,-side*1.02,-hgt*0.95,-side*0.62,-hgt);pr.lineTo(side*0.62,-hgt);pr.bezierCurveTo(side*1.02,-hgt*0.95,side*1.05,0,bot,0);pr.closePath();
  const tg=g.createLinearGradient(-side,0,side,0);tg.addColorStop(0,'#0b0b0d');tg.addColorStop(0.5,'#2a2b30');tg.addColorStop(1,'#0b0b0d');g.fillStyle=tg;g.fill(pr);g.strokeStyle='rgba(255,255,255,0.15)';g.lineWidth=3;g.stroke(pr);
  // rim inside
  g.fillStyle='#9aa0aa';g.beginPath();g.roundRect(-side*0.6,-hgt-6,side*1.2,26,8);g.fill();
  // air pressure arrows
  g.strokeStyle=`rgba(255,255,255,${0.25+0.25*(p+1)/2})`;g.lineWidth=4;for(let i=0;i<5;i++){const a=Math.PI*(0.15+i*0.175);const r0=hgt*0.25,r1=hgt*(0.38+0.08*p)+Math.sin(t*3+i)*3;g.beginPath();g.moveTo(Math.cos(a)*r0,-hgt*0.5+Math.sin(a)*r0*0.8);g.lineTo(Math.cos(a)*r1,-hgt*0.5+Math.sin(a)*r1*0.8);g.stroke();}
  g.restore();}
// ---------- kart on a smooth sweeping road (analytic path, no jitter) ----------
function road(t,cy,amp,speed,slide,col){const pts=[];for(let y=-200;y<=H+200;y+=20){pts.push([W/2+Math.sin((y+t*speed)*0.0035)*amp,y]);}
  g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle='#141518';g.lineWidth=420;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
  g.strokeStyle='rgba(255,255,255,0.55)';g.lineWidth=4;for(const off of [-190,190]){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0]+off,p[1]):g.moveTo(p[0]+off,p[1]));g.stroke();}
  g.setLineDash([60,80]);g.lineDashOffset=-t*speed;g.strokeStyle='rgba(255,255,255,0.12)';g.lineWidth=5;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore();
  const y=cy,x=W/2+Math.sin((y+t*speed)*0.0035)*amp,dx=Math.cos((y+t*speed)*0.0035)*amp*0.0035;const head=Math.atan2(-1,-dx)+Math.PI;// moving up the screen
  const ang=-Math.PI/2+Math.atan(dx)*-1;
  // slide trail
  if(slide>0){g.save();g.globalAlpha=0.35*slide;g.strokeStyle='#000';g.lineWidth=26;g.lineCap='round';for(const o of [-60,60]){g.beginPath();for(let k=0;k<18;k++){const yy=y+k*22,xx=W/2+Math.sin((yy+t*speed)*0.0035)*amp;k?g.lineTo(xx+o*Math.cos(slide*0.5),yy):g.moveTo(xx+o,yy);}g.stroke();}g.restore();}
  kartSprite(x,y,ang+slide*0.45*Math.sign(dx||1),0.9,col);}
function kartSprite(x,y,ang,s,tint){const im=IM.st,k=s*0.55;g.save();g.translate(x,y);g.rotate(ang+Math.PI/2);
  g.save();g.globalAlpha=0.6;g.filter='brightness(0) blur(16px)';g.drawImage(im,-im.width/2*k+12,-im.height/2*k+18,im.width*k,im.height*k);g.restore();
  if(tint)g.filter=tint;g.drawImage(im,-im.width/2*k,-im.height/2*k,im.width*k,im.height*k);g.filter='none';g.restore();}
// ---------- captions (lower third, soft) ----------
function caption(t){const sc=TIM.scenes.find(s=>t>=s.start-0.05&&t<=s.end+0.3);if(!sc)return;const ws=sc.words;let idx=ws.findIndex(w=>t<w.e);if(idx<0)idx=ws.length-1;
  const st=Math.floor(idx/4)*4,ch=ws.slice(st,st+4);const sz=56;const words=ch.map(w=>w.w.toUpperCase().replace(/[¡!,.:]/g,''));const gap=16;
  const wsz=words.map(s=>tw(s,sz));const tot=wsz.reduce((a,b)=>a+b,0)+gap*(words.length-1);const x0=W/2-tot/2,y=1440;
  g.save();g.fillStyle='rgba(10,10,12,0.82)';g.beginPath();g.roundRect(x0-44,y-64,tot+88,92,46);g.fill();
  let x=x0;words.forEach((s,k)=>{const i=st+k,on=i===idx&&t>=ch[k].s-0.05;g.save();if(on){g.shadowColor=RED;g.shadowBlur=18;}txt(s,x,y,sz,on?RED:(i<idx?WH:'rgba(255,255,255,0.45)'));g.restore();x+=wsz[k]+gap;});g.restore();}
function corner(t){const m=IM.m,r=78,x=950,y=1250;g.save();g.translate(x,y+Math.sin(t*2)*3);g.fillStyle='rgba(0,0,0,0.6)';g.beginPath();g.arc(0,0,r+6,0,7);g.fill();
  g.beginPath();g.arc(0,0,r,0,7);g.save();g.clip();const rg=g.createRadialGradient(0,0,5,0,0,r);rg.addColorStop(0,'rgba(255,30,30,0.5)');rg.addColorStop(1,'#120405');g.fillStyle=rg;g.fillRect(-r,-r,2*r,2*r);const s=(2*r)/430;g.drawImage(m,70,0,430,520,-215*s,-205*s,430*s,520*s);g.restore();
  g.strokeStyle=RED;g.lineWidth=5;g.beginPath();g.arc(0,0,r,0,7);g.stroke();g.restore();}
// ---------- scenes ----------
function s0(t){stage(t);const st=S(0).start;
  const a=eo5(prog(t,0,0.8));g.save();g.globalAlpha=a;tyre(W/2,820,330*lerp(0.85,1,a),t*0.6,0.1);g.restore();
  const gv=spring(prog(t,0.3,1.6))*12;gauge(W/2+250,1080,150,gv,40,t,'PSI',RED,null);
  reveal('MENOS DE LA',W/2,330,96,WH,t,0.15);reveal('MITAD DE AIRE',W/2,440,120,RED,t,0.3,'center',RED);
  pill('QUE UN CARRO',W/2,520,40,'rgba(255,255,255,0.12)',WH,t,wT(0,'carro')-0.2);lightSweep(t,0.6,1.4);}
function s1(t){stage(t);const st=S(1).start;
  const ca=eo5(prog(t,st,st+0.6)),ka=eo5(prog(t,st+0.25,st+0.85));
  g.save();g.globalAlpha=ca;tyre(290,760,210,t*0.4,0.2);g.restore();g.save();g.globalAlpha=ka;tyre(790,800,150,t*0.6,0.1);g.restore();
  reveal('CARRO',290,470,72,'rgba(255,255,255,0.75)',t,st);reveal('KART',790,560,72,RED,t,st+0.2,'center',RED);
  const cv=eo(prog(t,wT(1,'treinta')-0.2,wT(1,'treinta')+0.9))*32,kv=eo(prog(t,wT(1,'ocho')-0.2,wT(1,'quince')+0.6))*12;
  gauge(290,1130,150,cv,40,t,'PSI','#9aa0aa');gauge(790,1130,150,kv,40,t,'PSI',RED,[8,15]);
  pill('8 – 15 PSI · EN FRÍO',790,1330,34,'rgba(59,164,255,0.25)',WH,t,wT(1,'frío')-0.3);corner(t);}
function s2(t){stage(t,'255,120,30');const st=S(2).start;const h=eio(prog(t,wT(2,'calentarse')-0.3,wT(2,'calentarse')+1.6));
  tyre(W/2,780,300,t*1.6,h);
  // heat haze
  g.save();g.globalCompositeOperation='lighter';for(let i=0;i<14;i++){const ph=(t*0.5+rnd(i))%1;const x=W/2-220+rnd(i+3)*440+Math.sin(t*2+i)*14,y=480-ph*260;g.fillStyle=`rgba(255,${(140-60*h)|0},60,${0.12*h*(1-ph)})`;g.beginPath();g.ellipse(x,y,26,60,0,0,7);g.fill();}g.restore();
  gauge(W/2,1230,140,lerp(12,15,h),40,t,'PSI',h>0.5?ORANGE:BLUE);
  reveal('AL CALENTARSE',W/2,300,88,WH,t,st);reveal('+2 / +3 PSI',W/2,410,110,ORANGE,t,wT(2,'sube')-0.2,'center',ORANGE);corner(t);}
function s3(t){stage(t);const st=S(3).start,slideT=wT(3,'desliza')-0.6;const p=eio(prog(t,st,st+1));
  if(t<slideT){section(W/2,1050,520,p,RED,t);reveal('MUY ALTA',W/2,330,110,RED,t,st,'center',RED);pill('TOCA MENOS EL PISO',W/2,1140,40,'rgba(255,30,30,0.25)',WH,t,wT(3,'toca')-0.2);
    g.save();g.globalAlpha=eo(prog(t,wT(3,'toca'),wT(3,'toca')+0.4));g.strokeStyle=RED;g.lineWidth=3;g.setLineDash([8,8]);g.beginPath();g.moveTo(W/2-150,1010);g.lineTo(W/2-150,1060);g.moveTo(W/2+150,1010);g.lineTo(W/2+150,1060);g.stroke();g.restore();}
  else{const a=eo5(prog(t,slideT,slideT+0.5));g.save();g.globalAlpha=a;road(t,1000,260,700,eio(prog(t,slideT+0.2,slideT+1.2)));g.restore();reveal('¡DESLIZA!',W/2,330,140,RED,t,slideT+0.1,'center',RED);}
  corner(t);}
function s4(t){stage(t,'59,164,255');const st=S(4).start,slowT=wT(4,'pesado')-0.9;const p=-eio(prog(t,st,st+1));
  if(t<slowT){section(W/2,1050,520,p,BLUE,t);reveal('MUY BAJA',W/2,330,110,BLUE,t,st,'center',BLUE);pill('TARDA EN CALENTAR',W/2,1140,40,'rgba(59,164,255,0.25)',WH,t,wT(4,'tarda')-0.2);}
  else{const a=eo5(prog(t,slowT,slowT+0.5));g.save();g.globalAlpha=a;road(t,1000,160,220,0);g.restore();reveal('SE SIENTE PESADO',W/2,330,104,BLUE,t,slowT+0.1,'center',BLUE);
    // weight badge
    const b=eo5(prog(t,slowT+0.3,slowT+0.8));g.save();g.globalAlpha=b;g.translate(W/2+230,760);g.fillStyle='rgba(59,164,255,0.18)';g.beginPath();g.roundRect(-90,-70,180,140,24);g.fill();txt('KG',0,24,72,BLUE,'center');g.restore();}
  corner(t);}
function s5(t){stage(t);const st=S(5).start,sg=wT(5,'sigue')-0.5;
  if(t<sg){reveal('LA RUTINA PRO',W/2,330,96,WH,t,st);
