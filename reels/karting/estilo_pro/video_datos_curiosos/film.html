<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:BC;src:url(bc_800.ttf);font-weight:100 900;font-style:italic}@font-face{font-family:BC6;src:url(bc_600.ttf);font-weight:100 900;font-style:italic}html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,OUT=document.getElementById('c'),g=OUT.getContext('2d');
let TIM,IM={};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),prog=(t,a,b)=>clamp((t-a)/(b-a)),lerp=(a,b,f)=>a+(b-a)*f;
const eo5=x=>{x=clamp(x);return 1-Math.pow(1-x,5)},eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},spring=x=>{x=clamp(x);return 1-Math.exp(-6*x)*Math.cos(9*x);};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const S=i=>TIM.scenes[i];
function wT(k,p,n){const ws=S(k).words.filter(w=>w.w.toLowerCase().replace(/[¡!¿?,.:]/g,'').startsWith(p));return ws[n||0]?ws[n||0].s:S(k).start+0.4;}
const FL={green:{c:'#22D35B',d:'#0E7A33',rgb:'34,211,91',name:'VERDE'},yellow:{c:'#FFD21F',d:'#B38A00',rgb:'255,210,31',name:'AMARILLA'},blue:{c:'#2E8BFF',d:'#1046A8',rgb:'46,139,255',name:'AZUL'},
  red:{c:'#FF2A2A',d:'#9E0D0D',rgb:'255,42,42',name:'ROJA'},black:{c:'#2B2B31',d:'#050507',rgb:'200,200,210',name:'NEGRA'},check:{c:'#FFFFFF',d:'#111',rgb:'255,255,255',name:'CUADROS'}};
function F(sz,w){return `italic ${w||900} ${sz}px ${w===600?'BC6':'BC'}`;}
// ---------- typography: layered, gradient, on a curved ribbon ----------
function ribbon(x,y,w,h,col,p,tilt){if(p<=0)return;g.save();g.translate(x,y);g.rotate(tilt||-0.05);const ww=w*p;
  g.beginPath();g.moveTo(-ww/2-30,h*0.1);g.bezierCurveTo(-ww/4,-h*0.8,ww/4,-h*0.3,ww/2+30,-h*0.6);g.lineTo(ww/2+10,h*0.4);g.bezierCurveTo(ww/4,h*0.7,-ww/4,h*0.2,-ww/2-10,h*1.0);g.closePath();
  const lg=g.createLinearGradient(-ww/2,0,ww/2,0);lg.addColorStop(0,col);lg.addColorStop(1,'rgba(255,255,255,0.0)');g.fillStyle=lg;g.globalAlpha=0.9;g.fill();g.restore();}
function title(s,x,y,sz,f,t,t0,o){o=o||{};const p=eo5(prog(t,t0,t0+0.6));if(p<=0)return;g.save();g.translate(x,y+(1-p)*60);g.rotate(o.tilt||-0.04);g.globalAlpha=p;
  g.font=F(sz);g.textAlign=o.al||'center';g.textBaseline='alphabetic';
  // back extrusion layers
  for(let i=5;i>=1;i--){g.fillStyle=i===1?f.d:`rgba(0,0,0,${0.12*i})`;g.fillText(s,i*3,i*4);}
  g.lineWidth=sz*0.08;g.strokeStyle=f.c;g.lineJoin='round';g.strokeText(s,0,0);
  const lg=g.createLinearGradient(0,-sz,0,0);lg.addColorStop(0,'#FFFFFF');lg.addColorStop(1,o.fill||'#E6E8EE');g.fillStyle=lg;g.fillText(s,0,0);
  // shine sweep through letters
  const sh=prog(t,t0+0.4,t0+1.3);if(sh>0&&sh<1){g.save();const sx=lerp(-600,600,sh);const gr=g.createLinearGradient(sx-80,0,sx+80,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(0.5,'rgba(255,255,255,0.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillText(s,0,0);g.restore();}
  g.restore();}
function sub(s,x,y,sz,col,t,t0){const p=eo5(prog(t,t0,t0+0.5));if(p<=0)return;g.save();g.globalAlpha=p;g.font=F(sz);g.textAlign='center';g.fillStyle=col;g.shadowColor='rgba(0,0,0,0.8)';g.shadowBlur=20;
  const words=s.split(' ');let tot=g.measureText(s).width;let cx=x-tot/2;words.forEach((w_,i)=>{const pp=eo5(prog(t,t0+i*0.07,t0+i*0.07+0.4));g.save();g.globalAlpha=p*pp;g.textAlign='left';g.fillText(w_,cx,y+(1-pp)*30);g.restore();cx+=g.measureText(w_+' ').width;});g.restore();}
// ---------- props ----------
function kart(x,y,ang,s,tint,blur){const im=IM.st,k=s*0.5;g.save();g.translate(x,y);g.rotate(ang+Math.PI/2);
  if(blur){g.save();g.globalAlpha=0.13;for(let i=1;i<=4;i++)g.drawImage(im,-im.width/2*k,-im.height/2*k+i*22*blur,im.width*k,im.height*k);g.restore();}
  g.save();g.globalAlpha=0.6;g.filter='brightness(0) blur(16px)';g.drawImage(im,-im.width/2*k+10,-im.height/2*k+20,im.width*k,im.height*k);g.restore();
  if(tint)g.filter=tint;g.drawImage(im,-im.width/2*k,-im.height/2*k,im.width*k,im.height*k);g.filter='none';g.restore();}
// ---------- captions (soft blob) ----------
function caption(t){const sc=TIM.scenes.find(s=>t>=s.start-0.05&&t<=s.end+0.3);if(!sc)return;const ws=sc.words;let idx=ws.findIndex(w=>t<w.e);if(idx<0)idx=ws.length-1;
  const st=Math.floor(idx/4)*4,ch=ws.slice(st,st+4);const sz=46;const words=ch.map(w=>w.w.toUpperCase().replace(/[¡!¿?,.:]/g,''));const gap=16;g.font=F(sz);
  const wsz=words.map(s=>g.measureText(s).width);const tot=wsz.reduce((a,b)=>a+b,0)+gap*(words.length-1);const x0=W/2-tot/2,y=1580;
  g.save();const bgG=g.createLinearGradient(x0-50,0,x0+tot+50,0);bgG.addColorStop(0,'rgba(20,20,24,0.92)');bgG.addColorStop(1,'rgba(40,40,46,0.92)');g.fillStyle=bgG;g.beginPath();g.roundRect(x0-48,y-62,tot+96,90,45);g.fill();
  let x=x0;words.forEach((s,k)=>{const i=st+k,on=i===idx&&t>=ch[k].s-0.05;g.save();g.font=F(sz);g.fillStyle=on?CUR.c:(i<idx?'#fff':'rgba(255,255,255,0.45)');if(on){g.shadowColor=CUR.c;g.shadowBlur=18;}g.fillText(s,x,y);g.restore();x+=wsz[k]+gap;});g.restore();}
// ================= DATOS CURIOSOS v2: calm, coherent motion =================
const AC=[{c:'#FF2A2A',rgb:'255,42,42'},{c:'#22E1FF',rgb:'34,225,255'},{c:'#FF8A1F',rgb:'255,138,31'},{c:'#C06BFF',rgb:'192,107,255'},{c:'#3CFF8F',rgb:'60,255,143'},{c:'#FF2A2A',rgb:'255,42,42',d:'#6b0000'}];
let CUR=AC[0];const TAU=Math.PI*2;
function glow(col,b){g.shadowColor=col;g.shadowBlur=b;}
function bg2(t,a){g.fillStyle='#020203';g.fillRect(0,0,W,H);
  const rg=g.createRadialGradient(W/2,960,20,W/2,960,950);rg.addColorStop(0,`rgba(${a.rgb},0.16)`);rg.addColorStop(0.55,`rgba(${a.rgb},0.04)`);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
  for(let y=60;y<H;y+=60)for(let x=30;x<W;x+=60){const dd=Math.hypot(x-W/2,(y-960)*0.7)/850;const al=0.09*(1-clamp(dd));if(al<=0.01)continue;g.fillStyle=`rgba(${a.rgb},${al})`;g.fillRect(x-1.5,y-1.5,3,3);}
  const v=g.createRadialGradient(W/2,H*0.5,H*0.3,W/2,H*0.5,H*0.85);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.7)');g.fillStyle=v;g.fillRect(0,0,W,H);}
function stage(t,a){bg2(t,a);}
function header(k,t,ttl,subt,st,en){const a=AC[k];const p=eo5(prog(t,st,st+0.8));if(p<=0)return;
  g.save();g.globalAlpha=p;g.translate(170,300);
  g.fillStyle='rgba(12,12,16,0.95)';g.beginPath();g.arc(0,0,66,0,TAU);g.fill();g.lineWidth=4;g.strokeStyle='rgba(255,255,255,0.12)';g.stroke();
  g.strokeStyle=a.c;g.lineCap='round';g.lineWidth=5;g.beginPath();g.arc(0,0,66,-Math.PI/2,-Math.PI/2+TAU*eio(prog(t,st,en)));g.stroke();
  g.font=F(24,600);g.textAlign='center';g.fillStyle='rgba(255,255,255,0.6)';g.fillText(k<4?'DATO':'EXTRA',0,-22);g.font=F(64);g.fillStyle='#fff';g.fillText(k<4?String(k):'+',0,38);g.restore();
  g.save();g.globalAlpha=p;g.translate(262-(1-p)*30,0);g.font=F(72);g.textAlign='left';g.fillStyle='#fff';g.fillText(ttl,0,300);
  g.font=F(34,600);g.fillStyle=a.c;g.fillText(subt,3,350);
  g.strokeStyle=a.c;g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(3,374);g.lineTo(lerp(3,520,eo5(prog(t,st+0.3,st+1.3))),374);g.stroke();g.restore();}
function label(s,x,y,sz,col,a,al){if(a<=0)return;g.save();g.globalAlpha=a;g.font=F(sz,600);g.textAlign=al||'center';g.fillStyle=col;g.fillText(s,x,y+(1-a)*10);g.restore();}
function pill(s,x,y,col,a){if(a<=0)return;g.save();g.globalAlpha=a;g.font=F(32);const w=g.measureText(s).width+48;g.translate(x,y);g.fillStyle='rgba(12,12,16,0.92)';g.beginPath();g.roundRect(-w/2,-30,w,60,30);g.fill();g.lineWidth=3;g.strokeStyle=col;g.stroke();g.fillStyle='#fff';g.textAlign='center';g.fillText(s,0,11);g.restore();}
// fading trail drawn along an already-travelled path (pts in order, newest last)
function trail(pts,col,w){if(pts.length<2)return;g.save();g.lineCap='round';for(let i=1;i<pts.length;i++){const a=i/pts.length;g.strokeStyle=`rgba(${col},${0.5*a})`;g.lineWidth=w*a;g.beginPath();g.moveTo(pts[i-1].x,pts[i-1].y);g.lineTo(pts[i].x,pts[i].y);g.stroke();}g.restore();}
function bez(p,u){const m=1-u;return {x:m*m*m*p[0][0]+3*m*m*u*p[1][0]+3*m*u*u*p[2][0]+u*u*u*p[3][0],y:m*m*m*p[0][1]+3*m*m*u*p[1][1]+3*m*u*u*p[2][1]+u*u*u*p[3][1]};}
function bezd(p,u){const m=1-u;return {x:3*m*m*(p[1][0]-p[0][0])+6*m*u*(p[2][0]-p[1][0])+3*u*u*(p[3][0]-p[2][0]),y:3*m*m*(p[1][1]-p[0][1])+6*m*u*(p[2][1]-p[1][1])+3*u*u*(p[3][1]-p[2][1])};}
// kart riding a bezier: position + analytic heading + soft trail
function rideBez(P,u,s,col,trailLen){const p=bez(P,u),d=bezd(P,u);const pts=[];for(let i=12;i>=0;i--){const uu=u-trailLen*i/12;if(uu>=0)pts.push(bez(P,uu));}trail(pts,col,10);kart(p.x,p.y,Math.atan2(d.y,d.x),s,null,0);}
function nwheel(x,y,r,ang,col){g.save();g.translate(x,y);g.fillStyle='#0b0b0f';g.beginPath();g.arc(0,0,r,0,TAU);g.fill();g.strokeStyle=col;g.lineWidth=5;g.stroke();
  g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=3;g.beginPath();g.arc(0,0,r*0.55,0,TAU);g.stroke();g.rotate(ang);for(let i=0;i<3;i++){g.rotate(TAU/3);g.beginPath();g.moveTo(0,r*0.12);g.lineTo(0,r*0.5);g.stroke();}g.restore();}
function sideKart(cx,cy,hr,hf,bend,wang,col){const rx=cx-150,fx=cx+150,ry=cy-hr,fy=cy-hf;
  g.save();g.lineCap='round';g.lineJoin='round';const dx=cx-45;
  g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=4;g.fillStyle='rgba(20,20,26,0.95)';
  g.beginPath();g.moveTo(dx-32,ry-24);g.bezierCurveTo(dx-40,ry-88,dx-16,ry-120,dx+4,ry-128);g.lineTo(dx+32,ry-120);g.bezierCurveTo(dx+24,ry-88,dx+24,ry-56,dx+32,ry-32);g.closePath();g.fill();g.stroke();
  g.beginPath();g.moveTo(dx+16,ry-96);g.quadraticCurveTo(dx+72,ry-88,dx+100,fy-76);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.arc(dx+14,ry-160,32,0,TAU);g.fill();g.fillStyle=col;g.beginPath();g.ellipse(dx+30,ry-160,16,10,0,0,TAU);g.fill();
  g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=5;g.beginPath();g.moveTo(cx+120,fy-20);g.lineTo(cx+96,fy-76);g.stroke();g.beginPath();g.ellipse(cx+96,fy-76,8,26,0.4,0,TAU);g.stroke();
  g.fillStyle='rgba(30,30,38,0.95)';g.strokeStyle=col;g.lineWidth=3;g.beginPath();g.moveTo(dx-56,ry-96);g.quadraticCurveTo(dx-64,ry-16,dx-8,ry-12);g.lineTo(dx+48,ry-16);g.quadraticCurveTo(dx-16,ry-40,dx-40,ry-100);g.closePath();g.fill();g.stroke();
  const mx=(rx+fx)/2,my=(ry+fy)/2+10+bend;glow(col,16);g.strokeStyle=col;g.lineWidth=10;g.beginPath();g.moveTo(rx-24,ry-8);g.quadraticCurveTo(mx,my+14,fx+32,fy-6);g.stroke();
  g.shadowBlur=0;g.lineWidth=4;g.strokeStyle='#fff';g.beginPath();g.moveTo(rx-24,ry-8);g.quadraticCurveTo(mx,my+14,fx+32,fy-6);g.stroke();
  g.fillStyle='rgba(18,18,24,0.95)';g.strokeStyle=col;g.lineWidth=3;g.beginPath();g.moveTo(fx-32,fy-24);g.quadraticCurveTo(fx+48,fy-40,fx+76,fy-4);g.quadraticCurveTo(fx+48,fy+10,fx-24,fy+3);g.closePath();g.fill();g.stroke();
  g.beginPath();g.moveTo(rx-48,ry-24);g.quadraticCurveTo(rx-64,ry,rx-48,ry+22);g.stroke();g.restore();
  nwheel(rx,ry,46,wang,col);nwheel(fx,fy,40,wang*46/40,col);}
function coil(x,y,h,col,a){if(a<=0)return;g.save();g.globalAlpha=a;g.translate(x,y);g.strokeStyle=col;g.lineWidth=6;g.lineCap='round';g.beginPath();const n=6;for(let i=0;i<=n*16;i++){const u=i/(n*16);const xx=Math.sin(u*n*TAU)*28,yy=-u*h;i?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();
  g.fillStyle='#fff';g.beginPath();g.roundRect(-38,-h-10,76,10,5);g.fill();g.beginPath();g.roundRect(-38,0,76,10,5);g.fill();g.restore();}
const road=x=>12*Math.sin(x*TAU/640);
// ---------------- scenes ----------------
function s0(t){CUR=AC[0];bg2(t,AC[0]);
  title('DATOS CURIOSOS',W/2,330,96,{c:'#FF2A2A',d:'#6b0000'},t,0.0);title('DEL KARTING',W/2,430,84,{c:'#FF2A2A',d:'#6b0000'},t,0.15);
  const p=eo5(prog(t,0.1,1.3));g.save();g.translate(W/2,1000);g.font=F(560);g.textAlign='center';g.lineWidth=8;g.setLineDash([2200]);g.lineDashOffset=2200*(1-p);glow('#FF2A2A',24);g.strokeStyle='#FF2A2A';g.strokeText('3',0,200);g.setLineDash([]);g.shadowBlur=0;g.globalAlpha=0.10*p;g.fillStyle='#FF2A2A';g.fillText('3',0,200);g.restore();
  // one kart drives a racing line under the number and draws it
  const P=[[-80,1330],[300,1180],[780,1420],[1160,1250]];const u=eio(prog(t,0.4,4.2));
  g.save();g.globalAlpha=0.25;g.setLineDash([18,16]);g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(P[0][0],P[0][1]);g.bezierCurveTo(P[1][0],P[1][1],P[2][0],P[2][1],P[3][0],P[3][1]);g.stroke();g.restore();
  if(u>0&&u<1)rideBez(P,u,0.36,'255,42,42',0.18);
  pill('QUE TE HACEN MÁS RÁPIDO',W/2,1480,'#FF2A2A',eo5(prog(t,1.0,1.6)));}
function s1(t){const k=1,a=AC[k];CUR=a;bg2(t,a);const st=S(k).start-0.3,en=S(k).end;header(k,t,'SIN SUSPENSIÓN','EL CHASIS ES EL RESORTE',st,en);
  const vin=eo5(prog(t,st+0.2,st+1.0));const d=240*(t-st);const cx=480,cyy=1080;
  g.save();g.globalAlpha=vin;g.lineWidth=4;g.strokeStyle='rgba(255,255,255,0.45)';g.beginPath();for(let x=60;x<=1020;x+=8){const y=cyy+46-road(x+d);x>60?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();
  for(let i=0;i<9;i++){const x=((i*120-d)%1080+1080)%1080;if(x<70||x>1010)continue;g.strokeStyle='rgba(255,255,255,0.14)';g.lineWidth=3;g.beginPath();g.moveTo(x,cyy+66-road(x+d));g.lineTo(x-26,cyy+88-road(x+d));g.stroke();}
  const hr=road(cx-150+d),hf=road(cx+150+d);const bend=10+0.7*(hr+hf);sideKart(cx,cyy,hr,hf,bend,d/46,a.c);g.restore();
  const sx=wT(k,'suspensión')-0.3,cx2=wT(k,'chasis')-0.4;const ab=eo5(prog(t,sx,sx+0.6))*(1-eo5(prog(t,cx2,cx2+0.5)));
  if(ab>0){g.save();g.globalAlpha=ab;g.translate(860,690);g.strokeStyle='#fff';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(0,-70);g.lineTo(0,-32);g.moveTo(0,32);g.lineTo(0,70);g.stroke();g.beginPath();g.roundRect(-18,-32,36,64,8);g.stroke();
    g.strokeStyle='#FF2A2A';g.lineWidth=9;const xp=eo5(prog(t,sx+0.4,sx+1.0));g.beginPath();g.moveTo(-60,-60);g.lineTo(lerp(-60,60,xp),lerp(-60,60,xp));g.stroke();g.restore();label('SIN AMORTIGUADORES',860,800,28,'#fff',ab);}
  const ca=eo5(prog(t,cx2+0.2,cx2+0.9));if(ca>0){coil(860,780,150-bend,a.c,ca);label('SE DOBLA = RESORTE',860,840,28,'#fff',ca);}
  pill('CHASIS FLEXIBLE',W/2,1330,a.c,eo5(prog(t,wT(k,'resorte')-0.5,wT(k,'resorte')+0.1)));}
function s2(t){const k=2,a=AC[k];CUR=a;bg2(t,a);const st=S(k).start-0.3,en=S(k).end;header(k,t,'SIN DIFERENCIAL','UN EJE SÓLIDO',st,en);
  const ia=eo5(prog(t,st+0.3,st+1.1));if(ia>0){g.save();g.globalAlpha=ia;const y=640;const roll=(t-st)*70;
    const wheel=(x)=>{g.save();g.translate(x,y);g.fillStyle='#0c0c10';g.beginPath();g.roundRect(-34,-72,68,144,22);g.fill();g.strokeStyle=a.c;g.lineWidth=4;g.stroke();g.save();g.beginPath();g.roundRect(-34,-72,68,144,22);g.clip();
      g.strokeStyle='rgba(255,255,255,0.3)';g.lineWidth=6;for(let j=-3;j<8;j++){const yy=((j*36+roll)%396+396)%396-198;g.beginPath();g.moveTo(-30,yy);g.quadraticCurveTo(0,yy-10,30,yy);g.stroke();}g.restore();g.restore();};
    g.fillStyle=a.c;g.beginPath();g.roundRect(330,y-10,420,20,10);g.fill();wheel(300);wheel(780);
    const ra=eo5(prog(t,wT(k,'misma')-0.5,wT(k,'misma')));label('1800 RPM',300,y+125,36,'#fff',ra);label('1800 RPM',780,y+125,36,'#fff',ra);label('=',540,y-30,64,a.c,ra);g.restore();}
  label('MISMA VELOCIDAD',W/2,850,38,'#fff',eo5(prog(t,wT(k,'misma')-0.3,wT(k,'misma')+0.3)));
  const C={x:540,y:1480},R=330,th0=Math.PI*1.12,th1=Math.PI*1.88;const kp=eio(prog(t,st+0.8,en+0.2));const th=lerp(th0,th1,kp);
  g.save();g.lineCap='round';g.strokeStyle='rgba(255,255,255,0.06)';g.lineWidth=190;g.beginPath();g.arc(C.x,C.y,R,th0-0.08,th1+0.08);g.stroke();
  g.setLineDash([22,20]);g.strokeStyle='rgba(255,255,255,0.16)';g.lineWidth=3;g.beginPath();g.arc(C.x,C.y,R,th0-0.08,th1+0.08);g.stroke();g.setLineDash([]);
