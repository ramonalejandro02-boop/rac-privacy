  g.fillStyle='#fff';g.textBaseline='middle';g.fillText(mode,108,129);
  if(speed!=null){g.fillStyle='rgba(0,0,0,0.45)';rr(W-268,96,220,108,24);g.fill();g.fillStyle='#fff';g.font=F(900,62);g.textAlign='right';g.fillText(Math.round(speed),W-120,152);g.font=F(700,26);g.fillText('km/h',W-62,160);}
  g.restore();}
function grade(t){g.save();g.globalCompositeOperation='soft-light';g.fillStyle='rgba(255,170,90,0.18)';g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over';for(let i=0;i<900;i++){const v=rnd(i+Math.floor(t*30)*3.1);g.fillStyle=v>0.5?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.06)';g.fillRect(rnd(i*1.7+t)*W,rnd(i*2.3+t)*H,3,3);}g.restore();}
function vignette(a){const gr=g.createRadialGradient(W/2,H*0.45,H*0.25,W/2,H*0.5,H*0.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(0,0,0,${a})`);g.fillStyle=gr;g.fillRect(0,0,W,H);}
function wT(k,p,n){const ws=TIM.scenes[k].words.filter(w=>w.w.toLowerCase().replace(/[,.:]/g,'').startsWith(p));const w=ws[n||0];return w?w.s:1e9;}
function speedLines(a){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle='rgba(255,255,255,0.5)';g.lineWidth=3;for(let i=0;i<26;i++){const an=rnd(i)*Math.PI*2,r0=420+rnd(i+3)*200,len=120+rnd(i+5)*180;const cx=W/2,cy=H*0.47;
  const ph=(performance.now?0:0);g.beginPath();g.moveTo(cx+Math.cos(an)*r0,cy+Math.sin(an)*r0);g.lineTo(cx+Math.cos(an)*(r0+len),cy+Math.sin(an)*(r0+len));g.stroke();}g.restore();}

// ---------- main frame ----------
function setPOV(pose,line,lookTarget,headMix,t,shake){
  const eye=pose.p.clone();eye.y=0.92;
  const ahead=P(pose.s+13,line(pose.s+13),0.05);
  const look=ahead.clone().lerp(lookTarget,headMix);
  if(shake){look.x+=Math.sin(t*61)*shake;look.y+=Math.cos(t*53)*shake;eye.x+=Math.sin(t*47)*shake*0.05;}
  cam.position.copy(eye);cam.up.set(0,1,0);cam.lookAt(look);
  // roll into corner + vibration
  const curv=(line(pose.s+3)-line(pose.s-3));
  cam.rotateZ(-curv*0.01+Math.sin(t*38)*0.0025);
  POV.visible=true;KART.visible=false;blob.visible=false;
  const wheel=POV.userData.wheel; const k1=cl(pose.s).t, k2=cl(pose.s+6).t; const turn=Math.atan2(k1.x*k2.z-k1.z*k2.x,k1.x*k2.x+k1.z*k2.z);
  const dline=(line(pose.s+4)-line(pose.s))*0.05;
  wheel.rotation.z=clamp(-(turn*3.0)+dline*-6,-1.2,1.2);
}
function placeKart(pose){KART.visible=true;blob.visible=true;POV.visible=false;KART.position.copy(pose.p);KART.rotation.set(0,pose.yaw+Math.PI,0);blob.position.set(pose.p.x,0.015,pose.p.z);blob.rotation.z=-pose.yaw;}

function render(t){
  const S=TIM.scenes;
  const sA=S[0].start, endA=S[2].start-0.55, rwStart=endA, rwEnd=S[2].start;
  let mode='VISTA DEL PILOTO', speed=null, overlay=[];
  g.setTransform(1,0,0,1,0,0);
  if(t<rwStart){ // ---- BAD RUN ----
    const freezeT=wT(1,'tarde')-0.1; const tt=Math.min(t,freezeT);
    const pose=kartPose(RUN_A,lineBad,tt);
    const gaze=P(pose.s+3.6,lineBad(pose.s+3.6),0);
    const frozen=t>=freezeT;
    setPOV(pose,lineBad,gaze,0.55,tt,frozen?0:(pose.d<-6?0.25:0));
    renderer.render(scene,cam);
    if(frozen){g.filter='grayscale(0.9) contrast(1.1)';}
    g.drawImage(renderer.domElement,0,0);g.filter='none';
    speed=speedOf(RUN_A,tt);
    vignette(0.55);
    const gp=proj(gaze);
    reticle(gp,'#ff3b30',(t*1.4)%1,60);
    if(t<S[0].end+0.3){ // hook text
      const a1=easeOut(prog(t,0.05,0.3));bigText(['SI MIRAS','AQUÍ...'],520,a1,[150,150],['#fff','#ff3b30']);
      const arrow=prog(t,0.4,0.8);if(arrow>0){g.save();g.globalAlpha=arrow;g.strokeStyle='#ff3b30';g.lineWidth=12;g.lineCap='round';g.beginPath();g.moveTo(W/2,720);g.quadraticCurveTo(W/2+120,(720+gp.y)/2,gp.x+20,gp.y-80);g.stroke();
        g.beginPath();g.moveTo(gp.x+20,gp.y-80);g.lineTo(gp.x-8,gp.y-118);g.moveTo(gp.x+20,gp.y-80);g.lineTo(gp.x+58,gp.y-104);g.stroke();g.restore();}
      if(t>wT(0,'perder')-0.15){bigText(['PIERDES','LA CURVA'],880,easeOut(prog(t,wT(0,'perder')-0.15,wT(0,'perder')+0.1)),[118,118],['#fff','#fff']);}
    } else {
      pill('✕ MIRA MUY CERCA',gp.x,gp.y+110,'#ff3b30','#fff',36);
      if(t>wT(1,'manos')-0.1&&t<wT(1,'miras')-0.2){bigText(['TUS MANOS','SIGUEN A','TUS OJOS'],470,easeOut(prog(t,wT(1,'manos')-0.1,wT(1,'manos')+0.2)),[112,112,112],['#fff','#fff','#ffd60a']);}
      if(frozen){const a=easeOut(prog(t,freezeT,freezeT+0.25));g.fillStyle=`rgba(255,40,30,${0.18*a})`;g.fillRect(0,0,W,H);
        g.save();g.translate(W/2,560);g.rotate(-0.08);g.scale(lerp(1.6,1,a),lerp(1.6,1,a));g.globalAlpha=a;g.font=F(900,210);g.textAlign='center';g.textBaseline='middle';g.lineWidth=22;g.strokeStyle='#000';g.strokeText('TARDE.',0,0);g.fillStyle='#ff3b30';g.fillText('TARDE.',0,0);g.restore();}
    }
    hud(t,frozen?null:speed,'MIRADA DEL PILOTO');if(frozen)speed=0;
  } else if(t<rwEnd){ // ---- REWIND ----
    const f=prog(t,rwStart,rwEnd); const tt=lerp(wT(1,'tarde')-0.1,S[0].start+1.0,ease(f));
    const pose=kartPose(RUN_A,lineBad,tt);setPOV(pose,lineBad,P(pose.s+3.6,lineBad(pose.s+3.6),0),0.55,tt,0);renderer.render(scene,cam);
    g.globalAlpha=1;g.drawImage(renderer.domElement,-10,0);g.globalCompositeOperation='lighter';g.globalAlpha=0.35;g.drawImage(renderer.domElement,12,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;
    g.fillStyle='rgba(0,0,0,0.25)';for(let y=0;y<H;y+=6)g.fillRect(0,y,W,2);
    for(let i=0;i<4;i++){const y=(rnd(i+Math.floor(t*30))*H);g.fillStyle='rgba(255,255,255,0.18)';g.fillRect(0,y,W,8+rnd(i)*30);}
    bigText(['◀◀ OTRA VEZ'],H*0.42,1,[110],['#fff']);
  } else if(t<S[4].start-0.2){ // ---- GOOD RUN ----
    const pose=kartPose(RUN_B,lineGood,t);
    const tB=wT(2,'frenar')-0.25, tA=wT(3,'vértice')-0.2, tE=wT(3,'salida')-0.25;
    const pts=[{t:-1,p:P(pose.s+16,lineGood(pose.s+16),0.3)},{t:tB,p:BRAKE()},{t:tA,p:APEX()},{t:tE,p:EXITP()}];
    // saccade between gaze targets
    let cur=pts[0].p, prev=pts[0].p, st=-1; for(let i=1;i<pts.length;i++){if(t>=pts[i].t){prev=i>1?pts[i-1].p:P(pose.s+16,lineGood(pose.s+16),0.3);cur=pts[i].p;st=pts[i].t;}}
    if(st<0)cur=pts[0].p;
    const sw=easeOut(prog(t,st,st+0.18)); const gaze=st<0?cur:prev.clone().lerp(cur,sw);
    // after passing exit gaze moves far ahead
    const late=prog(pose.s,S_EX-6,S_EX+4); const far=P(pose.s+30,lineGood(pose.s+30),0.3); const G=gaze.clone().lerp(far,late);
    setPOV(pose,lineGood,G,0.5,t,0);
    renderer.render(scene,cam);g.drawImage(renderer.domElement,0,0);vignette(0.45);
    speed=speedOf(RUN_B,t);
    const gp=proj(G);
    // trail of previous fixations
    g.save();[[tB,BRAKE(),'1'],[tA,APEX(),'2'],[tE,EXITP(),'3']].forEach(([ts,p,n])=>{if(t>ts+0.2){const q=proj(p);if(q.z<1){g.fillStyle='rgba(48,209,88,0.25)';g.beginPath();g.arc(q.x,q.y,36,0,7);g.fill();}}});g.restore();
    reticle(gp,'#30d158',(t*1.4)%1,58);
    const labels=[[tB,'1 · DÓNDE FRENAR'],[tA,'2 · EL VÉRTICE'],[tE,'3 · LA SALIDA']];let lab=null;labels.forEach(l=>{if(t>=l[0])lab=l;});
    if(lab&&late<0.5){const a=easeOut(prog(t,lab[0],lab[0]+0.25));g.save();g.globalAlpha=a;pill(lab[1],clamp(gp.x,250,W-250),clamp(gp.y,300,H-500)-120,'#30d158','#04210d',40);g.restore();}
    if(t<tB){const a=easeOut(prog(t,S[2].start,S[2].start+0.3));bigText(['MIRA','LEJOS'],470,a,[170,170],['#fff','#30d158']);}
    hud(t,speed,'MIRADA DEL PILOTO');
  } else if(t<S[5].start-0.25){ // ---- CHASE / OVERHEAD ----
    const pose=kartPose(RUN_C,lineGood,t);placeKart(pose);
    const back=cl(pose.s).t.clone().multiplyScalar(-1);
    const camP=pose.p.clone().addScaledVector(back,7.5).add(new THREE.Vector3(0,5.2,0));
    cam.position.copy(camP);cam.up.set(0,1,0);cam.lookAt(P(pose.s+9,lineGood(pose.s+9),0));
    renderer.render(scene,cam);g.drawImage(renderer.domElement,0,0);vignette(0.4);
    const head=proj(pose.p.clone().add(new THREE.Vector3(0,0.85,0)));
    let G=pose.s<85?BRAKE():pose.s<S_AP-2?APEX():pose.s<S_EX-2?EXITP():P(pose.s+25,lineGood(pose.s+25),0.2);
    const gp=proj(G);
    // future path glow
    g.save();g.strokeStyle='rgba(48,209,88,0.9)';g.lineWidth=10;g.lineCap='round';g.shadowColor='#30d158';g.shadowBlur=24;g.setLineDash([2,22]);
    g.beginPath();for(let s=pose.s+1;s<pose.s+45;s+=1){const q=proj(P(s,lineGood(s),0.05));if(q.z>1)continue;s===pose.s+1?g.moveTo(q.x,q.y):g.lineTo(q.x,q.y);}g.stroke();g.restore();
    // gaze beam
    g.save();const gr=g.createLinearGradient(head.x,head.y,gp.x,gp.y);gr.addColorStop(0,'rgba(255,214,10,0.95)');gr.addColorStop(1,'rgba(255,214,10,0.2)');g.strokeStyle=gr;g.lineWidth=8;g.beginPath();g.moveTo(head.x,head.y);g.lineTo(gp.x,gp.y);g.stroke();g.restore();
    reticle(gp,'#ffd60a',(t*1.5)%1,46);
    [[BRAKE(),'1'],[APEX(),'2'],[EXITP(),'3']].forEach(([p,n])=>{const q=proj(p);if(q.z<1){g.save();g.fillStyle='#30d158';g.beginPath();g.arc(q.x,q.y,26,0,7);g.fill();g.fillStyle='#04210d';g.font=F(900,32);g.textAlign='center';g.textBaseline='middle';g.fillText(n,q.x,q.y+1);g.restore();}});
    const a=easeOut(prog(t,S[4].start-0.1,S[4].start+0.25));bigText(['TUS OJOS VAN','UN PASO','ADELANTE'],430,a,[100,150,150],['#fff','#ffd60a','#ffd60a']);
    hud(t,null,'VISTA AÉREA');
  } else { // ---- MAURO ----
    const pose=kartPose(RUN_C,lineGood,S[5].start-0.3+(t-S[5].start)*0.25);placeKart(pose);
    const back=cl(pose.s).t.clone().multiplyScalar(-1);const camP=pose.p.clone().addScaledVector(back,6).add(new THREE.Vector3(1.5,3.2,0));cam.position.copy(camP);cam.lookAt(pose.p);
    renderer.render(scene,cam);g.filter='blur(14px) brightness(0.55)';g.drawImage(renderer.domElement,0,0);g.filter='none';
    const a=easeOut(prog(t,S[5].start-0.25,S[5].start+0.35));
    const cx=W/2,cy=820,size=760; g.save();g.globalAlpha=a;g.translate(cx,cy+(1-a)*120);
    g.shadowColor='rgba(0,0,0,0.6)';g.shadowBlur=50;g.fillStyle='#000';rr(-size/2,-size/2,size,size,36);g.fill();g.shadowBlur=0;
    g.save();rr(-size/2,-size/2,size,size,36);g.clip();g.drawImage(IMG,-size/2,-size/2,size,size);g.restore();
    g.strokeStyle='#ffd60a';g.lineWidth=8;const c=60,h=size/2+18;
    for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){g.beginPath();g.moveTo(sx*h,sy*(h-c));g.lineTo(sx*h,sy*h);g.lineTo(sx*(h-c),sy*h);g.stroke();}
    g.restore();
    const a2=easeOut(prog(t,wT(5,'mauro')-0.2,wT(5,'mauro')+0.2));
    g.save();g.globalAlpha=a2;g.font=F(700,40);g.fillStyle='#ffd60a';g.textAlign='center';g.fillText('PILOTO',W/2,1265);g.font=F(900,104);g.fillStyle='#fff';g.fillText('MAURO OSORTO',W/2,1360);g.restore();
    const a3=easeOut(prog(t,wT(5,'síguelo')-0.2,wT(5,'síguelo')+0.25));if(a3>0){g.save();g.globalAlpha=a3;g.translate(W/2,1640);g.scale(lerp(0.6,1,a3),lerp(0.6,1,a3));pill('SÍGUELO  →',0,0,'#ff3b30','#fff',60);g.restore();}
  }
  window.SPEED=(t<S[5].start-0.25)?(speed!=null?speed:(t>=S[4].start-0.2?55:0)):20;
  grade(t);
  if(t<S[5].start-0.25)caption(t);
  // tiny global progress bar
  g.fillStyle='rgba(255,255,255,0.18)';g.fillRect(0,H-12,W,12);g.fillStyle='#ffd60a';g.fillRect(0,H-12,W*t/TIM.total,12);
}
window.setup=async(tim)=>{TIM=tim;await document.fonts.load(F(900,40));
  IMG=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='p_kart.jpg';});
  const S=TIM.scenes;
  // RUN A: bad run, constant-ish speed, brakes late
  RUN_A=buildRun(0,S[2].start,8,(t,s)=>s<96?19.5:s<118?lerp(19.5,13,smooth(96,112,s)):13);
  // RUN B: good run: arrives at brake board as 'frenar' is said
  const tFr=wT(2,'frenar'),tV=wT(3,'vértice'),tS=wT(3,'salida'); RUN_B=keyRun([[S[2].start-0.6,0],[tFr,58],[tV,80],[tS,114],[S[4].start+0.4,140]]);
  RUN_C=buildRun(S[4].start-0.3,S[5].end+1.5,70,(t,s)=>s<84?22:s<100?14:s<S_EX?13:18);
};
window.frame=(t)=>{render(t);return out.toDataURL('image/jpeg',0.92);};
window.ready=true;
</script></body></html>
