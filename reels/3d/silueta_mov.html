<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px}
#wrap{position:absolute;inset:0;overflow:hidden}#bg{position:absolute;left:0;top:0;transform-origin:50% 50%}
canvas{position:absolute;left:0;top:0}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body><div id="wrap"><img id="bg"><canvas id="gl" width="1080" height="1920"></canvas><canvas id="fx" width="1080" height="1920"></canvas></div>
<script type="module">
// Fondo realista (imagen IA) + silueta humana articulada en 3D que se mueve + efectos de luz.
import * as THREE from 'three';
const W = 1080, H = 1920;
const lerp = (a, b, t) => a + (b - a) * t, cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), ease = t => { t = cl(t); return t * t * (3 - 2 * t); };
const q = new URLSearchParams(location.search);
const CFG = (() => { const x = new XMLHttpRequest(); x.open('GET', q.get('c'), false); x.send(); return JSON.parse(x.responseText); })();
const DQ = (q.get('d') || '').split(',').map(Number); CFG.forEach((s, i) => { if (DQ[i]) s.dur = DQ[i]; });

// ---------- silueta humana articulada (altura 1 = 1.80 m) ----------
const M = new THREE.MeshBasicMaterial({ color: 0x050403 });
const cap = (r, l) => new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 8, 16), M);
const sph = r => new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), M);
function limb(parent, x, y, r1, l1, r2, l2) { // articulación: pivote -> segmento 1 -> rodilla/codo -> segmento 2
  const a = new THREE.Group(); a.position.set(x, y, 0); parent.add(a);
  const s1 = cap(r1, l1); s1.position.y = -l1 / 2; a.add(s1);
  const b = new THREE.Group(); b.position.y = -l1; a.add(b);
  const s2 = cap(r2, l2); s2.position.y = -l2 / 2; b.add(s2);
  const end = new THREE.Group(); end.position.y = -l2 - r2 * 0.5; b.add(end);
  return { a, b, end };
}
function makeMan() {
  const root = new THREE.Group(), hips = new THREE.Group(); root.add(hips); hips.position.y = 0.52;
  const pelvis = sph(0.075); pelvis.scale.set(1.3, 0.85, 0.85); hips.add(pelvis);
  const spine = new THREE.Group(); hips.add(spine);
  // torso que se angosta en la cintura (abrigo)
  const tor = new THREE.Mesh(new THREE.CylinderGeometry(0.118, 0.088, 0.3, 24), M); tor.scale.z = 0.62; tor.position.y = 0.15; spine.add(tor);
  const sh = cap(0.05, 0.17); sh.rotation.z = Math.PI / 2; sh.scale.set(1, 1, 0.75); sh.position.y = 0.285; spine.add(sh); // línea de hombros
  // abrigo largo hasta medio muslo (se abre al caminar)
  const coat = new THREE.Mesh(new THREE.CylinderGeometry(0.098, 0.128, 0.3, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0x050403, side: THREE.DoubleSide })); coat.scale.z = 0.7; coat.position.y = -0.1; spine.add(coat);
  const neckG = new THREE.Group(); neckG.position.y = 0.31; spine.add(neckG);
  const neck = cap(0.038, 0.05); neck.position.y = 0.025; neckG.add(neck);
  const head = new THREE.Group(); head.position.y = 0.085; neckG.add(head);
  const skull = sph(0.058); skull.scale.set(0.9, 1.12, 1.0); skull.position.y = 0.03; head.add(skull);
  const jaw = sph(0.04); jaw.scale.set(0.95, 0.8, 1.0); jaw.position.set(0, -0.01, 0.012); head.add(jaw);
  [[0, 0.075, -0.005, 0.05], [0.025, 0.07, 0.01, 0.035], [-0.028, 0.068, 0.0, 0.035], [0, 0.06, -0.035, 0.045]].forEach(([x, y, z, r]) => { const h = sph(r); h.position.set(x, y, z); head.add(h); }); // cabello
  const nose = sph(0.011); nose.position.set(0, 0.025, 0.056); head.add(nose);
  const armL = limb(spine, -0.122, 0.275, 0.034, 0.15, 0.028, 0.14), armR = limb(spine, 0.122, 0.275, 0.034, 0.15, 0.028, 0.14);
  [armL, armR].forEach(A => { const h = sph(0.028); h.scale.set(0.75, 1.25, 0.55); A.end.add(h); });
  const legL = limb(hips, -0.048, -0.02, 0.056, 0.22, 0.043, 0.22), legR = limb(hips, 0.048, -0.02, 0.056, 0.22, 0.043, 0.22);
  [legL, legR].forEach(L => { const f = new THREE.Mesh(new THREE.BoxGeometry(0.058, 0.04, 0.15), M); f.position.set(0, -0.003, 0.035); L.end.add(f); });
  root.userData = { hips, spine, neckG, head, armL, armR, legL, legR };
  return root;
}
// poses: valores en radianes (x = adelante/atrás, z = abrir lateral)
function pose(man, P) {
  const u = man.userData, g = (k, d = 0) => (P[k] ?? d);
  u.hips.position.y = 0.52 + g('hipY'); u.hips.rotation.x = g('hipX'); u.spine.rotation.x = g('spineX'); u.spine.rotation.z = g('spineZ');
  u.neckG.rotation.x = g('neckX'); u.head.rotation.x = g('headX'); u.head.rotation.y = g('headY');
  u.armL.a.rotation.set(g('lArmX'), 0, g('lArmZ', 0.06)); u.armL.b.rotation.x = g('lElbow', -0.15);
  u.armR.a.rotation.set(g('rArmX'), 0, g('rArmZ', -0.06)); u.armR.b.rotation.x = g('rElbow', -0.15);
  u.legL.a.rotation.set(g('lLegX'), 0, -0.02); u.legL.b.rotation.x = g('lKnee');
  u.legR.a.rotation.set(g('rLegX'), 0, 0.02); u.legR.b.rotation.x = g('rKnee');
}
const breath = t => Math.sin(t * 1.6) * 0.012;
const ACTIONS = {
  // de pie, cabeza agachada, hombros caídos
  triste: (t) => ({ spineX: 0.12 + breath(t), neckX: 0.25, headX: lerp(0.1, 0.45, ease(t / 3)), lArmZ: 0.08, rArmZ: -0.08 }),
  // de rodillas orando (manos juntas frente al rostro)
  orar: (t) => ({ hipY: -0.235, lLegX: -0.15, rLegX: -0.15, lKnee: 1.62, rKnee: 1.62, spineX: 0.06 + breath(t), headX: 0.3, neckX: 0.1,
    lArmX: -0.75, rArmX: -0.75, lArmZ: 0.25, rArmZ: -0.25, lElbow: -1.55, rElbow: -1.55 }),
  // camina (ciclo de paso)
  caminar: (t) => { const c = t * 5.2, s = Math.sin(c); return { hipY: -Math.abs(Math.cos(c)) * 0.012, lLegX: s * 0.42, rLegX: -s * 0.42, lKnee: Math.max(0, -Math.cos(c)) * 0.75 + 0.05, rKnee: Math.max(0, Math.cos(c)) * 0.75 + 0.05,
    lArmX: -s * 0.35, rArmX: s * 0.35, lElbow: -0.3, rElbow: -0.3, spineX: 0.05, headX: 0.05 }; },
  // levanta la mirada al cielo cuando llega la luz
  mirarArriba: (t) => { const k = ease((t - 1.0) / 2.0); return { spineX: lerp(0.12, -0.08, k) + breath(t), neckX: lerp(0.25, -0.2, k), headX: lerp(0.4, -0.35, k), lArmZ: lerp(-0.05, -0.35, k), rArmZ: lerp(0.05, 0.35, k), lArmX: lerp(0, -0.25, k), rArmX: lerp(0, -0.25, k) }; },
  // alza los brazos en victoria
  brazosArriba: (t) => { const k = ease((t - 0.7) / 1.8); return { spineX: lerp(0.05, -0.1, k) + breath(t), headX: lerp(0, -0.35, k), lArmZ: lerp(-0.08, -2.6, k), rArmZ: lerp(0.08, 2.6, k), lElbow: lerp(-0.15, -0.05, k), rElbow: lerp(-0.15, -0.05, k) }; },
};

// ---------- render ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene(); const cam = new THREE.OrthographicCamera(0, W, 0, -H, -1000, 1000); // 1 unidad = 1 px; y hacia abajo negativo
const man = makeMan(); scene.add(man);
const bg = document.getElementById('bg'), fx = document.getElementById('fx').getContext('2d');
let cur = 0, IMGS = {};

let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function glow(x, y, r, c, a) { const g = fx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(0.3, `rgba(${c},${a * 0.4})`); g.addColorStop(1, `rgba(${c},0)`); fx.fillStyle = g; fx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function glint(x, y, s, a) { if (a <= 0.02) return; glow(x, y, s * 4, '255,236,190', a * 0.5); fx.fillStyle = `rgba(255,250,235,${a})`; fx.beginPath(); fx.moveTo(x, y - s * 2.4); fx.quadraticCurveTo(x, y, x + s * 2.4, y); fx.quadraticCurveTo(x, y, x, y + s * 2.4); fx.quadraticCurveTo(x, y, x - s * 2.4, y); fx.quadraticCurveTo(x, y, x, y - s * 2.4); fx.fill(); }

window.setScene = i => new Promise(res => { cur = i; const s = CFG[i]; bg.onload = () => { const base = Math.max(W / bg.naturalWidth, H / bg.naturalHeight); bg.style.width = bg.naturalWidth * base + 'px'; bg.style.height = bg.naturalHeight * base + 'px'; res(); }; bg.src = s.img; });
window.renderAt = t => {
  const s = CFG[cur], D = s.dur || 7, k = ease(t / D);
  // cámara del fondo (zoom y paneo); la silueta sigue el mismo encuadre
  const z = lerp(s.zoom[0], s.zoom[1], k), px = lerp(s.pan[0], s.pan[2], k), py = lerp(s.pan[1], s.pan[3], k);
  const bw = parseFloat(bg.style.width), bh = parseFloat(bg.style.height);
  bg.style.transform = `translate(${(W - bw) / 2 + px}px, ${(H - bh) / 2 + py}px) scale(${z})`;
  // silueta
  const f = s.fig;
  const gl = document.getElementById('gl'); gl.style.filter = s.rim ? `blur(0.9px) drop-shadow(0 0 ${s.rim[0]}px rgba(${s.rim[1]},${s.rim[2]}))` : 'blur(0.9px)';
  if (f) { man.visible = true;
    let fxp = f.x * W, fyp = f.y * H, hp = f.h * H;
    if (f.walk) { const w = ease(t / D); fyp = lerp(f.y, f.walk.y, w) * H; hp = lerp(f.h, f.walk.h, w) * H; fxp = lerp(f.x, f.walk.x ?? f.x, w) * W; }
    // aplicar la misma cámara del fondo a la silueta
    const sx = W / 2 + (fxp - W / 2) * z + px, sy = H / 2 + (fyp - H / 2) * z + py;
    man.position.set(sx, -sy, 0); man.scale.setScalar(hp * z); man.rotation.set(0, f.yaw ?? Math.PI, 0);
    pose(man, ACTIONS[f.act](t));
  } else man.visible = false;
  renderer.render(scene, cam);
  // efectos
  fx.setTransform(1, 0, 0, 1, 0, 0); fx.clearRect(0, 0, W, H); fx.save(); fx.globalCompositeOperation = 'lighter';
  if (s.beam) { const bx = s.beam.x * W, a = s.beam.a * (0.75 + 0.25 * Math.sin(t * 1.4)) * ease((t - (s.beam.t || 0)) / 1.5); fx.filter = 'blur(30px)'; const g = fx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(255,235,190,${a})`); g.addColorStop(1, 'rgba(255,235,190,0)'); fx.fillStyle = g; fx.beginPath(); fx.moveTo(bx - 60, -50); fx.lineTo(bx + 60, -50); fx.lineTo(bx + 240, H); fx.lineTo(bx - 240, H); fx.fill(); fx.filter = 'none'; }
  if (s.sparkles) { seed = 100 + cur; const sp = s.sparkles; for (let i = 0; i < sp.n; i++) { const x = rnd() * W, y0 = lerp(sp.y[0], sp.y[1], rnd()) * H, sz = 1.5 + rnd() * 3.5, v = 10 + rnd() * 30, ph = rnd() * 6; glint(x + Math.sin(t * 0.8 + ph) * 12, y0 - ((t * v) % 300), sz, sp.a * Math.max(0, Math.sin(t * 1.7 + ph))); } }
  fx.restore();
  if (s.rain) { fx.strokeStyle = `rgba(200,215,235,${s.rain})`; fx.lineWidth = 2; seed = 5; for (let i = 0; i < 320; i++) { const x = rnd() * (W + 200) - 100, y = ((rnd() * H + t * 1700 * (0.8 + rnd() * 0.4)) % (H + 100)) - 50; fx.beginPath(); fx.moveTo(x, y); fx.lineTo(x - 9, y + 50); fx.stroke(); } }
  if (s.flash && Math.abs(t - s.flash) < 0.07) { fx.fillStyle = 'rgba(210,220,255,0.35)'; fx.fillRect(0, 0, W, H); }
  const v = fx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.78); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)'); fx.fillStyle = v; fx.fillRect(0, 0, W, H);
};
window.ready = true;
</script></body></html>
