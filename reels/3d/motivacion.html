    g.fillStyle = 'rgba(40,20,5,0.55)'; g.fillRect(0, y, 512, 3);

}

  if (withCabin) {

function makeRainbow() {

  cols.forEach((c, i) => { const m = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.7 }); const r = mesh(new THREE.TorusGeometry(16 - i * 0.55, 0.3, 8, 80, Math.PI), m); r.castShadow = false; g.add(r); });

function makeDove() {

  const b = S(0.25, w); b.scale.set(1.6, 0.8, 0.8); g.add(b); const h = S(0.15, w); h.position.set(0.38, 0.12, 0); g.add(h);

  const branch = mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.3, 6), mat('#3d7a2a')); branch.rotation.z = 1.2; branch.position.set(0.62, 0.05, 0.05); g.add(branch);

function hill(color = '#79c267') {
  const g = new THREE.Group();
  const h = mesh(new THREE.SphereGeometry(30, 64, 32), mat(color, { roughness: 0.95 })); h.scale.set(1, 0.2, 1); h.position.y = -5.4; g.add(h);
  const gm = [mat('#5d7340'), mat('#7a8a4f')];
  for (let i = 0; i < 160; i++) { const a = rnd() * Math.PI * 2, r = 2 + rnd() * 18; const t = mesh(new THREE.ConeGeometry(0.08, 0.35, 5), gm[i % 2]); t.position.set(Math.cos(a) * r, 0.5 - r * r * 0.004, Math.sin(a) * r); g.add(t); }

  return g;

// ---------- escenas ----------
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 500);
let scene, update;
function baseScene(top, bottom, fogC, sunInt = 2.2, hemiInt = 1.0) {
  scene = new THREE.Scene(); seed = 7;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(250, 32, 16), skyMaterial(top, bottom)); scene.add(sky);
  scene.fog = new THREE.Fog(fogC, 25, 130);
  const hemi = new THREE.HemisphereLight('#cfd9e6', '#4a3a28', hemiInt * 0.6); scene.add(hemi);
  const sun = new THREE.DirectionalLight('#fff1d6', sunInt); sun.position.set(8, 14, 10); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 60 }); sun.shadow.bias = -0.0005; sun.shadow.radius = 4;
  scene.add(sun); const fill = new THREE.DirectionalLight('#ffd9b0', 0.25); fill.position.set(-6, 4, 8); scene.add(fill); const rim = new THREE.DirectionalLight('#ffe2b0', 2.2); rim.position.set(-4, 6, -10); scene.add(rim);
  return { sky, hemi, sun };
}
function rainSystem(n = 2500) {
  const pos = new Float32Array(n * 6); const base = [];
  for (let i = 0; i < n; i++) base.push([(rnd() - 0.5) * 40, rnd() * 30, (rnd() - 0.5) * 30 + 2]);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: '#b8c8e0', transparent: true, opacity: 0.55 }));
  lines.userData.tick = t => { for (let i = 0; i < n; i++) { const [x, y0, z] = base[i]; const y = ((y0 - t * 22) % 30 + 30) % 30 - 4; pos.set([x, y, z, x - 0.08, y + 0.7, z], i * 6); } geo.attributes.position.needsUpdate = true; };
  return lines;
}
function ocean(color = '#2f8fd0') {
  const geo = new THREE.PlaneGeometry(300, 300, 120, 120); geo.rotateX(-Math.PI / 2);
  const base = geo.attributes.position.array.slice();
  const m = mesh(geo, mat(color, { roughness: 0.35, metalness: 0.1, flatShading: true })); m.castShadow = false;
  m.userData.tick = t => { const p = geo.attributes.position.array; for (let i = 0; i < p.length; i += 3) { const x = base[i], z = base[i + 2]; p[i + 1] = Math.sin(x * 0.25 + t * 1.5) * 0.35 + Math.cos(z * 0.3 + t * 1.1) * 0.3; } geo.attributes.position.needsUpdate = true; geo.computeVertexNormals(); };

}

function radialTex(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, inner); gr.addColorStop(0.25, inner.replace(/[\d.]+\)$/, '0.55)')); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function sunGlow(pos, size, color = 'rgba(255,236,190,1)') {
  const g = new THREE.Group();
  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex('rgba(255,252,235,1)', 'rgba(255,240,200,0)'), blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  core.scale.setScalar(size * 0.35); g.add(core);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex(color, 'rgba(255,170,90,0)'), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, opacity: 0.85 }));
  halo.scale.setScalar(size * 1.6); g.add(halo);
  g.position.copy(pos); return g;
}
function godRays(pos, n = 9, len = 140, color = '#ffd9a0', op = 0.07, spread = 1.6) {
  const g = new THREE.Group(); const c = document.createElement('canvas'); c.width = 64; c.height = 256; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = gr; x.fillRect(0, 0, 64, 256);
  const tex = new THREE.CanvasTexture(c);
  for (let k = 0; k < n; k++) {
    const geo = new THREE.PlaneGeometry(6 + rnd() * 8, len); geo.translate(0, -len / 2, 0);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, color, transparent: true, opacity: op * (0.6 + rnd() * 0.8), blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));
    m.rotation.z = (k / (n - 1) - 0.5) * spread; m.userData.base = m.rotation.z; g.add(m);

  return g;
}
function stratus(color, emissive, y, z, w = 60, n = 8, op = 0.9) {
  const g = new THREE.Group(); const m = new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: 0.6, roughness: 1, transparent: true, opacity: op });
  for (let k = 0; k < n; k++) { const s = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), m); s.scale.set(6 + rnd() * 10, 0.6 + rnd() * 0.8, 3 + rnd() * 3); s.position.set((rnd() - 0.5) * w, y + rnd() * 3, z - rnd() * 10); g.add(s); }
  return g;
}
const SIL = new THREE.MeshStandardMaterial({ color: '#0d0907', roughness: 1 });
function silhouette(o) { o.traverse(m => { if (m.isMesh) m.material = SIL; }); return o; }
function makeFrame() { // costillas del arca en construcción

function silPeople(n, x0, z) { const arr = []; for (let k = 0; k < n; k++) { const p = silhouette(makePerson('#000', '#000')); p.position.set(x0 + k * 1.3 + rnd() * 0.4, 0.2, z - rnd()); p.rotation.y = 0.4 - k * 0.2; scene.add(p); arr.push(p); } return arr; }

const SCENES = [
