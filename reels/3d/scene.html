import * as THREE from 'three';

function woodTexture(base = '#9a6232') {

}
function makeHammer() {

  const head = mesh(new THREE.BoxGeometry(0.32, 0.14, 0.14), mat('#6d6d72', { metalness: 0.6, roughness: 0.35 })); head.position.y = 0.36; h.add(head);

function makeCloud(dark = false) {
  const g = new THREE.Group(); const m = mat(dark ? '#55606e' : '#ffffff', { roughness: 1, emissive: dark ? '#111418' : '#c9d6e8', emissiveIntensity: dark ? 0.2 : 0.25 });

function makeArk(withCabin = true, scaffold = false) {

    for (const z of [-2.2, 2.2]) { const b = mesh(new THREE.BoxGeometry(11, 0.12, 0.5), pm); b.position.set(0, 2.6, z); g.add(b); }

}
function makeRainbow() {

  cols.forEach((c, i) => { const m = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.7 }); const r = mesh(new THREE.TorusGeometry(16 - i * 0.55, 0.3, 8, 80, Math.PI), m); r.castShadow = false; g.add(r); });

function makeDove() {

  const b = S(0.25, w); b.scale.set(1.6, 0.8, 0.8); g.add(b); const h = S(0.15, w); h.position.set(0.38, 0.12, 0); g.add(h);

function hill(color = '#79c267') {
  const g = new THREE.Group();
  const h = mesh(new THREE.SphereGeometry(30, 64, 32), mat(color, { roughness: 0.95 })); h.scale.set(1, 0.2, 1); h.position.y = -5.4; g.add(h);
  const gm = [mat('#5fae52'), mat('#8fd17a')];
  for (let i = 0; i < 160; i++) { const a = rnd() * Math.PI * 2, r = 2 + rnd() * 18; const t = mesh(new THREE.ConeGeometry(0.08, 0.35, 5), gm[i % 2]); t.position.set(Math.cos(a) * r, 0.5 - r * r * 0.004, Math.sin(a) * r); g.add(t); }

let scene, update;

  scene.add(sun); const fill = new THREE.DirectionalLight('#ffd9b0', 0.5); fill.position.set(-6, 4, 8); scene.add(fill);

}
function rainSystem(n = 2500) {
  const pos = new Float32Array(n * 6); const base = [];
  for (let i = 0; i < n; i++) base.push([(rnd() - 0.5) * 40, rnd() * 30, (rnd() - 0.5) * 30 + 2]);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: '#b8c8e0', transparent: true, opacity: 0.55 }));
  lines.userData.tick = t => { for (let i = 0; i < n; i++) { const [x, y0, z] = base[i]; const y = ((y0 - t * 22) % 30 + 30) % 30 - 4; pos.set([x, y, z, x - 0.08, y + 0.7, z], i * 6); } geo.attributes.position.needsUpdate = true; };
  return lines;
}
function ocean(color = '#2f8fd0') {

  const base = geo.attributes.position.array.slice();
  const m = mesh(geo, mat(color, { roughness: 0.35, metalness: 0.1, flatShading: true })); m.castShadow = false;
  m.userData.tick = t => { const p = geo.attributes.position.array; for (let i = 0; i < p.length; i += 3) { const x = base[i], z = base[i + 2]; p[i + 1] = Math.sin(x * 0.25 + t * 1.5) * 0.35 + Math.cos(z * 0.3 + t * 1.1) * 0.3; } geo.attributes.position.needsUpdate = true; geo.computeVertexNormals(); };

}
function blink(n, t) { const b = (t % 3.1) < 0.12 ? 0.1 : 1; n.userData.eyes.forEach(e => e.scale.y = b); }

  // 5: el arca flota, arcoíris y paloma

    const sea = ocean(); scene.add(sea); const ark = makeArk(true); scene.add(ark);
    const rb = makeRainbow(); rb.position.set(4, -2, -45); scene.add(rb);
    const clouds = [makeCloud(), makeCloud()]; clouds.forEach((c, i) => { c.position.set(-18 + i * 34, 12, -40); c.scale.setScalar(2.5); scene.add(c); });
    const dove = makeDove(); scene.add(dove); const n = makeNoah(); n.scale.setScalar(0.45); n.position.set(2.2, 2.2, 1.2); scene.add(n);
    update = t => { sea.userData.tick(t); blink(n, t); ark.position.y = Math.sin(t * 1.5) * 0.25 - 0.3; ark.rotation.z = Math.sin(t * 1.1) * 0.03; n.position.y = ark.position.y + 2.2;
      n.userData.arms[1].piv.rotation.z = 2.5 + Math.sin(t * 6) * 0.4;
      rb.children.forEach(r => r.material.opacity = 0.7 * ease((t - 0.5) / 2));
      dove.position.set(lerp(-9, 7, t / 9), 7.5 + Math.sin(t * 2) * 0.4, -3); dove.userData.wings.forEach((w, k) => w.rotation.x = Math.sin(t * 16) * 0.8 * (k ? 1 : -1));
      camera.position.set(lerp(-6, 3, ease(t / 9)), lerp(3, 4.5, ease(t / 9)), lerp(22, 16, ease(t / 9))); camera.lookAt(0, 3.5, 0); };
  },
  // 6: Noé en la cubierta mira a la cámara y saluda
  () => { baseScene('#f2a46b', '#ffe2b5', '#ffd6a8', 2.3);
    const sea = ocean('#3b88c4'); scene.add(sea); const ark = makeArk(true); ark.position.set(0, -1.2, -1); ark.scale.setScalar(1.4); scene.add(ark);
    const rb = makeRainbow(); rb.position.set(0, 0, -50); scene.add(rb);
    const n = makeNoah(); n.position.set(0, 1.9, 3.2); scene.add(n);
    update = t => { sea.userData.tick(t); blink(n, t); const u = n.userData; n.position.y = 1.9 + Math.sin(t * 1.5) * 0.08;
      u.head.rotation.z = Math.sin(t * 2) * 0.06; u.head.rotation.y = Math.sin(t * 0.8) * 0.08;
      u.arms[1].piv.rotation.z = 2.6 + Math.sin(t * 7) * 0.35 * (t > 4 ? 1 : 0); if (t < 4) u.arms[1].piv.rotation.z = lerp(0.25, 0.9, ease(t)); u.arms[0].piv.rotation.z = -0.25;
      u.brows.forEach((b, i) => b.position.y = 0.33 + Math.max(0, Math.sin(t * 3)) * 0.04);
      camera.position.set(Math.sin(t * 0.2) * 1.2, lerp(3.2, 3.6, ease(t / 8)), lerp(10, 7.8, ease(t / 8))); camera.lookAt(0, 3.6, 3.2); };
  },
];
window.setScene = i => { SCENES[i](); };
window.renderAt = t => { update(t); renderer.render(scene, camera); };
window.ready = true;
