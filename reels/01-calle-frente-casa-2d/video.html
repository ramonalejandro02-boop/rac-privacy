<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 01 2D · La calle frente a su casa</title>

<style>
@font-face{font-family:'Baloo';src:url('../motor/fonts/Baloo2.woff2') format('woff2');font-weight:400 800}
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
svg{display:block}
</style>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script type="module">
import * as Z from '../motor/cartoon.js';
const { K, C, clamp, lerp, ease, easeOut, easeBack, prog, person, POSE, house, sidewalk, car, tire, stone, ground, grassScene,
  anger, qmark, excl, sparkle, sweat, notes, check, cross, label, bubble, stamp, icoMuni, icoPolice, noParking, wipe, broom, holdBroom, holdPhone, holdClip, shadow } = Z;

const TL = await (await fetch('timeline.json')).json();
await Promise.all(['600','700','800'].map(w => document.fonts.load(`${w} 60px Baloo`, 'ÁÉÍÓÚáéíóúñÑ¿?¡!abc')));
await document.fonts.ready;
const SEG = TL.segments, ENV = TL.env;
const S = i => SEG[i].start, E = i => SEG[i].end;
const N = SEG.length;
const shotStart = i => i === 0 ? 0 : S(i) - .25;
const WIPES = new Set(SEG.map((s, i) => i).filter(i => i > 0 && ['marta', 'lados', 'saber', 'mito', 'paso1', 'final', 'cierre'].includes(SEG[i].scene)));
const env = t => ENV[Math.min(ENV.length - 1, Math.max(0, Math.floor(t * 30)))] || 0;
const quoteT = i => S(i) + (E(i) - S(i)) * (SEG[i].text.indexOf(':') + 1) / SEG[i].text.length;

// personajes
const MARTA = { skin: '#D9A27A', shirt: '#B5527A', skirt: '#0E2A47', hair: '#2A1E18', style: 'bun', collar: '#fff' };
const CARLOS = { skin: '#C68A60', shirt: '#1E8E4E', pants: '#3B5B85', hair: '#2A2321', style: 'short', mustache: true, cap: '#0E2A47', capLogo: true };
const N1 = { skin: '#E3B48E', shirt: '#F0C75E', skirt: '#5C6F86', hair: '#1E1612', style: 'long' };
const N2 = { skin: '#D59C72', shirt: '#8FB3D9', pants: '#2F3B4A', hair: '#6A645E', style: 'bald', glasses: true };
const N3 = { skin: '#C2875C', shirt: '#FFFFFF', pants: '#0E2A47', hair: '#1A1412', style: 'short', collar: '#0E2A47' };
const blinkAt = (t, o = 0) => ((t + o) % 3.3) < .13;
const P = (base, t, o = 0, extra = {}) => person({ ...base, blink: blinkAt(t, o), bob: Math.sin(t * 2.4 + o) * 3, ...extra });

// textos
const title = (lines, p, y = 300, fs = 96) => {
  if (p <= 0) return '';
  const k = easeBack(p);
  return `<g transform="translate(540,${y}) scale(${lerp(.6, 1, k)})" opacity="${clamp(p * 2)}"><rect x="-470" y="${-fs * 1.05}" width="940" height="${lines.length * fs + fs * .55}" rx="36" fill="#fff" stroke="${K}" stroke-width="6"/>` +
    lines.map((l, i) => `<text x="0" y="${i * fs * 1.0}" font-family="Baloo" font-weight="800" font-size="${fs}" text-anchor="middle" fill="${C.navy}" stroke="#fff" stroke-width="18" paint-order="stroke" stroke-linejoin="round">${l}</text>`).join('') + `</g>`;
};
const pop = (p, svg, x, y) => p <= 0 ? '' : `<g transform="translate(${x},${y}) scale(${Math.max(.001, easeBack(p))}) translate(${-x},${-y})">${svg}</g>`;
const stepLabel = (n, text, p) => p <= 0 ? '' : `<g transform="translate(540,300) scale(${lerp(.7, 1, easeBack(p))})" opacity="${clamp(p * 2)}"><rect x="-430" y="-70" width="860" height="140" rx="70" fill="#fff" stroke="${K}" stroke-width="6"/><circle cx="-360" cy="0" r="54" fill="${C.green}" stroke="${K}" stroke-width="5"/><text x="-360" y="22" font-family="Baloo" font-weight="800" font-size="66" text-anchor="middle" fill="#fff">${n}</text><text x="40" y="20" font-family="Baloo" font-weight="800" font-size="56" text-anchor="middle" fill="${C.navy}">${text}</text></g>`;

// subtítulos
const SUBS = [];
SEG.forEach(s => {
  if (s.scene === 'cierre') return;
  const words = s.text.split(' '); const ch = []; let cur = '';
  words.forEach(w => { if ((cur + ' ' + w).trim().length > 30 && cur) { ch.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) ch.push(cur);
  const tot = ch.reduce((a, c) => a + c.length, 0); let t0 = s.start;
  ch.forEach(c => { const d = (s.end - s.start) * c.length / tot; SUBS.push([t0, t0 + d, c]); t0 += d; });
});
const KEY = /(uso público|dueño|falta|patronato|calma|autoridad|todos|convivencia|problemas|razón|llantas|piedras|robaron|SUYO)/gi;
function subs(t) {
  const sb = SUBS.find(x => t >= x[0] && t < x[1]); if (!sb) return '';
  const txt = sb[2].replace(/&/g, '&amp;').replace(KEY, `<tspan fill="${C.green}">$1</tspan>`);
  return `<text x="540" y="1790" font-family="Baloo" font-weight="800" font-size="56" text-anchor="middle" fill="${C.navy}" stroke="#fff" stroke-width="16" paint-order="stroke" stroke-linejoin="round">${txt}</text>`;
}
const LOGO = '../motor/assets/conafeph-logo.png';
const brand = `<g><rect x="50" y="62" width="300" height="80" rx="40" fill="#fff" stroke="${K}" stroke-width="4"/><image href="${LOGO}" x="56" y="64" width="76" height="76"/><text x="236" y="116" font-family="Baloo" font-weight="800" font-size="38" text-anchor="middle" fill="${C.navy}" letter-spacing="2">CONAFEPH</text></g>`;

// ---- mapa (vista aérea) ----
function topCar(x, y, color, rot = 0) {
  return `<g transform="translate(${x},${y}) rotate(${rot})"><rect x="-120" y="-56" width="240" height="112" rx="40" fill="${color}" stroke="${K}" stroke-width="6"/><rect x="-40" y="-44" width="96" height="88" rx="20" fill="#CFE8F6" stroke="${K}" stroke-width="5"/><rect x="-26" y="-34" width="66" height="68" rx="12" fill="${color}" stroke="${K}" stroke-width="4"/></g>`;
}
function map(t, u, mode) {
  let s = `<rect width="1080" height="1920" fill="#FAFAF7"/>`;
  // casas
  [[40, 280, '#F2DCC2'], [340, 400, '#FFFFFF'], [760, 280, '#D6EBDD']].forEach(([x, w, c], i) => {
    s += `<rect x="${x}" y="520" width="${w}" height="250" fill="${c}" stroke="${K}" stroke-width="6"/>`;
    s += `<path d="M${x} 520 l${w / 2} 60 l${w / 2} -60" stroke="${K}" stroke-width="4" fill="none" opacity=".4"/>`;
  });
  s += `<text x="540" y="660" font-family="Baloo" font-weight="800" font-size="40" text-anchor="middle" fill="${C.navy}">Casa de</text><text x="540" y="704" font-family="Baloo" font-weight="800" font-size="40" text-anchor="middle" fill="${C.navy}">doña Marta</text>`;
  s += `<rect x="0" y="770" width="1080" height="60" fill="#E4E6EA" stroke="${K}" stroke-width="5"/>`;
  s += `<rect x="560" y="764" width="160" height="12" fill="${C.navy}"/>`;
  s += `<rect x="0" y="830" width="1080" height="420" fill="#A9B0BA" stroke="${K}" stroke-width="5"/>`;
  for (let x = 20; x < 1080; x += 200) s += `<rect x="${x}" y="1034" width="110" height="12" rx="6" fill="#fff"/>`;
  if (mode === 'saber') {
    const pz = prog(t, S(8) + 2.4, S(8) + 2.9);
    if (pz > 0) s += `<rect x="330" y="845" width="420" height="160" rx="16" fill="#fff" fill-opacity="${.55 * pz}" stroke="${C.navy}" stroke-width="7" stroke-dasharray="22 14" opacity="${pz}"/>`;
    s += pop(prog(t, S(8) + 1.2, S(8) + 1.6), label(540, 1160, 'CALLE · USO PÚBLICO', { fs: 52, bg: C.navy, fg: '#fff' }), 540, 1160);
    s += pop(prog(t, S(8) + 2.9, S(8) + 3.3), label(540, 925, '¿De quién es? De nadie', { fs: 44 }), 540, 925);
  } else {
    s += `<rect x="560" y="830" width="160" height="200" fill="${C.green}" opacity="${.75 * prog(u, .2, .6)}"/>`;
    s += pop(prog(u, .4, .8), label(640, 1100, 'ENTRADA', { fs: 44, bg: C.green, fg: '#fff' }), 640, 1100);
    s += topCar(220, 930, '#5B8BC6');
    const k = easeOut(prog(t, S(9) + .6, S(9) + 2.4));
    s += topCar(lerp(1300, 640, k), 930, '#D9483B');
    s += pop(prog(t, S(9) + 2.6, S(9) + 2.9), cross(640, 930, 1.1), 640, 930);
    s += pop(prog(t, S(9) + 3.0, S(9) + 3.4), label(640, 1170, 'BLOQUEAR = FALTA', { fs: 52, bg: C.red, fg: '#fff' }), 640, 1170);
    s += pop(prog(t, S(9) + 3.8, S(9) + 4.1), check(220, 930, 1.0), 220, 930);
    s += pop(prog(t, S(9) + 4.0, S(9) + 4.4), label(230, 1330, '✓ Sin bloquear', { fs: 44 }), 230, 1330);
  }
  return s;
}

function scene(i, t) {
  const u = t - shotStart(i), id = SEG[i].scene;
  let s = '';
  const bg = (gy = 1240) => house(540, gy, 960, { k: 1.84 }) + sidewalk(gy);
  const PS = .63, CY = 1268, CAR = { s: 1.15, len: 1.4 }; // escala real: persona 1.6 m, carro 1.45 m, muro 1.8 m
  if (id === 'hook') {
    s += bg();
    const k = easeOut(prog(u, .2, 2.4)), cx = lerp(-600, 90, k);
    s += car(cx, 1500, '#5B8BC6', { ...CAR, wheel: cx * 1.1 });
    s += title(['¿Este espacio', `es <tspan fill="${C.green}">SUYO?</tspan>`], prog(u, .3, .8), 300, 110);
    const pq = prog(u, 2.5, 2.8);
    if (pq > 0) s += `<rect x="-20" y="1150" width="500" height="350" rx="20" fill="none" stroke="${C.red}" stroke-width="7" stroke-dasharray="24 16" opacity="${pq}"/>`;
    s += pop(pq, qmark(200, 1080, 1.4, C.red), 200, 1040);
  }
  if (id === 'marta') {
    s += bg();
    const sw = Math.sin(t * 7) * 14;
    s += P(MARTA, t, .2, { x: 700, y: CY, s: PS, expr: 'content', arms: { r: [28, -60], l: [30 + sw * .4, -70] }, hold: { l: holdBroom(sw) } });
    [[800, 1250, 0], [600, 1260, .4], [880, 1280, .8]].forEach(([x, y, o]) => { const p = (t * .9 + o) % 1; s += `<g opacity="${Math.sin(p * Math.PI)}">${sparkle(x, y - p * 40, .8 + p * .4)}</g>`; });
    s += pop(prog(u, .4, .8), label(700, 800, 'Doña Marta', { fs: 54, bg: '#fff' }), 700, 800);
  }
  if (id === 'llega') {
    s += bg();
    const k = easeOut(prog(u, .1, 2.2)), cx = lerp(-600, 90, k);
    s += car(cx, 1500, '#5B8BC6', { ...CAR, wheel: cx * 1.1 });
    const out = prog(u, 2.3, 2.7);
    if (out > 0) s += P(CARLOS, t, 1, { x: lerp(380, 520, out), y: CY, s: PS, expr: 'happy', arms: POSE.idle }) + notes(560, 900, t);
    const surp = u > 2.6;
    s += P(MARTA, t, .2, { x: 820, y: CY, s: PS, expr: surp ? 'shock' : 'content', arms: surp ? POSE.head : { r: [28, -60], l: [30, -70] }, hold: surp ? {} : { l: holdBroom(0) } });
    if (surp) s += pop(prog(u, 2.6, 2.9), excl(900, 900), 900, 860);
    s += pop(prog(u, 2.4, 2.8), label(520, 800, 'Don Carlos', { fs: 54 }), 520, 800);
  }
  if (id === 'reclamo') {
    s += house(540, 1440, 960, { k: 3.6 }) + sidewalk(1440);
    const q = quoteT(i), talking = t > q && t < E(i);
    s += P(CARLOS, t, 1, { x: 820, y: 1560, s: 1.15, expr: 'worried', arms: POSE.idle, look: -1 });
    s += P(MARTA, t, .2, { x: 300, y: 1560, s: 1.3, expr: 'angry', talk: talking ? env(t) : 0, arms: POSE.point, look: 1, tilt: talking ? Math.sin(t * 9) * 2 : 0 });
    if (t > q - .2) s += anger(300, 760, t, 1.05);
    s += pop(prog(t, q - .3, q), bubble(540, 520, ['¡Ahí no se parquea,', 'ese es MI frente!'], { who: 'DOÑA MARTA', tail: -200, fs: 60, w: 860 }), 540, 520);
  }
  if (id === 'respuesta') {
    s += house(540, 1440, 960, { k: 3.6 }) + sidewalk(1440);
    const q = quoteT(i), talking = t > q && t < E(i);
    s += P(MARTA, t, .2, { x: 270, y: 1560, s: 1.15, expr: 'angry', arms: POSE.cross, look: 1 });
    s += P(CARLOS, t, 1, { x: 770, y: 1560, s: 1.3, expr: talking ? 'smug' : 'neutral', talk: talking ? env(t) : 0, arms: talking ? POSE.shrug : POSE.idle, look: -1, tilt: talking ? -4 : 0 });
    s += pop(prog(t, q - .3, q), bubble(540, 520, ['Mire, la calle es pública.', 'No tiene su nombre.'], { who: 'DON CARLOS', tail: 220, tailDx: 260, fs: 58, w: 880, bg: C.navy, fg: '#fff' }), 540, 520);
  }
  if (['lados', 'ladoM', 'ladoC'].includes(id)) {
    s += ground(1460, [80, 520, 1000]);
    const hm = id === 'ladoC' ? .3 : 1, hc = id === 'ladoM' ? .3 : 1;
    s += P(MARTA, t, .2, { x: 290, y: 1460, s: 1.05, expr: id === 'ladoM' ? 'content' : 'think', arms: id === 'ladoM' ? POSE.hand : POSE.chin, dim: hm });
    s += P(CARLOS, t, 1, { x: 790, y: 1460, s: 1.05, expr: id === 'ladoC' ? 'smug' : 'think', arms: id === 'ladoC' ? POSE.shrug : POSE.chinL, dim: hc });
    if (id === 'lados') {
      s += title(['¿Quién tiene', `la <tspan fill="${C.green}">razón?</tspan>`], prog(u, 0, .4), 280, 100);
      s += pop(prog(u, .3, .6), qmark(290 + Math.sin(t * 3) * 6, 700, 1.2), 290, 660) + pop(prog(u, .5, .8), qmark(790 + Math.sin(t * 3 + 1) * 6, 700, 1.2), 790, 660);
    }
    if (id === 'ladoM') {
      s += pop(prog(u, .2, .5), label(330, 330, 'Cuida su frente', { fs: 54 }), 330, 330) + pop(prog(u, .25, .55), broom(660, 330, -30, .55), 660, 330);
      s += pop(prog(u, 1.4, 1.7), label(330, 470, 'Necesita salir', { fs: 54 }), 330, 470) + pop(prog(u, 1.4, 1.7), car(810, 520, '#5B8BC6', { s: .45 }), 810, 470);
    }
    if (id === 'ladoC') {
      s += pop(prog(u, .2, .5), label(700, 330, 'No hay parqueo', { fs: 54 }), 700, 330) + pop(prog(u, .25, .55), noParking(150, 340, .9), 150, 340);
      s += pop(prog(u, 1.6, 1.9), label(700, 470, 'La calle es de todos', { fs: 54 }), 700, 470);
    }
  }
  if (id === 'saber' || id === 'falta') {
    s += map(t, u, id);
    s += title(id === 'saber' ? ['Lo que hay', `que <tspan fill="${C.green}">saber</tspan>`] : [`<tspan fill="${C.red}">¡Pero ojo!</tspan>`], id === 'saber' ? prog(u, 0, .4) : prog(u, 0, .4), 260, 96);
  }
  if (id === 'mito') {
    s += bg();
    const half = S(i) + (E(i) - S(i)) * .52;
    const late = t > half;
    [[90, 1420, 'tire'], [250, 1428, 'stone'], [410, 1420, 'tire'], [560, 1430, 'stone']].forEach(([x, y, k], j) => s += pop(prog(u, .3 + j * .25, .6 + j * .25), k === 'tire' ? tire(x, y, 1) : stone(x, y, 1.1), x, y - 40));
    s += P(MARTA, t, .2, { x: 800, y: CY, s: PS, expr: late ? 'worried' : 'smug', arms: late ? POSE.head : POSE.hips });
    if (late) s += sweat(870, 900 + ((t * 1.5) % 1) * 30, 1.2);
    s += stamp(540, 330, 'MITO', C.red, prog(u, .2, .55));
    s += pop(prog(u, .5, .8), label(540, 470, '“El espacio ya es mío”', { fs: 50 }), 540, 470);
    if (late) {
      s += `<rect x="40" y="250" width="1000" height="300" fill="#fff"/>`;
      s += stamp(540, 330, 'REALIDAD', C.green, prog(t, half, half + .35), 6);
      s += pop(prog(t, half + .3, half + .6), label(540, 480, '⚠ Obstaculiza la vía pública', { fs: 50, bg: '#FFF4D6' }), 540, 480);
    }
  }
  if (id === 'paso1') {
    s += ground(1460, [80, 1000]);
    const end = prog(t, E(i) - 1.0, E(i) - .5), alt = Math.floor(t * 1.4) % 2;
    s += P(MARTA, t, .2, { x: 360, y: 1460, s: 1.05, expr: 'content', talk: end ? 0 : (alt ? env(t) * .0 + Math.max(0, Math.sin(t * 11)) * .5 : 0), arms: end ? { r: [10, 4], l: [lerp(10, 62, end), lerp(4, 20, end)] } : POSE.hand, look: 1 });
    s += P(CARLOS, t, 1, { x: 720, y: 1460, s: 1.05, expr: 'content', talk: end ? 0 : (!alt ? Math.max(0, Math.sin(t * 11)) * .5 : 0), arms: end ? { r: [lerp(10, 62, end), lerp(4, 20, end)], l: [10, 4] } : POSE.handR, look: -1 });
    if (end > .9) s += sparkle(540, 1100, 1.2) + sparkle(600, 1050, .7);
    s += stepLabel(1, 'Hablar con calma', prog(u, 0, .4));
  }
  if (id === 'paso2') {
    s += ground(1520, [60, 1020]);
    s += pop(prog(u, .1, .4), `<rect x="190" y="470" width="700" height="120" rx="14" fill="${C.navy}" stroke="${K}" stroke-width="6"/><text x="540" y="548" font-family="Baloo" font-weight="800" font-size="56" text-anchor="middle" fill="#fff">REUNIÓN DEL PATRONATO</text><path d="M230 470 L200 400 M850 470 L880 400" stroke="${K}" stroke-width="5"/>`, 540, 530);
    s += P(N3, t, 2, { x: 540, y: 1300, s: .78, expr: 'happy', talk: Math.max(0, Math.sin(t * 10)) * .6, arms: { r: [30, -100], l: [70, 20] }, hold: { r: holdClip() } });
    s += `<rect x="250" y="1240" width="580" height="44" rx="8" fill="#C79B66" stroke="${K}" stroke-width="6"/><path d="M290 1284 v220 M790 1284 v220" stroke="${K}" stroke-width="12"/>`;
    s += P(N1, t, 2.5, { x: 120, y: 1520, s: .78, expr: 'content', arms: POSE.idle, look: 1 });
    s += P(MARTA, t, .2, { x: 330, y: 1560, s: .82, expr: 'happy', arms: POSE.idle, look: 1 });
    s += P(CARLOS, t, 1, { x: 750, y: 1560, s: .82, expr: 'happy', arms: POSE.thumb, look: -1 });
    s += P(N2, t, 1.7, { x: 960, y: 1520, s: .78, expr: 'content', arms: POSE.idle, look: -1 });
    s += stepLabel(2, 'Acuerdo en el patronato', prog(u, 0, .4));
  }
  if (id === 'paso3') {
    s += bg();
    s += car(732, 1500, '#D9483B', { ...CAR, flip: true });
    s += pop(prog(u, .4, .7), cross(732, 1080, .9), 732, 1080);
    s += P(MARTA, t, .2, { x: 170, y: CY, s: PS, expr: 'neutral', talk: Math.max(0, Math.sin(t * 10)) * .5, arms: POSE.phone, hold: { r: holdPhone() } });
    s += pop(prog(t, S(i) + 1.6, S(i) + 2.0), `<g>${icoMuni(360, 560, 1.1)}${label(360, 680, 'Municipalidad', { fs: 44 })}</g>`, 360, 560);
    s += pop(prog(t, S(i) + 2.4, S(i) + 2.8), `<g>${icoPolice(740, 560, 1.0)}${label(740, 680, 'Policía', { fs: 44 })}</g>`, 740, 560);
    s += stepLabel(3, 'Avisar a la autoridad', prog(u, 0, .4));
  }
  if (id === 'final') {
    s += grassScene(1160);
    s += P(MARTA, t, .2, { x: 330, y: 1500, s: 1.05, expr: 'big', arms: { r: [12, 4], l: [150 + Math.sin(t * 8) * 10, 15] } });
    s += P(CARLOS, t, 1, { x: 760, y: 1500, s: 1.05, expr: 'big', arms: { r: [150 + Math.sin(t * 8 + 1) * 10, 15], l: [12, 4] } });
    s += title(['La calle es de todos…', `<tspan fill="${C.green}">y la convivencia, también.</tspan>`], prog(u, .1, .5), 330, 74);
    [[150, 700], [930, 760], [540, 640]].forEach(([x, y], j) => s += `<g opacity="${.5 + .5 * Math.sin(t * 4 + j)}">${sparkle(x, y, 1)}</g>`);
  }
  if (id === 'cierre') {
    s += `<defs><radialGradient id="lg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E8EE"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#lg)"/>`;
    const p = prog(u, .1, .9), k = easeBack(p);
    s += `<g transform="translate(540,640) scale(${lerp(.2, 1, k)}) rotate(${lerp(-90, 0, easeOut(p))})" opacity="${clamp(p * 2)}"><circle r="250" fill="#000" opacity=".06" cy="12"/><image href="${LOGO}" x="-250" y="-250" width="500" height="500"/></g>`;
    const sh = prog(u, 1.0, 1.7); if (sh > 0 && sh < 1) s += `<defs><clipPath id="lc"><circle cx="540" cy="640" r="232"/></clipPath></defs><rect clip-path="url(#lc)" x="${lerp(250, 830, sh) - 30}" y="380" width="46" height="520" fill="#fff" opacity=".55" transform="rotate(20 540 640)"/>`;
    s += `<g opacity="${prog(u, .7, 1.1)}" transform="translate(0,${(1 - easeOut(prog(u, .7, 1.1))) * 40})"><text x="540" y="960" font-family="Baloo" font-weight="800" font-size="110" text-anchor="middle" fill="${C.navy}" letter-spacing="8">CONAFEPH</text></g>`;
    s += `<g opacity="${prog(u, 1.2, 1.6)}"><text x="540" y="1130" font-family="Baloo" font-weight="800" font-size="64" text-anchor="middle" fill="${C.navy}">¿Problemas en su colonia?</text></g>`;
    s += pop(prog(u, 1.7, 2.1), `<rect x="130" y="1200" width="820" height="130" rx="65" fill="${C.green}" stroke="${K}" stroke-width="6"/><text x="540" y="1286" font-family="Baloo" font-weight="800" font-size="48" text-anchor="middle" fill="#fff">Busque orientación con CONAFEPH</text>`, 540, 1265);
    s += `<text x="540" y="1430" font-family="Baloo" font-weight="700" font-size="40" text-anchor="middle" fill="#1B3E66" opacity="${prog(u, 2.2, 2.6)}">WhatsApp · Oficinas · Facebook CONAFEPH</text>`;
  }
  return s;
}

const svg = document.getElementById('s');
window.seek = function (t) {
  let i = 0; while (i < N - 1 && t >= shotStart(i + 1)) i++;
  // con barrido: la escena cambia a mitad del barrido
  let out = `<defs><filter id="blur"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="1080" height="1920" fill="#fff"/>`;
  out += scene(i, t);
  if (SEG[i].scene !== 'cierre') out += subs(t) + brand;
  for (const j of WIPES) { const T = shotStart(j), p = (t - (T - .42)) / .85; out += wipe(p); }
  svg.innerHTML = out;
};
window.DURATION = TL.duration;
seek(0);
window.READY = true;
</script>
