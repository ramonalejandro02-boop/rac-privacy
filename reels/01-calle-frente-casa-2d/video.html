<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel 01 2D · La calle frente a su casa</title>
<style>
@font-face{font-family:'Brand';src:url('../motor/fonts/Montserrat.woff2') format('woff2');font-weight:100 900}
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
svg{display:block}
</style>
</head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script type="module">
import * as Z from '../motor/cartoon.js';
const { K, C, clamp, lerp, ease, easeOut, easeBack, prog, person, POSE, house, sidewalk, car, tire, stone, ground, grassScene,
  anger, qmark, excl, sparkle, sweat, notes, check, cross, label, bubble, stamp, icoMuni, icoPolice, noParking, wipe, broom, holdBroom, holdPhone, holdClip } = Z;

await Promise.all(['700', '800', '900'].map(w => document.fonts.load(`${w} 60px Brand`, 'ÁÉÍÓÚáéíóúñÑ¿?¡!abc')));
const TL = await (await fetch('timeline.json')).json();
const SEG = TL.segments, ENV = TL.env, N = SEG.length;
const S = i => SEG[i].start, E = i => SEG[i].end;
const env = t => ENV[Math.min(ENV.length - 1, Math.max(0, Math.floor(t * 30)))] || 0;
const norm = w => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zñ0-9]/g, '');
// tiempo de una palabra dentro de un segmento (Whisper); si no aparece, proporcional al texto
function wt(i, word, end = false) {
  const ws = SEG[i].words || [], n = norm(word);
  const w = ws.find(x => norm(x.w).startsWith(n));
  if (w) return end ? w.e : w.s;
  const k = norm(SEG[i].text).indexOf(n) / Math.max(1, norm(SEG[i].text).length);
  return S(i) + (E(i) - S(i)) * Math.max(0, k);
}
const speaking = (i, t) => (SEG[i].words?.length ? SEG[i].words.some(w => t >= w.s - .03 && t <= w.e + .04) : (t > S(i) && t < E(i)));
const mouth = (i, t) => speaking(i, t) ? clamp(.25 + env(t) * 1.25) : 0;

// tomas = grupos de segmentos consecutivos con la misma escena
const SHOTS = [];
SEG.forEach((s, i) => { if (!SHOTS.length || SHOTS.at(-1).scene !== s.scene) SHOTS.push({ scene: s.scene, i0: i, i1: i }); else SHOTS.at(-1).i1 = i; });
SHOTS.forEach((sh, k) => { sh.start = k === 0 ? 0 : S(sh.i0) - .22; });
SHOTS.forEach((sh, k) => { sh.end = k < SHOTS.length - 1 ? SHOTS[k + 1].start : TL.duration; });
const WIPES = new Set(['saber', 'paso1', 'final', 'cierre']);

// zonas seguras de Reels (1080x1920): contenido entre y 250 y 1430; x 64..960
const SAFE = { top: 250, bottom: 1430, left: 64, right: 960 };

const MARTA = { skin: '#D9A27A', shirt: '#B5527A', skirt: '#0E2A47', hair: '#2A1E18', style: 'bun', collar: '#fff' };
const CARLOS = { skin: '#C68A60', shirt: '#1E8E4E', pants: '#3B5B85', hair: '#2A2321', style: 'short', mustache: true, cap: '#0E2A47', capLogo: true };
const N1 = { skin: '#E3B48E', shirt: '#F0C75E', skirt: '#5C6F86', hair: '#1E1612', style: 'long' };
const N2 = { skin: '#D59C72', shirt: '#8FB3D9', pants: '#2F3B4A', hair: '#6A645E', style: 'bald', glasses: true };
const N3 = { skin: '#C2875C', shirt: '#FFFFFF', pants: '#0E2A47', hair: '#1A1412', style: 'short', collar: '#0E2A47' };
const blinkAt = (t, o = 0) => ((t + o) % 3.3) < .13;
const P = (base, t, o = 0, extra = {}) => person({ ...base, blink: blinkAt(t, o), bob: Math.sin(t * 2.4 + o) * 3, ...extra });
const LOGO = '../motor/assets/conafeph-logo.png';

// ---------- gráficos ----------
const pop = (p, svg, x, y) => p <= 0 ? '' : `<g transform="translate(${x},${y}) scale(${Math.max(.001, easeBack(p))}) translate(${-x},${-y})">${svg}</g>`;
const slide = (p, svg, dx = -120, dy = 0) => p <= 0 ? '' : `<g transform="translate(${(1 - easeOut(p)) * dx},${(1 - easeOut(p)) * dy})" opacity="${clamp(p * 1.6)}">${svg}</g>`;
const draw = (d, p, o = {}) => p <= 0 ? '' : `<path d="${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${1 - clamp(p)}" fill="none" stroke="${o.c ?? K}" stroke-width="${o.w ?? 8}" stroke-linecap="round" stroke-linejoin="round"/>`;
function titleCard(lines, p, y = 340, fs = 88) {
  if (p <= 0) return '';
  const maxLen = Math.max(...lines.map(l => l.replace(/<[^>]+>/g, '').length));
  fs = Math.min(fs, 780 / (maxLen * .62));
  const h = lines.length * fs + fs * .6;
  return `<g transform="translate(540,${y}) scale(${lerp(.7, 1, easeBack(p))})" opacity="${clamp(p * 2)}"><rect x="-424" y="${-h / 2 + 10}" width="860" height="${h}" rx="34" fill="#0E2A47"/><rect x="-430" y="${-h / 2}" width="860" height="${h}" rx="34" fill="#fff" stroke="${K}" stroke-width="6"/>` +
    lines.map((l, i) => `<text x="0" y="${-h / 2 + fs * .3 + (i + .78) * fs}" font-family="Brand" font-weight="900" font-size="${fs}" text-anchor="middle" fill="${C.navy}">${l}</text>`).join('') + `</g>`;
}
const stepCard = (n, text, p) => p <= 0 ? '' : `<g transform="translate(540,402) scale(${lerp(.7, 1, easeBack(p))})" opacity="${clamp(p * 2)}"><rect x="-414" y="-54" width="840" height="128" rx="64" fill="#0E2A47"/><rect x="-420" y="-64" width="840" height="128" rx="64" fill="#fff" stroke="${K}" stroke-width="6"/><circle cx="-354" cy="0" r="50" fill="${C.green}" stroke="${K}" stroke-width="5"/><text x="-354" y="22" font-family="Brand" font-weight="800" font-size="62" text-anchor="middle" fill="#fff">${n}</text><text x="40" y="18" font-family="Brand" font-weight="800" font-size="50" text-anchor="middle" fill="${C.navy}">${text}</text></g>`;
const card = (x, y, w, icon, text, o = {}) => `<g transform="translate(${x},${y})"><rect x="${-w / 2 + 6}" y="-36" width="${w}" height="88" rx="22" fill="#0E2A47"/><rect x="${-w / 2}" y="-44" width="${w}" height="88" rx="22" fill="${o.bg ?? '#fff'}" stroke="${K}" stroke-width="5"/>${icon ? `<g transform="translate(${-w / 2 + 50},0)">${icon}</g>` : ''}<text x="${icon ? 36 : 0}" y="15" font-family="Brand" font-weight="800" font-size="${Math.max(42, o.fs ?? 46)}" text-anchor="middle" fill="${o.fg ?? C.navy}">${text}</text></g>`;
const speedLines = (x, y, a) => a <= 0 ? '' : [0, 1, 2].map(k => `<path d="M${x - k * 30} ${y - 220 + k * 70} h-${120 + k * 40}" stroke="${K}" stroke-width="6" stroke-linecap="round" opacity="${a * (1 - k * .2)}"/>`).join('');
function scaleBal(x, y, tilt, p) {
  if (p <= 0) return '';
  const a = tilt * 14, r = a * Math.PI / 180, L = 170;
  const lx = x - L * Math.cos(r), ly = y - L * Math.sin(r), rx = x + L * Math.cos(r), ry = y + L * Math.sin(r);
  const pan = (px, py, txt, c) => `<path d="M${px - 70} ${py + 90} L${px} ${py} L${px + 70} ${py + 90}" stroke="${K}" stroke-width="4" fill="none"/><path d="M${px - 80} ${py + 90} h160 q-10 46 -80 46 q-70 0 -80 -46z" fill="${c}" stroke="${K}" stroke-width="5"/><text x="${px}" y="${py + 124}" font-family="Brand" font-weight="800" font-size="38" text-anchor="middle" fill="#fff">${txt}</text>`;
  return `<g transform="translate(${x},${y}) scale(${easeBack(p)}) translate(${-x},${-y})"><path d="M${x} ${y} V${y + 260}" stroke="${K}" stroke-width="12"/><path d="M${x - 70} ${y + 270} h140" stroke="${K}" stroke-width="14" stroke-linecap="round"/><path d="M${lx} ${ly} L${rx} ${ry}" stroke="#C79B66" stroke-width="16" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="16" fill="#F2C230" stroke="${K}" stroke-width="5"/>${pan(lx, ly, 'ELLA', '#B5527A')}${pan(rx, ry, 'ÉL', C.green)}</g>`;
}
const sun = (x, y, t) => `<g transform="translate(${x},${y}) rotate(${t * 20})">${[...Array(8)].map((_, k) => `<path d="M0 -58 V-74" stroke="${K}" stroke-width="5" stroke-linecap="round" transform="rotate(${k * 45})"/>`).join('')}<circle r="44" fill="#F7C948" stroke="${K}" stroke-width="5"/></g>`;
function phoneWaves(x, y, t) { return [0, 1, 2].map(k => { const p = (t * 1.4 + k / 3) % 1; return `<path d="M${x + 30 + p * 50} ${y - 40 - p * 20} q${24 + p * 20} 40 0 ${80 + p * 40}" stroke="${C.green}" stroke-width="6" fill="none" opacity="${1 - p}" stroke-linecap="round"/>`; }).join(''); }
function docCard(x, y, t0, t) {
  const items = ['Respetar entradas', 'Espacio para visitas', 'Turnos acordados'];
  let s = `<g transform="translate(${x},${y})"><rect x="-354" y="-30" width="720" height="300" rx="20" fill="#0E2A47"/><rect x="-360" y="-40" width="720" height="300" rx="20" fill="#fff" stroke="${K}" stroke-width="6"/><rect x="-360" y="-40" width="720" height="74" rx="20" fill="${C.navy}" stroke="${K}" stroke-width="6"/><text y="12" font-family="Brand" font-weight="800" font-size="44" text-anchor="middle" fill="#fff">ACUERDO DE PARQUEO</text>`;
  items.forEach((it, k) => { const p = prog(t, t0 + .3 + k * .45, t0 + .6 + k * .45); s += `<g opacity="${p}"><g transform="translate(-300,${86 + k * 62}) scale(${.42 * Math.max(.01, easeBack(p))})">${check(0, 0)}</g><text x="-256" y="${102 + k * 62}" font-family="Brand" font-weight="700" font-size="44" fill="${C.navy}">${it}</text></g>`; });
  return s + `</g>`;
}
function topCar(x, y, color) {
  return `<g transform="translate(${x},${y})"><rect x="-110" y="-50" width="220" height="100" rx="38" fill="${color}" stroke="${K}" stroke-width="6"/><rect x="-36" y="-40" width="88" height="80" rx="18" fill="#CFE8F6" stroke="${K}" stroke-width="5"/><rect x="-24" y="-30" width="60" height="60" rx="10" fill="${color}" stroke="${K}" stroke-width="4"/></g>`;
}
function ambulance(x, y) { return `<g transform="translate(${x},${y}) scale(.7)"><rect x="-56" y="-34" width="112" height="56" rx="10" fill="#fff" stroke="${K}" stroke-width="5"/><path d="M-6 -20 h12 v10 h10 v12 h-10 v10 h-12 v-10 h-10 v-12 h10z" fill="${C.red}"/><circle cx="-30" cy="24" r="12" fill="${K}"/><circle cx="30" cy="24" r="12" fill="${K}"/></g>`; }
function miniBubble(x, y, t) {
  const d = [0, 1, 2].map(k => `<circle cx="${x - 36 + k * 36}" cy="${y - 6 - Math.max(0, Math.sin(t * 8 - k)) * 10}" r="11" fill="${C.navy}"/>`).join('');
  return `<path d="M${x - 90} ${y - 60} h180 q30 0 30 30 v40 q0 30 -30 30 h-70 l-20 30 l-6 -30 h-84 q-30 0 -30 -30 v-40 q0 -30 30 -30z" fill="#fff" stroke="${K}" stroke-width="5"/>${d}`;
}

// ---------- subtítulos palabra por palabra (tiempos de Whisper) ----------
const CHUNKS = [];
SEG.forEach((s, i) => {
  if (s.scene === 'cierre') return;
  // texto del guion con los tiempos de Whisper (mapeo proporcional por índice)
  const sw = s.text.split(' '), aw = s.words || [];
  const ws = sw.map((w, k) => {
    if (!aw.length) return { w, s: S(i) + (E(i) - S(i)) * k / sw.length, e: S(i) + (E(i) - S(i)) * (k + 1) / sw.length };
    const j = sw.length === aw.length ? k : Math.round(k * (aw.length - 1) / Math.max(1, sw.length - 1));
    return { w, s: aw[j].s, e: aw[j].e };
  });
  let cur = [];
  ws.forEach((w, k) => {
    cur.push(w); const len = cur.map(x => x.w).join(' ').length;
    if (len > 22 || (/[.?!:,…]$/.test(w.w) && len > 12) || k === ws.length - 1) { CHUNKS.push({ words: cur, s: cur[0].s - .08, e: (ws[k + 1] ? ws[k + 1].s - .08 : E(i) + .05) }); cur = []; }
  });
});
const KEY = /^(publico|publica|dueno|falta|patronato|calma|autoridad|todos|convivencia|problemas|razon|llantas|piedras|robaron|suyo|parqueo|frente)/;
function subs(t) {
  const c = CHUNKS.find(x => t >= x.s && t < x.e); if (!c) return '';
  const parts = c.words.map(w => {
    const said = t >= w.s - .02, now = said && t <= w.e + .05;
    return `<tspan fill="${KEY.test(norm(w.w)) ? C.green : C.navy}" fill-opacity="${said ? 1 : .38}"${now ? ' font-size="66"' : ''}>${w.w.replace(/&/g, '&amp;')}</tspan>`;
  }).join(' ');
  return `<text x="540" y="1400" font-family="Brand" font-weight="800" font-size="60" text-anchor="middle" stroke="#fff" stroke-width="18" paint-order="stroke" stroke-linejoin="round">${parts}</text>`;
}
const brand = `<g><rect x="70" y="260" width="330" height="70" rx="35" fill="#0E2A47"/><rect x="64" y="252" width="330" height="70" rx="35" fill="#fff" stroke="${K}" stroke-width="4"/><image href="${LOGO}" x="70" y="254" width="66" height="66"/><text x="262" y="300" font-family="Brand" font-weight="800" font-size="34" text-anchor="middle" fill="${C.navy}" letter-spacing="2">CONAFEPH</text></g>`;

// ---------- escenas ----------
const GY = 1040, CY = 1070, PS = .63, CAR = { s: 1.15, len: 1.4 }, CARY = 1290;
const street = () => house(540, GY, 960, { k: 1.84 }) + sidewalk(GY) + `<rect x="-10" y="${GY + 440}" width="1100" height="500" fill="#9AA1AC"/>`;
const closeBg = () => house(540, 1250, 960, { k: 3.6 }) + sidewalk(1250) + `<rect x="-10" y="1690" width="1100" height="300" fill="#9AA1AC"/>`;

function sayBubble(q, t, lines, o) {
  if (t < S(q) - .25) return '';
  const ws = SEG[q].words || [];
  const tokens = lines.map(l => l.split(' ')), total = tokens.flat().length;
  const said = ws.length ? Math.round(ws.filter(w => t >= w.s - .05).length * total / ws.length) : Math.round(total * prog(t, S(q), E(q)));
  let wi = 0;
  const shown = tokens.map(row => row.map(w => `<tspan fill-opacity="${wi++ < Math.max(1, said) ? 1 : 0}">${w}</tspan>`).join(' '));
  return pop(prog(t, S(q) - .25, S(q) + .05), bubble(540, 580, shown, { ...o, fs: 54 }), 540, 520);
}

function mapScene(sh, t, u, id) {
  const i = sh.i0;
  let s = `<rect width="1080" height="1920" fill="#FAFAF7"/>`;
  [[40, 280, '#F2DCC2'], [340, 400, '#FFFFFF'], [760, 280, '#D6EBDD']].forEach(([x, w, c], k) => {
    const p = id === 'saber' ? prog(u, .1 + k * .12, .4 + k * .12) : 1; if (p <= 0) return;
    s += `<g transform="translate(0,${(1 - easeBack(p)) * -80})" opacity="${clamp(p * 2)}"><rect x="${x}" y="480" width="${w}" height="210" fill="${c}" stroke="${K}" stroke-width="6"/><path d="M${x} 480 l${w / 2} 50 l${w / 2} -50" stroke="${K}" stroke-width="4" fill="none" opacity=".4"/></g>`;
  });
  s += `<text x="540" y="600" font-family="Brand" font-weight="800" font-size="44" text-anchor="middle" fill="${C.navy}">Casa de</text><text x="540" y="648" font-family="Brand" font-weight="800" font-size="44" text-anchor="middle" fill="${C.navy}">doña Marta</text>`;
  s += `<rect x="0" y="690" width="1080" height="56" fill="#E4E6EA" stroke="${K}" stroke-width="5"/><rect x="560" y="684" width="160" height="12" fill="${C.navy}"/>`;
  s += `<rect x="0" y="746" width="1080" height="420" fill="#A9B0BA" stroke="${K}" stroke-width="5"/>`;
  for (let x = 20; x < 1080; x += 200) s += `<rect x="${x}" y="950" width="110" height="12" rx="6" fill="#fff"/>`;
  if (id === 'saber') {
    s += titleCard([`Lo que hay que <tspan fill="${C.green}">saber</tspan>`], prog(u, 0, .4), 402, 66);
    const up = wt(i, 'uso'), na = wt(i, 'nadie');
    const tint = prog(t, up - .2, up + .3);
    if (tint > 0) s += `<rect x="0" y="746" width="1080" height="420" fill="${C.navy}" opacity="${.18 * tint}"/>`;
    [['Vecino', '#F2C230', 200], ['Visita', '#8FB3D9', 880]].forEach(([n, c, x], k) => {
      const p = prog(t, up + .4 + k * .4, up + 1.2 + k * .4); if (p <= 0) return;
      const xx = lerp(x < 540 ? -200 : 1280, x, easeOut(p));
      s += topCar(xx, 1060, c) + (p >= 1 ? label(x, 1060, n, { fs: 42 }) : '');
    });
    s += pop(prog(t, up - .1, up + .25), label(540, 1240, 'CALLE = USO PÚBLICO', { fs: 50, bg: C.navy, fg: '#fff' }), 540, 1240);
    const pz = prog(t, na - .2, na + .2);
    if (pz > 0) s += `<rect x="330" y="760" width="420" height="160" rx="16" fill="#fff" fill-opacity="${.5 * pz}" stroke="${C.navy}" stroke-width="7" stroke-dasharray="22 14" opacity="${pz}"/>`;
    s += pop(prog(t, na, na + .3), label(540, 840, 'Nadie es dueño', { fs: 46 }), 540, 840);
  } else {
    s += titleCard([`<tspan fill="${C.red}">¡Pero ojo!</tspan>`], prog(u, 0, .4), 402, 72);
    const en = wt(i, 'entrada'), po = wt(i, 'portón'), em = wt(i, 'emergencia'), fa = wt(i, 'falta');
    s += `<rect x="560" y="746" width="160" height="200" fill="${C.green}" opacity="${.75 * prog(t, en - .2, en + .2)}"/>`;
    const blocked = t > fa - .6;
    s += draw('M640 700 V880 Q640 980 740 980 H1040', prog(t, en, en + .8), { c: blocked ? C.red : C.green, w: 12 });
    s += topCar(220, 860, '#5B8BC6');
    s += topCar(lerp(1300, 640, easeOut(prog(t, po - .1, fa - .6))), 860, '#D9483B');
    s += pop(prog(t, fa - .5, fa - .2), cross(640, 860, 1.1), 640, 860);
    s += pop(prog(t, en, en + .3), card(205, 1250, 270, '', 'Entrada', { fs: 40 }), 205, 1250);
    s += pop(prog(t, po, po + .3), card(480, 1250, 240, '', 'Portón', { fs: 40 }), 480, 1250);
    s += pop(prog(t, em, em + .3), card(790, 1250, 310, '', 'Emergencia', { fs: 40 }), 790, 1250);
    s += pop(prog(t, fa, fa + .3), label(640, 1100, 'BLOQUEAR = FALTA', { fs: 54, bg: C.red, fg: '#fff' }), 640, 1100);
    s += pop(prog(t, fa + .4, fa + .7), check(220, 860, .9), 220, 860);
  }
  return s;
}

function scene(sh, t) {
  const u = t - sh.start, i = sh.i0, id = sh.scene;
  let s = '';
  if (id === 'hook') {
    s += street();
    const k = easeOut(prog(u, .15, 2.1)), cx = lerp(-760, 90, k), mv = prog(u, .15, 1.0) * (1 - prog(u, 1.4, 2.1));
    s += speedLines(cx - 430, CARY, mv) + car(cx, CARY, '#5B8BC6', { ...CAR, wheel: cx * 1.1 });
    s += titleCard(['¿Este espacio', `es <tspan fill="${C.green}">SUYO?</tspan>`], prog(u, .2, .7), 480, 96);
    const pq = prog(u, 2.2, 2.5);
    if (pq > 0) s += `<rect x="-30" y="${CARY - 330}" width="560" height="380" rx="24" fill="${C.red}" fill-opacity="${.08 + .06 * Math.sin(t * 8)}" stroke="${C.red}" stroke-width="7" stroke-dasharray="26 16" opacity="${pq}"/>`;
    s += pop(pq, qmark(250, CARY - 380 + Math.sin(t * 5) * 10, 1.5, C.red), 250, CARY - 420);
  }
  if (id === 'marta') {
    s += street();
    const sw = Math.sin(t * 7) * 14;
    const wk = prog(u, 0, 1.4), mx = lerp(1150, 700, easeOut(wk)), walking = wk < 1;
    s += P(MARTA, t, .2, { x: mx, y: CY, s: PS, expr: 'content', walk: t * 9, walkAmt: walking ? 1 : 0, arms: walking ? POSE.idle : { r: [28, -60], l: [30 + sw * .4, -70] }, hold: { l: holdBroom(walking ? 0 : sw) } });
    if (!walking) [[810, CY - 20, 0], [600, CY - 10, .4], [880, CY, .8]].forEach(([x, y, o]) => { const p = (t * .9 + o) % 1; s += `<g opacity="${Math.sin(p * Math.PI)}">${sparkle(x, y - p * 40, .7 + p * .4)}</g>`; });
    s += pop(prog(u, .8, 1.1), label(mx, 600, 'Doña Marta', { fs: 50 }), mx, 600);
    const ma = wt(i, 'mañanas');
    s += pop(prog(t, ma - .2, ma + .1), `<g>${sun(150, 470, t)}${label(500, 470, 'Todas las mañanas', { fs: 44 })}</g>`, 400, 470);
  }
  if (id === 'llega') {
    s += street();
    const k = easeOut(prog(u, .1, 1.9)), cx = lerp(-760, 90, k), mv = prog(u, .1, .9) * (1 - prog(u, 1.2, 1.9));
    s += speedLines(cx - 430, CARY, mv) + car(cx, CARY, '#5B8BC6', { ...CAR, wheel: cx * 1.1 });
    const out = prog(u, 2.0, 3.2);
    if (u > 2.0) s += P(CARLOS, t, 1, { x: lerp(420, 520, out), y: CY, s: PS, expr: 'happy', walk: t * 9, walkAmt: out < 1 ? 1 : 0, arms: POSE.idle }) + notes(560, 660, t);
    const surp = u > 2.3;
    s += P(MARTA, t, .2, { x: 820, y: CY, s: PS, expr: surp ? 'shock' : 'content', arms: surp ? POSE.head : { r: [28, -60], l: [30, -70] }, hold: surp ? {} : { l: holdBroom(0) } });
    if (surp) s += pop(prog(u, 2.3, 2.6), excl(910, 640), 910, 600);
    s += pop(prog(u, 2.3, 2.6), label(520, 580, 'Don Carlos', { fs: 52 }), 520, 580);
  }
  if (id === 'reclamo') {
    s += closeBg();
    const q = sh.i1, talking = speaking(q, t);
    s += P(CARLOS, t, 1, { x: 790, y: 1340, s: 1.08, expr: t > S(q) ? 'worried' : 'neutral', arms: POSE.idle, look: -1 });
    s += P(MARTA, t, .2, { x: lerp(160, 300, easeOut(prog(u, 0, .8))), y: 1340, s: 1.2, expr: 'angry', talk: mouth(q, t), arms: t > S(q) - .1 ? POSE.point : POSE.hips, look: 1, tilt: talking ? Math.sin(t * 9) * 2 : 0, walk: t * 9, walkAmt: 1 - prog(u, 0, .8) });
    if (t > S(q) - .1) s += anger(300, 620, t, 1.0);
    s += sayBubble(q, t, ['¡Ahí no se parquea!', '¡Ese es MI frente!'], { who: 'DOÑA MARTA', tail: -200, w: 860 });
  }
  if (id === 'respuesta') {
    s += closeBg();
    const q = sh.i1, talking = speaking(q, t);
    s += P(MARTA, t, .2, { x: 270, y: 1340, s: 1.08, expr: 'angry', arms: POSE.cross, look: 1 });
    s += P(CARLOS, t, 1, { x: 780, y: 1340, s: 1.2, expr: t > S(q) ? 'smug' : 'neutral', talk: mouth(q, t), arms: t > S(q) ? POSE.shrug : POSE.idle, look: -1, tilt: talking ? -4 : 0 });
    s += sayBubble(q, t, ['Mire, la calle es pública.', 'No tiene su nombre.'], { who: 'DON CARLOS', tail: 200, tailDx: 240, w: 880, bg: C.navy, fg: '#fff' });
  }
  if (['lados', 'ladoM', 'ladoC'].includes(id)) {
    s += ground(1250, [110, 540, 970]);
    const target = id === 'ladoM' ? -1 : id === 'ladoC' ? 1 : 0;
    const tiltS = id === 'lados' ? Math.sin(t * 2.2) * .8 : lerp(id === 'ladoC' ? -1 : 0, target, easeOut(prog(u, 0, .7)));
    s += P(MARTA, t, .2, { x: 240, y: 1250, s: .92, expr: id === 'ladoM' ? 'content' : 'think', arms: id === 'ladoM' ? POSE.hand : POSE.chin, dim: id === 'ladoC' ? .35 : 1 });
    s += P(CARLOS, t, 1, { x: 840, y: 1250, s: .92, expr: id === 'ladoC' ? 'smug' : 'think', arms: id === 'ladoC' ? POSE.shrug : POSE.chinL, dim: id === 'ladoM' ? .35 : 1 });
    s += scaleBal(540, id === 'lados' ? 600 : 700, tiltS, id === 'lados' ? prog(u, .2, .6) : 1);
    if (id === 'lados') s += titleCard([`¿Quién tiene la <tspan fill="${C.green}">razón?</tspan>`], prog(u, 0, .4), 390, 66);
    if (id === 'ladoM') {
      const a = wt(i, 'cuida'), b = wt(i, 'salir');
      s += slide(prog(t, a - .2, a + .2), card(540, 420, 760, broom(0, 0, -30, .22), 'Cuida su frente'), -200);
      s += slide(prog(t, b - .3, b + .1), card(540, 540, 760, `<g transform="scale(.15)">${car(0, 120, '#5B8BC6', { len: 1.4 })}</g>`, 'Necesita salir'), -200);
    }
    if (id === 'ladoC') {
      const a = wt(i, 'parquear'), b = wt(i, 'todos');
      s += slide(prog(t, a - .3, a + .1), card(540, 420, 760, noParking(0, 0, .42), 'No hay parqueo'), 200);
      s += slide(prog(t, b - .3, b + .1), card(540, 540, 760, '', 'La calle es de todos'), 200);
    }
  }
  if (id === 'saber' || id === 'falta') s += mapScene(sh, t, u, id);
  if (id === 'mito') {
    s += street();
    const ll = wt(i, 'llantas'), pi = wt(i, 'piedras'), pr = wt(i, 'traer');
    const late = t > pr - .3;
    [[100, 'tire', ll], [270, 'stone', pi], [430, 'tire', ll + .25], [590, 'stone', pi + .25]].forEach(([x, k, t0]) => {
      const p = prog(t, t0 - .1, t0 + .35); if (p <= 0) return;
      const y = 1260 - (1 - easeBack(p)) * 300;
      s += k === 'tire' ? tire(x, y, 1) : stone(x, y, 1.1);
    });
    s += P(MARTA, t, .2, { x: 820, y: CY, s: PS, expr: late ? 'worried' : 'smug', arms: late ? POSE.head : POSE.hips });
    if (late) s += sweat(880, 660 + ((t * 1.5) % 1) * 30, 1.1);
    s += late ? stamp(540, 450, 'REALIDAD', C.green, prog(t, pr - .3, pr), 6) : stamp(540, 450, 'MITO', C.red, prog(u, .1, .45));
    s += late ? pop(prog(t, pr, pr + .3), card(540, 600, 860, `<path d="M0 -30 L30 24 H-30Z" fill="#F7C948" stroke="${K}" stroke-width="5" stroke-linejoin="round"/><text y="18" font-family="Brand" font-weight="800" font-size="36" text-anchor="middle">!</text>`, 'Obstaculiza la vía pública', { bg: '#FFF4D6', fs: 44 }), 540, 590)
      : pop(prog(u, .4, .7), card(540, 590, 640, '', '“El espacio ya es mío”'), 540, 590);
  }
  if (id === 'paso1') {
    s += ground(1250, [110, 970]);
    const end = prog(t, E(i) - .9, E(i) - .3), alt = Math.floor(t * 1.2) % 2;
    s += P(MARTA, t, .2, { x: 360, y: 1250, s: .95, expr: 'content', talk: end < .1 && alt ? Math.max(0, Math.sin(t * 11)) * .45 : 0, arms: end > 0 ? { r: [10, 4], l: [lerp(10, 62, end), lerp(4, 20, end)] } : POSE.hand, look: 1 });
    s += P(CARLOS, t, 1, { x: 720, y: 1250, s: .95, expr: 'content', talk: end < .1 && !alt ? Math.max(0, Math.sin(t * 11)) * .45 : 0, arms: end > 0 ? { r: [lerp(10, 62, end), lerp(4, 20, end)], l: [10, 4] } : POSE.handR, look: -1 });
    if (end < .1) s += miniBubble(alt ? 330 : 750, 600, t);
    if (end > .9) s += sparkle(540, 760, 1.2) + sparkle(610, 700, .7) + sparkle(470, 720, .6);
    s += stepCard(1, 'Hablar con calma', prog(u, 0, .4));
  }
  if (id === 'paso2') {
    s += ground(1250, [80, 1000]);
    const ac = wt(i, 'acuerdo');
    s += P(N3, t, 2, { x: 540, y: 1200, s: .68, expr: 'happy', talk: speaking(i, t) ? Math.max(0, Math.sin(t * 10)) * .55 : 0, arms: { r: [30, -100], l: [70, 20] }, hold: { r: holdClip() } });
    s += `<rect x="270" y="1140" width="540" height="40" rx="8" fill="#C79B66" stroke="${K}" stroke-width="6"/><path d="M310 1180 v70 M770 1180 v70" stroke="${K}" stroke-width="12"/>`;
    s += P(N1, t, 2.5, { x: 150, y: 1250, s: .7, expr: 'content', arms: POSE.idle, look: 1 });
    s += P(MARTA, t, .2, { x: 340, y: 1290, s: .74, expr: 'happy', arms: POSE.idle, look: 1 });
    s += P(CARLOS, t, 1, { x: 740, y: 1290, s: .74, expr: 'happy', arms: t > ac ? POSE.thumb : POSE.idle, look: -1 });
    s += P(N2, t, 1.7, { x: 930, y: 1250, s: .7, expr: 'content', arms: POSE.idle, look: -1 });
    if (t < ac - .2) s += pop(prog(u, .1, .4), `<rect x="160" y="500" width="760" height="110" rx="14" fill="${C.navy}" stroke="${K}" stroke-width="6"/><text x="540" y="573" font-family="Brand" font-weight="800" font-size="52" text-anchor="middle" fill="#fff">REUNIÓN DEL PATRONATO</text>`, 540, 555);
    else s += pop(prog(t, ac - .2, ac + .15), `<g transform="translate(540,540) scale(.82) translate(-540,-540)">${docCard(540, 540, ac, t)}</g>`, 540, 640);
    s += stepCard(2, 'Ir al patronato', prog(u, 0, .4));
  }
  if (id === 'paso3') {
    s += street();
    s += car(732, CARY, '#D9483B', { ...CAR, flip: true });
    s += pop(prog(u, .3, .6), cross(732, 900, .9), 732, 900);
    s += P(MARTA, t, .2, { x: 190, y: CY, s: PS, expr: 'neutral', arms: POSE.phone, hold: { r: holdPhone() } }) + phoneWaves(150, 660, t);
    const au = wt(i, 'autoridad');
    s += pop(prog(t, au - .3, au), `<g>${icoMuni(400, 560, .95)}${label(400, 690, 'Municipalidad', { fs: 42 })}</g>`, 400, 560);
    s += pop(prog(t, au, au + .3), `<g>${icoPolice(770, 560, .9)}${label(770, 690, 'Policía', { fs: 42 })}</g>`, 770, 560);
    s += stepCard(3, 'Avisar a la autoridad', prog(u, 0, .4));
  }
  if (id === 'final') {
    s += grassScene(1000);
    s += P(MARTA, t, .2, { x: 330, y: 1270, s: .95, expr: 'big', arms: { r: [12, 4], l: [150 + Math.sin(t * 8) * 10, 15] } });
    s += P(CARLOS, t, 1, { x: 760, y: 1270, s: .95, expr: 'big', arms: { r: [150 + Math.sin(t * 8 + 1) * 10, 15], l: [12, 4] } });
    s += titleCard(['La calle es de todos…', `<tspan fill="${C.green}">y la convivencia también</tspan>`], prog(u, .1, .5), 440, 64);
    for (let k = 0; k < 18; k++) { const p = (u * .35 + k * .057) % 1, x = 100 + (k * 137) % 880; s += `<rect x="${x + Math.sin(t * 3 + k) * 20}" y="${580 + p * 640}" width="16" height="26" rx="4" fill="${[C.green, '#F2C230', C.navy, '#B5527A'][k % 4]}" transform="rotate(${t * 200 + k * 40} ${x} ${580 + p * 640})" opacity="${1 - p}"/>`; }
  }
  if (id === 'cierre') {
    s += `<defs><radialGradient id="lg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E8EE"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#lg)"/>`;
    const p = prog(u, .1, .9), k = easeBack(p);
    s += `<g transform="translate(540,620) scale(${lerp(.2, 1, k)}) rotate(${lerp(-90, 0, easeOut(p))})" opacity="${clamp(p * 2)}"><circle r="230" fill="#000" opacity=".06" cy="12"/><image href="${LOGO}" x="-230" y="-230" width="460" height="460"/></g>`;
    const shn = prog(u, 1.0, 1.7); if (shn > 0 && shn < 1) s += `<defs><clipPath id="lc"><circle cx="540" cy="620" r="212"/></clipPath></defs><rect clip-path="url(#lc)" x="${lerp(250, 830, shn) - 30}" y="380" width="46" height="480" fill="#fff" opacity=".55" transform="rotate(20 540 620)"/>`;
    s += `<g opacity="${prog(u, .7, 1.1)}" transform="translate(0,${(1 - easeOut(prog(u, .7, 1.1))) * 40})"><text x="540" y="940" font-family="Brand" font-weight="800" font-size="104" text-anchor="middle" fill="${C.navy}" letter-spacing="8">CONAFEPH</text></g>`;
    s += `<g opacity="${prog(u, 1.2, 1.6)}"><text x="540" y="1060" font-family="Brand" font-weight="800" font-size="60" text-anchor="middle" fill="${C.navy}">¿Problemas en su colonia?</text></g>`;
    s += pop(prog(u, 1.7, 2.1), `<rect x="116" y="1118" width="860" height="120" rx="60" fill="#0E2A47"/><rect x="110" y="1110" width="860" height="120" rx="60" fill="${C.green}" stroke="${K}" stroke-width="6"/><text x="540" y="1186" font-family="Brand" font-weight="800" font-size="42" text-anchor="middle" fill="#fff">Busque orientación con CONAFEPH</text>`, 540, 1170);
    s += `<text x="540" y="1320" font-family="Brand" font-weight="700" font-size="44" text-anchor="middle" fill="#1B3E66" opacity="${prog(u, 2.2, 2.6)}">WhatsApp · Facebook · Oficinas</text>`;
  }
  return s;
}

const svg = document.getElementById('s');
window.seek = function (t) {
  let k = 0; while (k < SHOTS.length - 1 && t >= SHOTS[k + 1].start) k++;
  const sh = SHOTS[k];
  const zoom = 1 + .045 * ease(prog(t, sh.start, sh.end));
  let out = `<defs><filter id="blur"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="1080" height="1920" fill="#fff"/>`;
  out += `<g transform="translate(540,900) scale(${zoom}) translate(-540,-900)">${scene(sh, t)}</g>`;
  if (sh.scene !== 'cierre') out += subs(t) + brand;
  for (const sc of WIPES) { const s2 = SHOTS.find(x => x.scene === sc); if (!s2) continue; out += wipe((t - (s2.start - .42)) / .85); }
  if (window.SAFE_DEBUG) out += `<rect x="${SAFE.left}" y="${SAFE.top}" width="${SAFE.right - SAFE.left}" height="${SAFE.bottom - SAFE.top}" fill="none" stroke="red" stroke-width="4" stroke-dasharray="20 10"/>`;
  svg.innerHTML = out;
};
window.DURATION = TL.duration;
window.SAFE_DEBUG = new URLSearchParams(location.search).has('safe');
seek(0);
window.READY = true;
</script>
