<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:'SG';src:url(fonts/space-grotesk-latin-700-normal.woff2);font-weight:700}@font-face{font-family:'SG';src:url(fonts/space-grotesk-latin-500-normal.woff2);font-weight:500}@font-face{font-family:'JB';src:url(fonts/jetbrains-mono-latin-500-normal.woff2);font-weight:500}html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,cv=document.getElementById('c'),g=cv.getContext('2d');
let TL,EV,STUDIO;
const WH='#f1f1ee',MU='#8d8d93',AC='#6fe3c1',UP='#ff7a66',ICE='#a9d8ff',FUEL='#e7b04b',DIM='#3a3a40';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,k=(t,at,d=.35)=>clamp((t-at)/d);
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
async function setup(tl){TL=tl;EV=tl.ev;await document.fonts.load('700 40px SG');await document.fonts.load('500 40px SG');await document.fonts.load('500 40px JB');
  const c=document.createElement('canvas');c.width=W;c.height=H;const p=c.getContext('2d');
  p.fillStyle='#070708';p.fillRect(0,0,W,H);
  const sp=p.createRadialGradient(W/2,860,30,W/2,860,760);sp.addColorStop(0,'#2b2b30');sp.addColorStop(.55,'#141417');sp.addColorStop(1,'#070708');p.fillStyle=sp;p.fillRect(0,0,W,H);
  const fl=p.createLinearGradient(0,1240,0,1340);fl.addColorStop(0,'rgba(255,255,255,0)');fl.addColorStop(.5,'rgba(255,255,255,.05)');fl.addColorStop(1,'rgba(255,255,255,0)');p.fillStyle=fl;p.fillRect(0,1240,W,100);
  const id=p.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*7;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}p.putImageData(id,0,0);STUDIO=c;}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function T(s,x,y,fs,col=WH,wt=700,align='center',font='SG'){g.font=`${wt} ${fs}px ${font}`;g.textAlign=align;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y);}
function fit(s,fs,maxW,wt=700,font='SG'){g.font=`${wt} ${fs}px ${font}`;const w=g.measureText(s).width;return w>maxW?fs*maxW/w:fs;}
function steel(x0,y0,x1,y1,a='#4a4a50',b='#b9b9c0',c='#2a2a2f'){const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,c);gr.addColorStop(.45,b);gr.addColorStop(.6,a);gr.addColorStop(1,c);return gr;}
function glow(x,y,r,col,a=.35){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.save();g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore();}
function shadow(x,y,w,a=.6){const gr=g.createRadialGradient(x,y,2,x,y,w);gr.addColorStop(0,`rgba(0,0,0,${a})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.save();g.translate(x,y);g.scale(1,.18);g.translate(-x,-y);g.fillStyle=gr;g.beginPath();g.arc(x,y,w,0,7);g.fill();g.restore();}
// header: figure kicker + title (+ optional 2nd line)
function head(n,kick,a,b,t,at,col2=AC){const p=k(t,at,.45);if(p<=0)return;g.save();g.globalAlpha=ease(p);const dy=(1-ease(p))*20;
  g.strokeStyle=DIM;g.lineWidth=2;g.beginPath();g.moveTo(100,292);g.lineTo(980,292);g.stroke();
  T(`FIG. 0${n}`,100,272,24,MU,500,'left','JB');T(kick,980,272,24,MU,500,'right','JB');
  T(a,W/2,355+dy,fit(a,66,860),WH);if(b)T(b,W/2,432+dy,fit(b,50,860,500),col2,500);g.restore();}
// leader-line label: anchor (ax,ay) -> elbow (ex,ey) -> text
function lab(ax,ay,ex,ey,txt,sub,t,at,col=WH,side=1){const p=k(t,at,.55);if(p<=0)return;g.save();
  const l1=clamp(p/.5),l2=clamp((p-.4)/.3);g.strokeStyle='rgba(241,241,238,.75)';g.lineWidth=2;
  g.fillStyle=col;g.beginPath();g.arc(ax,ay,6*ease(clamp(p*4)),0,7);g.fill();g.strokeStyle=col;g.globalAlpha=.5;g.beginPath();g.arc(ax,ay,13*ease(clamp(p*3)),0,7);g.stroke();g.globalAlpha=1;
  g.strokeStyle='rgba(241,241,238,.7)';g.beginPath();g.moveTo(ax,ay);g.lineTo(lerp(ax,ex,l1),lerp(ay,ey,l1));if(l2>0)g.lineTo(ex+side*34*l2,ey);g.stroke();
  const a=clamp((p-.55)/.45);if(a>0){g.globalAlpha=a;const tx=ex+side*48;T(txt,tx+(1-ease(a))*side*-14,ey-(sub?14:0),38,col,700,side>0?'left':'right');if(sub)T(sub,tx,ey+24,22,MU,500,side>0?'left':'right','JB');}
  g.restore();}
// ---------- objects (studio product renders) ----------
function nozzle(x,y,s,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);
  g.strokeStyle='#18181b';g.lineWidth=30;g.lineCap='round';g.beginPath();g.moveTo(120,-5);g.bezierCurveTo(230,0,250,120,330,190);g.stroke();
  g.strokeStyle='#2a2a2f';g.lineWidth=8;g.beginPath();g.moveTo(124,-14);g.bezierCurveTo(236,-8,258,112,338,180);g.stroke();
  g.strokeStyle=steel(-170,0,-60,100);g.lineWidth=24;g.beginPath();g.moveTo(-60,-2);g.lineTo(-140,50);g.lineTo(-152,112);g.stroke();
  g.fillStyle=steel(0,-40,0,34,'#3d3d43','#9d9da4','#1f1f23');rr(-80,-42,210,76,28);g.fill();
  g.fillStyle='#0f0f11';g.save();g.translate(70,30);g.rotate(.25);rr(-28,0,58,132,22);g.fill();g.restore();
  g.strokeStyle='#5c5c63';g.lineWidth=8;g.beginPath();g.arc(20,52,40,.3,2.6);g.stroke();
  g.fillStyle='rgba(255,255,255,.35)';rr(-60,-34,160,10,5);g.fill();g.restore();}
function drop(x,y,s,col=FUEL){g.save();g.translate(x,y);g.scale(s,s);const gr=g.createRadialGradient(-10,10,4,0,10,50);gr.addColorStop(0,'#fff1c8');gr.addColorStop(.5,col);gr.addColorStop(1,'#8a5a12');g.fillStyle=gr;g.beginPath();g.moveTo(0,-50);g.bezierCurveTo(10,-25,38,0,38,22);g.arc(0,22,38,0,Math.PI);g.bezierCurveTo(-38,0,-10,-25,0,-50);g.fill();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(-14,14,6,12,.4,0,7);g.fill();g.restore();}
function bus(x,y,s){shadow(x,y+78*s,190*s);g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=steel(0,-90,0,70,'#9a9aa0','#e8e8ea','#55555b');rr(-160,-90,320,150,26);g.fill();
  g.fillStyle='#111114';for(let i=0;i<5;i++){rr(-140+i*52,-70,42,50,8);g.fill();}rr(122,-70,30,70,8);g.fill();
  g.fillStyle=AC;g.globalAlpha=.85;g.fillRect(-160,10,320,8);g.globalAlpha=1;
  [-95,95].forEach(w=>{g.fillStyle='#0c0c0e';g.beginPath();g.arc(w,62,30,0,7);g.fill();g.fillStyle='#77777e';g.beginPath();g.arc(w,62,12,0,7);g.fill();});g.restore();}
function truck(x,y,s){shadow(x,y+78*s,190*s);g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=steel(0,-110,0,60,'#7f7f86','#d6d6da','#45454a');rr(-170,-110,230,170,12);g.fill();
  g.fillStyle=steel(0,-60,0,60,'#9a9aa0','#ececee','#55555b');rr(70,-60,100,120,18);g.fill();g.fillStyle='#111114';rr(110,-46,46,40,8);g.fill();
  [-120,-60,120].forEach(w=>{g.fillStyle='#0c0c0e';g.beginPath();g.arc(w,62,28,0,7);g.fill();g.fillStyle='#77777e';g.beginPath();g.arc(w,62,11,0,7);g.fill();});g.restore();}
function plate(x,y,s,food=1){shadow(x,y+60*s,220*s,.7);g.save();g.translate(x,y);g.scale(s,s);
  const gr=g.createRadialGradient(-40,-30,10,0,0,200);gr.addColorStop(0,'#ffffff');gr.addColorStop(1,'#9c9ca2');g.fillStyle=gr;g.beginPath();g.ellipse(0,0,200,90,0,0,7);g.fill();
  g.fillStyle='#d9d9dd';g.beginPath();g.ellipse(0,2,140,60,0,0,7);g.fill();
  if(food>0){g.globalAlpha=food;g.fillStyle='#f4f1e8';g.beginPath();g.ellipse(-50,-6,60,30,0,0,7);g.fill();
    g.fillStyle='#5a1c1c';for(let i=0;i<16;i++){const a=i*2.4,r=8+(i%5)*6;g.beginPath();g.ellipse(48+Math.cos(a)*r*1.4,2+Math.sin(a)*r*.6,8,5,a,0,7);g.fill();}
    g.fillStyle='#ffffff';g.beginPath();g.ellipse(-4,26,40,18,0,0,7);g.fill();g.fillStyle='#f2b630';g.beginPath();g.ellipse(-2,24,13,8,0,0,7);g.fill();g.globalAlpha=1;}
  g.restore();}
function panel(x,y,w,h,label,val,col=WH,lift=0){g.save();g.translate(x,y);g.fillStyle='rgba(0,0,0,.5)';rr(-w/2+10,14+lift*0.5,w,h,14);g.fill();
  g.fillStyle=steel(0,-h/2,0,h/2,'#1b1b1f','#38383e','#111113');rr(-w/2,-h/2,w,h,14);g.fill();g.strokeStyle='#4a4a52';g.lineWidth=2;rr(-w/2,-h/2,w,h,14);g.stroke();
  T(label,-w/2+30,0,34,MU,700,'left');g.fillStyle='#050506';rr(w/2-280,-h/2+16,256,h-32,8);g.fill();T(val,w/2-152,2,58,col,500,'center','JB');g.restore();}
function clipboard(x,y,s){shadow(x,y+300*s,260*s);g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=steel(-230,0,230,0,'#5b5148','#8c7f71','#3e3630');rr(-230,-290,460,580,26);g.fill();
  g.fillStyle='#efede7';rr(-200,-240,400,510,10);g.fill();g.restore();}
function clip(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=steel(-80,0,80,0);rr(-80,-30,160,60,14);g.fill();g.fillStyle='#1a1a1d';rr(-30,-46,60,26,10);g.fill();g.restore();}
function magnifier(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle='#1a1a1d';g.lineWidth=30;g.lineCap='round';g.beginPath();g.moveTo(70,70);g.lineTo(170,170);g.stroke();
  const gl=g.createRadialGradient(-20,-20,5,0,0,100);gl.addColorStop(0,'rgba(200,240,255,.30)');gl.addColorStop(1,'rgba(120,180,220,.10)');g.fillStyle=gl;g.beginPath();g.arc(0,0,92,0,7);g.fill();
  g.strokeStyle=steel(-100,-100,100,100);g.lineWidth=16;g.beginPath();g.arc(0,0,96,0,7);g.stroke();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=5;g.beginPath();g.arc(0,0,72,3.6,4.4);g.stroke();g.restore();}
function feather(x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);const gr=g.createLinearGradient(-30,0,30,0);gr.addColorStop(0,'#bdbdc4');gr.addColorStop(.5,'#ffffff');gr.addColorStop(1,'#a2a2aa');g.fillStyle=gr;g.beginPath();g.moveTo(0,-90);g.bezierCurveTo(40,-60,40,40,4,80);g.lineTo(-4,80);g.bezierCurveTo(-40,40,-40,-60,0,-90);g.fill();
  g.strokeStyle='#6d6d74';g.lineWidth=3;g.beginPath();g.moveTo(0,-88);g.lineTo(0,110);g.stroke();g.strokeStyle='rgba(80,80,88,.5)';g.lineWidth=1.5;for(let i=-70;i<70;i+=14){g.beginPath();g.moveTo(0,i);g.lineTo(26,i-14);g.moveTo(0,i);g.lineTo(-26,i-14);g.stroke();}g.restore();}
function puck(x,y,txt,col){g.save();g.shadowColor=col;g.shadowBlur=24;g.fillStyle=col;rr(x-90,y-34,180,68,34);g.fill();g.shadowBlur=0;T(txt,x,y+2,32,'#0b0b0d',700);g.restore();}
function lock(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.strokeStyle=steel(-40,0,40,0);g.lineWidth=14;g.beginPath();g.arc(0,-30,30,Math.PI,0);g.lineTo(30,0);g.moveTo(-30,-30);g.lineTo(-30,0);g.stroke();g.fillStyle=steel(-50,0,50,0,'#7e6a2f','#e9cf7a','#5c4a1c');rr(-48,-6,96,74,12);g.fill();g.fillStyle='#1a1a1d';g.beginPath();g.arc(0,24,9,0,7);g.fill();g.fillRect(-4,26,8,22);g.restore();}
// mini icons for exploded plate
function icoDrop(x,y){drop(x,y,.8);}
function icoWheel(x,y){g.save();g.translate(x,y);g.fillStyle='#0d0d0f';g.beginPath();g.arc(0,0,44,0,7);g.fill();g.strokeStyle='#4d4d55';g.lineWidth=6;g.beginPath();g.arc(0,0,36,0,7);g.stroke();g.fillStyle=steel(-20,-20,20,20);g.beginPath();g.arc(0,0,18,0,7);g.fill();g.restore();}
function icoSack(x,y){g.save();g.translate(x,y);const gr=g.createLinearGradient(-40,0,40,0);gr.addColorStop(0,'#8a7350');gr.addColorStop(.5,'#d2bb8c');gr.addColorStop(1,'#7a6343');g.fillStyle=gr;g.beginPath();g.moveTo(-28,-40);g.quadraticCurveTo(-52,20,-40,44);g.lineTo(40,44);g.quadraticCurveTo(52,20,28,-40);g.closePath();g.fill();g.fillStyle='#5b4a30';g.fillRect(-30,-48,60,12);g.fillStyle='#f0e4c4';for(let i=0;i<6;i++){g.beginPath();g.ellipse(-16+i*6,-50,4,6,0,0,7);g.fill();}g.restore();}
function icoHand(x,y){g.save();g.translate(x,y);g.fillStyle=steel(-40,0,40,0,'#9a9aa0','#e6e6e8','#5b5b61');g.beginPath();g.arc(0,-18,22,0,7);g.fill();rr(-38,8,76,44,20);g.fill();g.fillStyle=FUEL;rr(-30,-46,60,16,8);g.fill();g.restore();}
function icoBox(x,y){g.save();g.translate(x,y);g.fillStyle='#c9c9ce';g.beginPath();g.moveTo(0,-40);g.lineTo(42,-18);g.lineTo(0,4);g.lineTo(-42,-18);g.closePath();g.fill();g.fillStyle='#8f8f96';g.beginPath();g.moveTo(-42,-18);g.lineTo(0,4);g.lineTo(0,48);g.lineTo(-42,26);g.closePath();g.fill();g.fillStyle='#6b6b72';g.beginPath();g.moveTo(42,-18);g.lineTo(0,4);g.lineTo(0,48);g.lineTo(42,26);g.closePath();g.fill();g.restore();}
function table(x,y,s){shadow(x,y+170*s,300*s,.7);g.save();g.translate(x,y);g.scale(s,s);const gr=g.createLinearGradient(-280,0,280,0);gr.addColorStop(0,'#3b2b20');gr.addColorStop(.5,'#7a5a40');gr.addColorStop(1,'#33251b');g.fillStyle=gr;g.beginPath();g.ellipse(0,0,280,80,0,0,7);g.fill();g.fillStyle='#24190f';g.fillRect(-280,0,560,22);g.beginPath();g.ellipse(0,22,280,80,0,0,Math.PI);g.fill();g.fillStyle='#1c140c';g.fillRect(-14,90,28,80);g.fillRect(-90,160,180,14);g.fillStyle=gr;g.beginPath();g.ellipse(0,0,280,80,0,0,7);g.fill();g.restore();}
function floatY(t,ph,a=8){return Math.sin(t*1.6+ph)*a;}
// ---------- scenes ----------
const SC=[];
SC[0]=t=>{const E=EV;head(1,'COMBUSTIBLE','LA GASOLINA BAJÓ',null,t,0);
  const p=ease(k(t,0,.6));nozzle(560,640-60*(1-p),1.05,-.25);glow(410,760,150,FUEL,.2*p);
  for(let i=0;i<3;i++){const tt=(t-.2-i*.55);if(tt>0&&tt<1.2){const yy=780+tt*tt*260;g.save();g.globalAlpha=clamp(1.4-tt);drop(410,yy,.55);g.restore();}}
  lab(430,720,640,780,'PRECIO ↓','súper y regular',t,E.bajo,AC);
  const pb=ease(k(t,E.bus,.6)),pc=ease(k(t,E.comida,.6));
  g.setLineDash([8,10]);g.strokeStyle='rgba(241,241,238,.35)';g.lineWidth=2;
  if(pb>0){g.beginPath();g.moveTo(410,900);g.lineTo(lerp(410,290,pb),lerp(900,1030,pb));g.stroke();}
  if(pc>0){g.beginPath();g.moveTo(410,900);g.lineTo(lerp(410,770,pc),lerp(900,1040,pc));g.stroke();}g.setLineDash([]);
  if(pb>0){g.save();g.globalAlpha=pb;bus(290,1110+floatY(t,0)+(1-pb)*60,.78);g.restore();T('¿EL BUS?',290,1250,40,WH,700);}
  if(pc>0){g.save();g.globalAlpha=pc;plate(770,1120+floatY(t,1)+(1-pc)*60,.95);g.restore();T('¿LA COMIDA?',770,1250,40,WH,700);}};
SC[1]=t=>{const E=EV,s=E.S[1];head(2,'POR GALÓN','SÚPER Y REGULAR','Tegucigalpa',t,s,MU);
  const p=ease(k(t,s,.5));g.fillStyle=steel(500,0,560,0,'#2a2a2f','#5a5a62','#18181b');g.fillRect(398,620,24,640*p);shadow(410,1262,200);
  g.fillStyle=steel(0,560,0,620,'#1b1b1f','#3a3a40','#101012');rr(160,560,500,70,16);g.fill();T('COMBUSTIBLE',410,596,30,FUEL,700);
  // exploded panels
  const e1=back(k(t,E.super,.6)),e2=back(k(t,E.regular,.6));
  const sw1=k(t,E.cinco,.5),sw2=k(t,E.regular+.25,.5);
  const y1=740+floatY(t,0,5),y2=920+floatY(t,2,5);
  g.save();g.globalAlpha=clamp(p*2);panel(410-40*e1,y1-30*e1,500,130,'SÚPER',sw1<.5?'147.90':'142.91',sw1<.5?WH:AC);
  panel(410-40*e2,y2+10*e2,500,130,'REGULAR',sw2<.5?'132.91':'128.05',sw2<.5?WH:AC);g.restore();
  if(sw1>0&&sw1<1){g.save();g.globalAlpha=Math.sin(sw1*Math.PI);g.fillStyle=AC;g.fillRect(410-40*e1+100,y1-30*e1-2,240,4);g.restore();}
  lab(410-40*e1+240,y1-30*e1-40,720,640,'−L4.99','casi 5 lempiras',t,E.cinco,AC);
  lab(410-40*e2+240,y2+10*e2+40,720,1080,'−L4.86','también bajó',t,E.regular+.2,AC);
  // old values ghosted
  if(sw1>=.5){g.save();g.globalAlpha=.5;T('147.90',200,y1-30*e1+100,30,MU,500,'left','JB');g.strokeStyle=UP;g.lineWidth=3;g.beginPath();g.moveTo(196,y1-30*e1+100);g.lineTo(316,y1-30*e1+100);g.stroke();g.restore();}
  if(sw2>=.5){g.save();g.globalAlpha=.5;T('132.91',200,y2+10*e2+100,30,MU,500,'left','JB');g.strokeStyle=UP;g.lineWidth=3;g.beginPath();g.moveTo(196,y2+10*e2+100);g.lineTo(316,y2+10*e2+100);g.stroke();g.restore();}};
SC[2]=t=>{const E=EV,s=E.S[2];head(3,'POR GALÓN','DIÉSEL',null,t,s);
  const p=ease(k(t,s,.5));g.save();g.globalAlpha=p;panel(540,620,560,140,'DIÉSEL','153.53',WH);g.restore();
  const f=back(k(t,E.congelado,.45));if(f>0){g.save();g.strokeStyle=ICE;g.lineWidth=6;g.globalAlpha=clamp(f);const m=lerp(60,14,clamp(f));const bx=540-280-m,by=620-70-m,bw=560+2*m,bh=140+2*m,c=40;
    [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]].forEach(([x,y,sx,sy])=>{g.beginPath();g.moveTo(x,y+sy*c);g.lineTo(x,y);g.lineTo(x+sx*c,y);g.stroke();});
    glow(540,620,330,ICE,.16*clamp(f));lock(540,520+floatY(t,1,4),.8*clamp(f));
    T('CONGELADO',540,780,44,ICE,700);g.restore();}
  const sb=ease(k(t,E.subsidio,.4));if(sb>0){g.save();g.globalAlpha=sb;g.strokeStyle=ICE;g.lineWidth=2;rr(390,820,300,52,26);g.stroke();T('CON SUBSIDIO',540,847,26,ICE,500,'center','JB');g.restore();}
