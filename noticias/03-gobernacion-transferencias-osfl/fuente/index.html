<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let TL,EV,BG;
const FG='#eef2f4',MUT='#8b959c',SURF='#121418',SURF2='#1a1d22',ICE='#9fd8ff',BLUE='#2f7fe0',GOLD='#f5c451',GREEN='#35c27a',RED='#ff5a5f',AMB='#ffb547';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const k=(t,at,d=.35)=>clamp((t-at)/d);
const SANS="'Inter Display'",MONO="'JetBrains Mono'";
function T(s,x,y,fs,wt=900,col=FG,align='center',font=SANS){g.font=`${wt} ${fs}px ${font}`;g.textAlign=align;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y);}
function fitT(s,x,y,fs,maxW,wt=900,col=FG,align='center',font=SANS){g.font=`${wt} ${fs}px ${font}`;const w=g.measureText(s).width;if(w>maxW)fs*=maxW/w;T(s,x,y,fs,wt,col,align,font);}
function gradT(s,x,y,fs,c1,c2,wt=900,font=SANS,align='center'){g.font=`${wt} ${fs}px ${font}`;g.textAlign=align;g.textBaseline='middle';const w=g.measureText(s).width;const x0=align==='center'?x-w/2:x;const gr=g.createLinearGradient(x0,y-fs/2,x0+w,y+fs/2);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillText(s,x,y);}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function card(x,y,w,h,r=28,fill=SURF,stroke='rgba(255,255,255,.1)'){g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=40;g.shadowOffsetY=16;g.fillStyle=fill;rr(x,y,w,h,r);g.fill();g.restore();g.strokeStyle=stroke;g.lineWidth=2;rr(x,y,w,h,r);g.stroke();}
function glow(x,y,r,col,a){if(a<=0)return;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',a));gr.addColorStop(1,col.replace('A',0));g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
function chip(s,x,y,p,col=ICE,fs=34,fg='#0e191e'){if(p<=0)return;g.save();g.translate(x,y);const sc=back(p);g.scale(sc,sc);g.globalAlpha*=clamp(p*2);g.font=`800 ${fs}px ${SANS}`;const w=g.measureText(s).width+56;g.fillStyle=col;rr(-w/2,-fs*.85,w,fs*1.7,fs*.85);g.fill();T(s,0,2,fs,800,fg);g.restore();}
function label(s,y,col=ICE){T(s,W/2,y,36,700,col,'center',MONO);}
function makeBG(){const c=document.createElement('canvas');c.width=W;c.height=H;const p=c.getContext('2d');
  p.fillStyle='#070707';p.fillRect(0,0,W,H);
  p.strokeStyle='rgba(255,255,255,.035)';p.lineWidth=1;for(let x=0;x<=W;x+=60){p.beginPath();p.moveTo(x,0);p.lineTo(x,H);p.stroke();}for(let y=0;y<=H;y+=60){p.beginPath();p.moveTo(0,y);p.lineTo(W,y);p.stroke();}
  const id=p.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*10;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}p.putImageData(id,0,0);
  const v=p.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');p.fillStyle=v;p.fillRect(0,0,W,H);return c;}
async function setup(tl){TL=tl;EV=tl.ev;await document.fonts.load(`900 40px ${SANS}`);await document.fonts.load(`700 40px ${MONO}`);BG=makeBG();}

function chunks(sc){const out=[];let cur=[];sc.sub.forEach(w=>{cur.push(w);if(cur.length>=4){out.push(cur);cur=[];}});if(cur.length)out.push(cur);return out;}
let CH=null;
function subs(t,si){if(!CH)CH=TL.scenes.map(chunks);let cur=null;for(const c of CH[si])if(t>=c[0][0]-.05)cur=c;if(!cur||t>cur[cur.length-1][1]+.6)return;
  let fs=66;g.font=`900 ${fs}px ${SANS}`;const words=cur.map(w=>w[2].toUpperCase());const sp=24;
  let tw=words.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(words.length-1);if(tw>940){fs*=940/tw;g.font=`900 ${fs}px ${SANS}`;tw=words.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(words.length-1);}
  let x=W/2-tw/2;const y=1475;g.save();g.globalAlpha=k(t,cur[0][0]-.05,.12);
  words.forEach((w,i)=>{const ww=g.measureText(w).width;const on=t>=cur[i][0]-.03&&(i==words.length-1||t<cur[i+1][0]-.03);
    if(on){g.fillStyle=BLUE;rr(x-14,y-fs*.62,ww+28,fs*1.24,16);g.fill();}
    T(w,x,y,fs,900,on?'#fff':'rgba(238,242,244,.92)','left');x+=ww+sp;});g.restore();}
function chrome(t){g.fillStyle=ICE;rr(60,266,330,58,29);g.fill();T('NOTICIA EXPLICADA',225,296,30,800,'#0e191e');
  g.fillStyle='rgba(255,255,255,.1)';g.fillRect(60,350,960,2);
  g.fillStyle='rgba(255,255,255,.08)';rr(60,1578,960,8,4);g.fill();g.fillStyle=ICE;rr(60,1578,960*clamp(t/TL.total),8,4);g.fill();}
function sceneAt(t){let si=0;TL.scenes.forEach((s,i)=>{if(t>=s.start)si=i;});return si;}
const f1=n=>n.toFixed(1);
function money(v,x,y,fs,c1='#ffe39a',c2=GOLD,suf=' M',align='center',dec=1){gradT('L '+v.toFixed(dec)+suf,x,y,fs,c1,c2,800,MONO,align);}
function ring(cx,cy,r,lw,p,col,p0=0){g.save();g.lineCap='round';g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.arc(cx,cy,r,-Math.PI/2+p0*2*Math.PI,-Math.PI/2+(p0+p)*2*Math.PI);if(p>0.001)g.stroke();g.restore();}

// ---------- data ----------
const TOP=[['Fundación Cáncer de Mama',20],['Unidos Trabajando por el Desarrollo',12],['Fundación Bienestar Integral',12],['Fundación EDMONT',12],
 ['Fundación Soñemos Juntos Honduras',11],['Fundación Para la Educación y Salud',11],['Asoc. Coordinadora de Recursos para el Desarrollo',11],['Asoc. para el Desarrollo de Choluteca',11],['Asoc. de Desarrollo Ruta Comunitaria',10]];
const ADD=[['Inst. Desarrollo Comunitario',10.5,0],['Asoc. Desarrollo Choluteca',11,1],['Fund. Pro Cáncer La Ceiba',10,0],['Asoc. Bendecida y de Guías',7,1],
 ['Grupo Musical Black Men Soul',2,0],['C. Rehab. Puerto Cortés',2,1],['C. Rehab. Ciegos Luis Braile',1.5,0],['Esperanza por el Autismo',1.5,0],
 ['Iglesia Diócesis Choluteca',1.5,0],['Asoc. IDEAS',1,0],['Hermanas Franciscanas',.7,1],['Casa de Restauración',.5,0],
 ['Asistencia a Quemados',.3,0],['Autismo Siguatepeque',.2,0]];

// ---------- scenes ----------
// ================= v2: more animated =================
function rnd(s){let x=Math.sin(s*999.13)*43758.5453;return x-Math.floor(x);}
function enter(t,at){const p=ease(k(t,at,.42));g.globalAlpha=clamp(p*1.6);g.translate((1-p)*W*.45,0);g.translate(W/2,H/2);g.rotate((1-p)*.05);g.scale(lerp(.96,1,p),lerp(.96,1,p));g.translate(-W/2,-H/2);}
// impact list → screen shake
let HITS=[];
function shake(t){let x=0,y=0;HITS.forEach(h=>{const d=t-h;if(d>0&&d<.5){const a=Math.exp(-d*9)*14;x+=Math.sin(d*70)*a;y+=Math.cos(d*55)*a*.8;}});return [x,y];}
// grunge stamp
function stamp(s,cx,cy,fs,rot,t,at,col=RED){if(t<at)return;const p=clamp((t-at)/.18);const sc=lerp(2.6,1,ease(p));
  g.save();g.translate(cx,cy);g.rotate(rot);g.scale(sc,sc);g.globalAlpha*=lerp(0,.95,p);
  g.font=`900 ${fs}px ${SANS}`;const w=g.measureText(s).width+100,h=fs*1.45;
  g.strokeStyle=col;g.lineWidth=9;rr(-w/2,-h/2,w,h,14);g.stroke();g.lineWidth=3;rr(-w/2+12,-h/2+12,w-24,h-24,8);g.stroke();T(s,0,fs*.04,fs,900,col);
  g.globalCompositeOperation='destination-out';const hs=Math.min(1,fs/70);for(let i=0;i<40;i++){g.beginPath();g.arc((rnd(i+fs)-.5)*w,(rnd(i*3+fs)-.5)*h,(1+rnd(i*7)*3)*hs,0,7);g.fill();}
  g.restore();}
// banknote
function bill(x,y,rot,s,col='#3fae6a',alpha=1){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.globalAlpha*=alpha;
  g.fillStyle=col;rr(-110,-55,220,110,10);g.fill();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=4;rr(-96,-42,192,84,8);g.stroke();
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(0,0,30,0,7);g.fill();T('L',0,3,44,900,'rgba(255,255,255,.85)');
  T('100',-70,-26,18,800,'rgba(0,0,0,.4)','center',MONO);T('100',70,26,18,800,'rgba(0,0,0,.4)','center',MONO);g.restore();}
function coin(x,y,r,spin=0,alpha=1){g.save();g.translate(x,y);g.globalAlpha*=alpha;const sx=Math.abs(Math.cos(spin))*.85+.15;g.scale(sx,1);
  g.fillStyle='#c9971f';g.beginPath();g.arc(0,r*.12,r,0,7);g.fill();g.fillStyle=GOLD;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.strokeStyle='#a8801f';g.lineWidth=r*.12;g.beginPath();g.arc(0,0,r*.72,0,7);g.stroke();
  if(sx>.4)T('L',0,2,r*1.05,900,'#7a5a10');g.restore();}
// money bag
function bag(x,y,s,sq=0){g.save();g.translate(x,y);g.scale(s*(1+sq*.12),s*(1-sq*.12));
  g.fillStyle='#d9b36a';g.beginPath();g.moveTo(-60,-120);g.quadraticCurveTo(0,-80,60,-120);g.lineTo(40,-80);g.quadraticCurveTo(170,0,130,90);g.quadraticCurveTo(0,150,-130,90);g.quadraticCurveTo(-170,0,-40,-80);g.closePath();g.fill();
  g.strokeStyle='#8a6a2a';g.lineWidth=8;g.stroke();g.fillStyle='#8a6a2a';rr(-50,-95,100,22,10);g.fill();T('L',0,20,120,900,'#6b4f14');g.restore();}
function confetti(t,at,cx,cy,n=60){const d=t-at;if(d<0||d>2.2)return;for(let i=0;i<n;i++){const a=rnd(i)*6.28,v=380+rnd(i+9)*520;const x=cx+Math.cos(a)*v*d,y=cy+Math.sin(a)*v*d*.7+700*d*d;
  g.save();g.translate(x,y);g.rotate(d*8+i);g.globalAlpha*=clamp(1-d/2.2);g.fillStyle=[GOLD,ICE,GREEN,'#fff',BLUE][i%5];g.fillRect(-9,-5,18,10);g.restore();}}
function floaty(t,seed,amp=8){return Math.sin(t*2+seed)*amp;}
// ambient particles
function ambient(t){for(let i=0;i<18;i++){const x=rnd(i)*W,sp=20+rnd(i+3)*30,y=((rnd(i+7)*H)-(t*sp))%H;const yy=y<0?y+H:y;coin(x,yy,10+rnd(i+1)*10,t*2+i,.08);}}

// ---------- scenes ----------
function sc1(t){
  label('TRANSFERENCIAS A ORGANIZACIONES',450);
  const L=[['¿CUÁNTO LE HA DADO',.1,FG],['GOBERNACIÓN',EV.gob-.1,'g'],['A FUNDACIONES?',EV.gob+.6,FG]];
  L.forEach(([s,at,c],i)=>{const p=back(k(t,at,.4));if(p<=0)return;g.save();g.globalAlpha*=clamp(p);const y=580+i*125;g.translate(W/2,y);g.scale(p,p);if(c==='g')gradT(s,0,0,118,'#cfeeff',BLUE);else fitT(s,0,0,100,960);g.restore();});
  // report drops in
  const p=k(t,EV.inf-.35,.55);if(p>0){const y=lerp(-400,1110,back(p)),r=lerp(-.6,-.06,ease(p));g.save();g.translate(W/2,y+floaty(t,1,6));g.rotate(r);
    card(-300,-190,600,380,24,'#f4f6f8','rgba(0,0,0,.2)');g.fillStyle=BLUE;g.fillRect(-300,-190,600,70);T('INFORME DE EJECUCIÓN',0,-155,36,900,'#fff');
    g.fillStyle='#c5ccd3';for(let i=0;i<6;i++)g.fillRect(-250,-90+i*40,i%2?380:500,14);
    g.fillStyle=GREEN;g.fillRect(-250,170-80,60,-40);g.fillStyle=ICE;g.fillRect(-170,90,60,-70);g.fillStyle=GOLD;g.fillRect(-90,90,60,-100);
    g.restore();
    // magnifier sweep
    const m=k(t,EV.inf+.2,1.4);if(m>0){const mx=lerp(W/2-220,W/2+200,eio(m)),my=1080+Math.sin(m*6)*40;g.save();g.translate(mx,my);g.strokeStyle=FG;g.lineWidth=14;g.beginPath();g.arc(0,0,70,0,7);g.stroke();g.fillStyle='rgba(159,216,255,.15)';g.fill();g.lineWidth=20;g.lineCap='round';g.beginPath();g.moveTo(50,50);g.lineTo(120,120);g.stroke();g.restore();}
  }
}
function sc2(t){
  glow(W/2,820,520,'rgba(245,196,81,A)',.14*k(t,EV.apr,.6));
  label('APROBADO PARA 2026',450);
  // raining bills into bag
  const ra=t-EV.S[1];for(let i=0;i<14;i++){const st=i*.32;const d=ra-st;if(d<0||d>1.3)continue;const x=W/2-260+rnd(i)*520,y=lerp(380,1150,d/1.1);bill(x,y,Math.sin(d*6+i)*.7,.55,'#3fae6a',clamp(1.3-d));}
  const land=EV.S[1]+.2;const bp=k(t,land,.5);if(bp>0){const y=lerp(-200,1140,back(bp));const sq=Math.max(0,Math.sin((t-land-.5)*14))*Math.exp(-(t-land-.5)*4)*(t>land+.5?1:0);bag(W/2,y,1.15,sq);}
  if(t>=EV.apr-.05){const v=290.7*eio(k(t,EV.apr,1.8));const p=back(k(t,EV.apr,.4));g.save();g.translate(W/2,640);g.scale(p,p);money(v,0,0,170,'#ffe39a',GOLD,'');g.restore();
    g.save();g.globalAlpha*=k(t,EV.apr+1.2,.3);T('MILLONES DE LEMPIRAS',W/2,780,54);g.restore();}
  chip('A ORGANIZACIONES SIN FINES DE LUCRO',W/2,1350,k(t,EV.transf,.35),SURF2,34,FG);
}
function sc3(t){
  label('PRESUPUESTO',450);
  // stack of bills being cut
  const cut=k(t,EV.bajo,.5);const fall=t-EV.bajo-.35;
  for(let i=0;i<10;i++){const y=1180-i*34;const isTop=i>=8;let yy=y,x=W/2,r=0,a=1;
    if(isTop&&fall>0){yy=y+fall*fall*1600;x=W/2+(i-8.5)*fall*400;r=(i-8.5)*fall*3;a=clamp(1-fall*1.4);}
    bill(x,yy,r,1.35,i%2?'#3fae6a':'#36a060',a);}
  // scissors
  if(t>EV.bajo-.3&&t<EV.bajo+1.2){const p=ease(k(t,EV.bajo-.3,.6));const sx=lerp(-150,W+150,p),sy=1180-8*34+17;const op=Math.abs(Math.sin(t*22))*.5;g.save();g.translate(sx,sy);
    g.strokeStyle=FG;g.lineWidth=12;g.fillStyle=RED;[op,-op].forEach(o=>{g.save();g.rotate(o);g.beginPath();g.moveTo(0,0);g.lineTo(110,0);g.stroke();g.beginPath();g.arc(-40,0,26,0,7);g.fill();g.restore();});g.restore();}
  g.save();g.globalAlpha*=1-k(t,EV.n236,.4)*.5;money(290.7,W/2,600,100,'#8b959c','#6b7380');g.restore();
  if(cut>0){g.strokeStyle=RED;g.lineWidth=10;g.beginPath();g.moveTo(W/2-300,600);g.lineTo(W/2-300+600*ease(cut),600);g.stroke();}
  if(t>=EV.n236-.05){const v=lerp(290.7,236.7,eio(k(t,EV.n236,1.3)));const p=back(k(t,EV.n236,.4));g.save();g.translate(W/2,750);g.scale(p,p);money(v,0,0,150,'#cfeeff',ICE,' M');g.restore();
    T('VIGENTE',W/2,850,34,700,ICE,'center',MONO);}
  stamp('−54 MILLONES',W/2+150,1320,54,-.12,t,EV.n236+1.3,RED);
}
function sc4(t){
  const cx=W/2,cy=860,r=300;
  g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=56;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();
  const p=.6596*eio(k(t,EV.ejec,2.6));ring(cx,cy,r,56,p,GREEN);
  // coins flying into the ring tip
  for(let i=0;i<12;i++){const st=EV.ejec+i*.2,d=(t-st)/.6;if(d<0||d>1)continue;const a=-Math.PI/2+(.6596*eio(k(st+.6,EV.ejec,2.6)))*2*Math.PI;const tx=cx+Math.cos(a)*r,ty=cy+Math.sin(a)*r;
    const sx=rnd(i)*W,sy=380;coin(lerp(sx,tx,eio(d)),lerp(sy,ty,eio(d))-Math.sin(d*Math.PI)*120,26,t*10+i,1);}
  glow(cx,cy,330,'rgba(53,194,122,A)',.14*k(t,EV.ejec,.6));
  T('EJECUTADO',cx,cy-110,36,700,GREEN,'center',MONO);
  if(t>=EV.n156-.1){const v=156.1*eio(k(t,EV.n156,1.4));money(v,cx,cy-10,96,'#d6ffe8',GREEN,' M');}
  T('de L 236.7 M vigentes',cx,cy+90,34,600,MUT);
  const q=back(k(t,EV.pct,.4));if(q>0){g.save();g.translate(cx,1275);g.scale(q,q);T(Math.round(p*100)+'%',0,0,150,800,FG,'center',MONO);g.restore();}
}
function person(x,y,on,jump,col=GREEN){g.save();g.translate(x,y-jump);g.fillStyle=on?col:'rgba(255,255,255,.1)';g.beginPath();g.arc(0,-14,17,0,7);g.fill();g.beginPath();g.ellipse(0,26,26,20,0,Math.PI,0);g.fill();g.restore();}
function sc5(t){
  const n=Math.round(21*eio(k(t,EV.n21-.6,1.4)));
  const q=back(k(t,EV.n21-.6,.4));if(q>0){g.save();g.translate(W/2,540);g.scale(q,q);gradT(String(n),0,0,200,'#d6ffe8',GREEN,800,MONO);g.restore();}
  T('ORGANIZACIONES RECIBIERON',W/2,680,48);T('de 44 en la lista del informe',W/2,740,32,600,MUT);
  for(let i=0;i<44;i++){const c=i%11,rw=Math.floor(i/11);const x=135+c*81,y=900+rw*100;const a=k(t,EV.S[4]+.1+i*.012,.3);if(a<=0)continue;
    const lit=EV.n21-.6+1.4*Math.pow(i/21,1.1);const on=i<21&&t>=lit;const d=t-lit;const jump=on&&d<.5?Math.sin(d/.5*Math.PI)*40:0;
    g.save();g.globalAlpha*=a;person(x,y,on,jump);if(on&&d<.7)coin(x,y-60-d*120,14,d*12,clamp(1-d/.7));g.restore();}
}
function sc6(t){
  glow(W/2,900,560,'rgba(245,196,81,A)',.16*k(t,EV.fcm,.6));
  chip('LA QUE MÁS RECIBIÓ',W/2,450,k(t,EV.S[5]+.1,.35),GOLD,36,'#1a1400');
  // podium
  const pp=back(k(t,EV.S[5]+.2,.5));if(pp>0){g.save();g.translate(W/2,1250);g.scale(1,pp);g.fillStyle=SURF2;rr(-380,-60,240,160,12);g.fill();rr(140,-30,240,130,12);g.fill();g.fillStyle=GOLD;rr(-130,-130,260,230,14);g.fill();T('1',0,-20,120,900,'#1a1400');T('2',-260,30,70,800,MUT);T('3',260,40,60,800,MUT);g.restore();}
  const p=k(t,EV.fcm-.2,.55);if(p>0){const y=lerp(-300,820,back(p))+floaty(t,2,8);g.save();g.translate(W/2,y);g.rotate(Math.sin(t*1.5)*.015);card(-420,-200,840,400,36,SURF2,'rgba(245,196,81,.5)');
    // trophy
    g.fillStyle=GOLD;g.beginPath();g.moveTo(-50,-170);g.lineTo(50,-170);g.quadraticCurveTo(50,-90,0,-80);g.quadraticCurveTo(-50,-90,-50,-170);g.fill();g.fillRect(-10,-82,20,26);g.fillRect(-36,-58,72,14);
