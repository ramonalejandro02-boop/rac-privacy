<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Anton';src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:'Elite';src:url(fonts/special-elite-latin-400-normal.woff2)}
@font-face{font-family:'Play';src:url(fonts/playfair-display-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:'Arch';src:url(fonts/archivo-black-latin-400-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let TL,EV,PAPER,HITS=[];
const INK='#1b1a17',PAPERC='#efe6d2',RED='#d62828',BLUE='#1f5fa8',LBLUE='#8db8e3',GREY='#cfc6b2',GREEN='#2a9d58',YEL='#ffd23f';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const k=(t,at,d=.35)=>clamp((t-at)/d);
function rnd(s){let x=Math.sin(s*999.13)*43758.5453;return x-Math.floor(x);}
const GOLD='#d99a1e',AMB='#e07a1f',CREAM='#fbf7ec';
function makePaper(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const p=c.getContext('2d');
  p.fillStyle=PAPERC;p.fillRect(0,0,W,H);
  const id=p.getImageData(0,0,W,H),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*18;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.8;}
  p.putImageData(id,0,0);
  // fibers
  p.globalAlpha=.06;p.strokeStyle='#6b5a3a';
  for(let i=0;i<500;i++){const x=Math.random()*W,y=Math.random()*H,a=Math.random()*6.28,l=8+Math.random()*30;p.lineWidth=Math.random()*1.5;p.beginPath();p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke();}
  p.globalAlpha=1;
  // fold lines
  const gr=p.createLinearGradient(0,H*.5-30,0,H*.5+30);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,'rgba(0,0,0,.07)');gr.addColorStop(1,'rgba(0,0,0,0)');p.fillStyle=gr;p.fillRect(0,H*.5-30,W,60);
  // vignette
  const v=p.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(60,40,10,.35)');p.fillStyle=v;p.fillRect(0,0,W,H);
  // faint newspaper columns
  p.globalAlpha=.05;p.fillStyle=INK;
  for(let col=0;col<4;col++)for(let r=0;r<110;r++){const w=200+rnd(col*200+r)*40;p.fillRect(40+col*255,40+r*17,w*(r%9==8?.5:1),6);}
  p.globalAlpha=1;
  return c;
}
function T(s,x,y,fs,font='Anton',col=INK,align='center',base='middle'){g.font=`${font==='Play'?'900 ':''}${fs}px ${font}`;g.textAlign=align;g.textBaseline=base;g.fillStyle=col;g.fillText(s,x,y);}
function fitT(s,x,y,fs,maxW,font='Anton',col=INK,align='center'){g.font=`${font==='Play'?'900 ':''}${fs}px ${font}`;const w=g.measureText(s).width;if(w>maxW)fs*=maxW/w;T(s,x,y,fs,font,col,align);}
function shadowed(fn,off=10,a=.25){g.save();g.shadowColor=`rgba(40,25,0,${a})`;g.shadowOffsetX=off*.5;g.shadowOffsetY=off;g.shadowBlur=off*1.4;fn();g.restore();}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function tape(x,y,rot,w=130){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle='rgba(240,225,170,.85)';g.fillRect(-w/2,-20,w,40);g.strokeStyle='rgba(150,130,80,.3)';g.strokeRect(-w/2,-20,w,40);g.restore();}
function note(cx,cy,w,h,rot,sc,fill='#fbf7ec'){g.save();g.translate(cx,cy);g.rotate(rot);g.scale(sc,sc);shadowed(()=>{g.fillStyle=fill;g.fillRect(-w/2,-h/2,w,h);},14,.3);g.restore();}
function stamp(s,cx,cy,fs,rot,t,at,col=RED){
  if(t<at)return;const p=clamp((t-at)/.18);const sc=lerp(2.4,1,ease(p));
  g.save();g.translate(cx,cy);g.rotate(rot);g.scale(sc,sc);g.globalAlpha*=lerp(0,.92,p);
  g.font=`${fs}px Anton`;const w=g.measureText(s).width+80,h=fs*1.35;
  g.strokeStyle=col;g.lineWidth=10;rr(-w/2,-h/2,w,h,14);g.stroke();g.lineWidth=4;rr(-w/2+12,-h/2+12,w-24,h-24,8);g.stroke();
  T(s,0,fs*.04,fs,'Anton',col);
  // grunge holes
  g.fillStyle='rgba(239,230,210,.85)';const hs=Math.min(1,fs/80);
  for(let i=0;i<45;i++){g.beginPath();g.arc((rnd(i+fs)-.5)*w,(rnd(i*3+fs)-.5)*h,(1+rnd(i*7)*3)*hs,0,7);g.fill();}
  g.restore();
}
function marker(x,y,w,h,p,col='rgba(255,210,63,.85)'){if(p<=0)return;g.save();g.fillStyle=col;g.beginPath();const ww=w*p;g.moveTo(x,y+4);g.lineTo(x+ww,y);g.lineTo(x+ww-6,y+h);g.lineTo(x+4,y+h-3);g.closePath();g.fill();g.restore();}
function pin(x,y,p,col=RED){if(p<=0)return;const yy=y-lerp(160,0,ease(p))+ (p<1?Math.sin(p*9)*6*(1-p):0);
  g.save();g.translate(x,yy);g.scale(1.15,1.15);
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(4,4,14*ease(p),5,0,0,7);g.fill();
  g.fillStyle=col;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(-30,-38,-26,-70,0,-70);g.bezierCurveTo(26,-70,30,-38,0,0);g.fill();
  g.strokeStyle=INK;g.lineWidth=4;g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(0,-46,10,0,7);g.fill();g.restore();}
function label(s,x,y,p,bg=INK,fg='#fff',fs=40,rot=-.03){if(p<=0)return;g.save();g.translate(x,y);g.rotate(rot);const sc=back(p);g.scale(sc,sc);g.font=`${fs}px Anton`;const w=g.measureText(s).width+40;
  shadowed(()=>{g.fillStyle=bg;g.fillRect(-w/2,-fs*.7,w,fs*1.4);},8,.3);T(s,0,fs*.03,fs,'Anton',fg);g.restore();}
function check(x,y,s,p,col=GREEN){if(p<=0)return;g.save();g.translate(x,y);g.strokeStyle=col;g.lineWidth=s*.16;g.lineCap='round';g.lineJoin='round';g.beginPath();
  const pts=[[-s*.4,0],[-s*.12,s*.3],[s*.45,-s*.38]];const p1=clamp(p*2),p2=clamp(p*2-1);
  g.moveTo(...pts[0]);g.lineTo(lerp(pts[0][0],pts[1][0],p1),lerp(pts[0][1],pts[1][1],p1));if(p2>0)g.lineTo(lerp(pts[1][0],pts[2][0],p2),lerp(pts[1][1],pts[2][1],p2));g.stroke();g.restore();}
function arrow(x1,y1,x2,y2,p,col=INK,lw=8){if(p<=0)return;const x=lerp(x1,x2,ease(p)),y=lerp(y1,y2,ease(p));g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.lineCap='round';g.setLineDash([18,14]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x,y);g.stroke();g.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1);g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(10,0);g.lineTo(-24,-18);g.lineTo(-24,18);g.closePath();g.fill();g.restore();}

// ---------- map ----------

async function setup(tl){TL=tl;EV=tl.ev;
  await Promise.all(['Anton','Elite','Arch'].map(f=>document.fonts.load(`40px ${f}`)));await document.fonts.load('900 40px Play');PAPER=makePaper();}
// ---------- subtitles ----------
function chunks(sc){const out=[];let cur=[];sc.sub.forEach(w=>{cur.push(w);if(cur.length>=4){out.push(cur);cur=[];}});if(cur.length)out.push(cur);return out;}
let CH=null;
function subs(t,si){if(!CH)CH=TL.scenes.map(chunks);let cur=null;for(const c of CH[si])if(t>=c[0][0]-.05)cur=c;if(!cur||t>cur[cur.length-1][1]+.6)return;
  const fs0=74;g.font=`${fs0}px Anton`;const words=cur.map(w=>w[2].toUpperCase());const sp=22;
  let tw=words.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(words.length-1);const fs=tw>960?fs0*960/tw:fs0;g.font=`${fs}px Anton`;tw=words.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(words.length-1);
  let x=W/2-tw/2;const y=1470;g.save();g.globalAlpha=k(t,cur[0][0]-.05,.12);
  words.forEach((w,i)=>{const ww=g.measureText(w).width;const on=t>=cur[i][0]-.03&&(i==words.length-1||t<cur[i+1][0]-.03);
    if(on)marker(x-12,y-fs*.62,ww+24,fs*1.18,1);g.lineWidth=10;g.strokeStyle=PAPERC;g.lineJoin='round';g.font=`${fs}px Anton`;g.textAlign='left';g.textBaseline='middle';
    if(!on)g.strokeText(w,x,y);T(w,x,y,fs,'Anton',INK,'left');x+=ww+sp;});g.restore();}
function chrome(t){g.fillStyle=RED;g.fillRect(60,262,360,64);T('NOTICIA EXPLICADA',240,296,40,'Anton','#fff');
  g.fillStyle=INK;g.fillRect(60,336,960,5);g.fillRect(60,346,960,2);
  g.fillStyle='rgba(0,0,0,.12)';g.fillRect(60,1580,960,8);g.fillStyle=RED;g.fillRect(60,1580,960*clamp(t/TL.total),8);}
function sceneAt(t){let si=0;TL.scenes.forEach((s,i)=>{if(t>=s.start)si=i;});return si;}
function enter(t,at){const p=ease(k(t,at,.4));g.translate((1-p)*W*.5,0);g.translate(W/2,H/2);g.rotate((1-p)*.06);g.translate(-W/2,-H/2);g.globalAlpha=clamp(p*1.5);}
function shake(t){let x=0,y=0;HITS.forEach(h=>{const d=t-h;if(d>0&&d<.5){const a=Math.exp(-d*9)*14;x+=Math.sin(d*70)*a;y+=Math.cos(d*55)*a*.8;}});return [x,y];}
// ---------- objects ----------
const sub_=s=>s;
function kicker(s,y,p=1){if(p<=0)return;g.save();g.globalAlpha*=p;T(s,W/2,y,36,'Elite',INK);g.restore();}
function headline(s,y,fs,col,p,font='Anton',maxW=960){if(p<=0)return;g.save();g.translate(W/2,y);const sc=back(p);g.scale(sc,sc);fitT(s,0,0,fs,maxW,font,col);g.restore();}
function num(s,x,y,fs,col=INK,font='Anton'){T(s,x,y,fs,font,col);}
function bill(x,y,rot,s,col='#5fb37a',alpha=1){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.globalAlpha*=alpha;
  shadowed(()=>{g.fillStyle=col;g.fillRect(-110,-55,220,110);},6,.25);g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=4;g.strokeRect(-96,-42,192,84);
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.arc(0,0,30,0,7);g.fill();T('L',0,3,46,'Anton','rgba(255,255,255,.9)');T('100',-68,-24,22,'Anton','rgba(0,0,0,.4)');T('100',68,24,22,'Anton','rgba(0,0,0,.4)');g.restore();}
function coin(x,y,r,spin=0,alpha=1){g.save();g.translate(x,y);g.globalAlpha*=alpha;const sx=Math.abs(Math.cos(spin))*.85+.15;g.scale(sx,1);
  g.fillStyle='#a87412';g.beginPath();g.arc(0,r*.12,r,0,7);g.fill();g.fillStyle=GOLD;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.strokeStyle=INK;g.lineWidth=Math.max(2,r*.1);g.stroke();
  g.strokeStyle='#a87412';g.lineWidth=r*.1;g.beginPath();g.arc(0,0,r*.7,0,7);g.stroke();if(sx>.4)T('L',0,2,r*1.05,'Anton',INK);g.restore();}
function bag(x,y,s,sq=0){g.save();g.translate(x,y);g.scale(s*(1+sq*.12),s*(1-sq*.12));
  shadowed(()=>{g.fillStyle='#d9b36a';g.beginPath();g.moveTo(-60,-120);g.quadraticCurveTo(0,-80,60,-120);g.lineTo(40,-80);g.quadraticCurveTo(170,0,130,90);g.quadraticCurveTo(0,150,-130,90);g.quadraticCurveTo(-170,0,-40,-80);g.closePath();g.fill();},12,.3);
  g.strokeStyle=INK;g.lineWidth=7;g.stroke();g.fillStyle=INK;g.fillRect(-50,-95,100,20);T('L',0,25,130,'Anton',INK);g.restore();}
function confetti(t,at,cx,cy,n=60){const d=t-at;if(d<0||d>2.2)return;for(let i=0;i<n;i++){const a=rnd(i)*6.28,v=380+rnd(i+9)*520;const x=cx+Math.cos(a)*v*d,y=cy+Math.sin(a)*v*d*.7+700*d*d;
  g.save();g.translate(x,y);g.rotate(d*8+i);g.globalAlpha*=clamp(1-d/2.2);g.fillStyle=[RED,GOLD,BLUE,GREEN,INK][i%5];g.fillRect(-9,-5,18,10);g.restore();}}
function person(x,y,on,jump){g.save();g.translate(x,y-jump);g.fillStyle=on?GREEN:'rgba(27,26,23,.18)';g.beginPath();g.arc(0,-14,17,0,7);g.fill();g.beginPath();g.ellipse(0,26,26,20,0,Math.PI,0);g.fill();
  if(on){g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.arc(0,-14,17,0,7);g.stroke();}g.restore();}
function ring(cx,cy,r,lw,p,col,p0=0){if(p<=.001)return;g.save();g.lineCap='butt';g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.arc(cx,cy,r,-Math.PI/2+p0*2*Math.PI,-Math.PI/2+(p0+p)*2*Math.PI);g.stroke();g.restore();}
function ringBase(cx,cy,r,lw){g.save();g.strokeStyle=INK;g.lineWidth=4;g.beginPath();g.arc(cx,cy,r+lw/2,0,7);g.stroke();g.beginPath();g.arc(cx,cy,r-lw/2,0,7);g.stroke();
  g.strokeStyle='rgba(27,26,23,.08)';g.lineWidth=lw;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();g.restore();}
function paperCard(cx,cy,w,h,rot,sc=1,fill=CREAM){g.save();g.translate(cx,cy);g.rotate(rot);g.scale(sc,sc);shadowed(()=>{g.fillStyle=fill;g.fillRect(-w/2,-h/2,w,h);},14,.3);g.restore();}
function hand(x,y,press){g.save();g.translate(x,y);g.scale(1-press*.12,1-press*.12);g.fillStyle='#fff';g.strokeStyle=INK;g.lineWidth=5;
  g.beginPath();g.moveTo(0,0);g.lineTo(0,-70);g.quadraticCurveTo(0,-84,13,-84);g.quadraticCurveTo(26,-84,26,-70);g.lineTo(26,-30);g.lineTo(70,-20);g.quadraticCurveTo(86,-14,82,6);g.lineTo(70,60);g.lineTo(10,60);g.lineTo(-24,10);g.quadraticCurveTo(-30,-6,-14,-8);g.closePath();g.fill();g.stroke();g.restore();}
function ambient(t){for(let i=0;i<12;i++){const x=rnd(i)*W,sp=20+rnd(i+3)*30,y=((rnd(i+7)*H)-(t*sp))%H;coin(x,y<0?y+H:y,10+rnd(i+1)*10,t*2+i,.1);}}

// ---------- data (sin nombres) ----------
const TOP=[20,12,12,12,11,11,11,11,10];
const ADD=[[11,1],[10.5,0],[10,0],[7,1],[2,0],[2,1],[1.5,0],[1.5,0],[1.5,0],[1,0],[.7,1],[.5,0],[.3,0],[.2,0]];

// ---------- scenes ----------
function sc1(t){
  kicker('TRANSFERENCIAS A ORGANIZACIONES',440,k(t,.1,.3));
  headline('¿CUÁNTO LE HA DADO',560,110,INK,k(t,.15,.4));
  headline('GOBERNACIÓN',690,150,RED,k(t,EV.gob-.1,.4));
  headline('A FUNDACIONES?',820,110,INK,k(t,EV.gob+.6,.4));
  const p=k(t,EV.inf-.35,.55);if(p>0){const y=lerp(-400,1130,back(p)),r=lerp(-.6,-.05,ease(p));g.save();g.translate(W/2,y);g.rotate(r);
    shadowed(()=>{g.fillStyle='#fff';g.fillRect(-300,-180,600,360);},16,.3);g.fillStyle=BLUE;g.fillRect(-300,-180,600,70);T('INFORME DE EJECUCIÓN',0,-144,40,'Anton','#fff');
    g.fillStyle='rgba(27,26,23,.3)';for(let i=0;i<5;i++)g.fillRect(-250,-80+i*38,i%2?300:420,12);
    g.fillStyle=GREEN;g.fillRect(170,120,40,-60);g.fillStyle=GOLD;g.fillRect(220,120,40,-100);g.fillStyle=RED;g.fillRect(120,120,40,-40);
    g.restore();tape(W/2-230,y-190,-.3);tape(W/2+230,y-170,.25);
    const m=k(t,EV.inf+.2,1.4);if(m>0){const mx=lerp(W/2-220,W/2+200,eio(m)),my=1110+Math.sin(m*6)*40;g.save();g.translate(mx,my);g.strokeStyle=INK;g.lineWidth=14;g.fillStyle='rgba(141,184,227,.25)';g.beginPath();g.arc(0,0,70,0,7);g.fill();g.stroke();g.lineWidth=22;g.lineCap='round';g.beginPath();g.moveTo(50,50);g.lineTo(120,120);g.stroke();g.restore();}}
}
function sc2(t){
  kicker('APROBADO PARA 2026',440);
  const ra=t-EV.S[1];for(let i=0;i<14;i++){const d=ra-i*.32;if(d<0||d>1.3)continue;bill(W/2-260+rnd(i)*520,lerp(380,1150,d/1.1),Math.sin(d*6+i)*.7,.55,'#5fb37a',clamp(1.3-d));}
  const land=EV.S[1]+.2;const bp=k(t,land,.5);if(bp>0){const y=lerp(-200,1150,back(bp));const dd=t-land-.5;const sq=dd>0?Math.sin(dd*14)*Math.exp(-dd*4):0;bag(W/2,y,1.1,sq);}
  if(t>=EV.apr-.05){const v=290.7*eio(k(t,EV.apr,1.8));const p=back(k(t,EV.apr,.4));g.save();g.translate(W/2,620);g.scale(p,p);num('L '+v.toFixed(1),0,0,210,INK);g.restore();
    g.save();g.globalAlpha*=k(t,EV.apr+1.2,.3);T('MILLONES DE LEMPIRAS',W/2,770,60,'Anton',RED);g.restore();}
  label('PARA ORGANIZACIONES SIN FINES DE LUCRO',W/2,1350,k(t,EV.transf,.35),INK,YEL,40,.02);
}
function sc3(t){
  kicker('PRESUPUESTO',440);
  const fall=t-EV.bajo-.35;
  for(let i=0;i<10;i++){const y=1180-i*34;const top=i>=8;let yy=y,x=W/2,r=0,a=1;if(top&&fall>0){yy=y+fall*fall*1600;x=W/2+(i-8.5)*fall*400;r=(i-8.5)*fall*3;a=clamp(1-fall*1.4);}bill(x,yy,r,1.35,i%2?'#5fb37a':'#4fa36a',a);}
  if(t>EV.bajo-.3&&t<EV.bajo+1.2){const p=ease(k(t,EV.bajo-.3,.6));const sx=lerp(-150,W+150,p),sy=1180-8*34+17;const op=Math.abs(Math.sin(t*22))*.5;g.save();g.translate(sx,sy);
    g.strokeStyle=INK;g.lineWidth=12;g.fillStyle=RED;[op,-op].forEach(o=>{g.save();g.rotate(o);g.beginPath();g.moveTo(0,0);g.lineTo(110,0);g.stroke();g.beginPath();g.arc(-40,0,26,0,7);g.fill();g.stroke();g.restore();});g.restore();}
  g.save();g.globalAlpha*=1-k(t,EV.n236,.4)*.5;num('L 290.7 M',W/2,560,100,'rgba(27,26,23,.55)');g.restore();
  const cut=k(t,EV.bajo,.5);if(cut>0){g.strokeStyle=RED;g.lineWidth=12;g.beginPath();g.moveTo(W/2-250,565);g.lineTo(W/2-250+500*ease(cut),558);g.stroke();}
  if(t>=EV.n236-.05){const v=lerp(290.7,236.7,eio(k(t,EV.n236,1.3)));const p=back(k(t,EV.n236,.4));g.save();g.translate(W/2,710);g.scale(p,p);num('L '+v.toFixed(1)+' M',0,0,160,BLUE);g.restore();T('VIGENTE',W/2,815,34,'Elite',INK);}
  stamp('−54 MILLONES',W/2+150,1320,60,-.12,t,EV.n236+1.3,RED);
}
function sc4(t){
  const cx=W/2,cy=860,r=290,lw=60;ringBase(cx,cy,r,lw);
