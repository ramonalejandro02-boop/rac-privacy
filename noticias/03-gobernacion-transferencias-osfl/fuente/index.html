<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let TL,EV,BG;
const FG='#eef2f4',MUT='#8b959c',SURF='#121418',SURF2='#1a1d22',ICE='#9fd8ff',BLUE='#2f7fe0',GOLD='#f5c451',GREEN='#35c27a',RED='#ff5a5f',AMB='#ffb547';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const k=(t,at,d=.35)=>clamp((t-at)/d);
const SANS="'Inter Display'",MONO="'JetBrains Mono'";
function T(s,x,y,fs,wt=900,col=FG,align='center',font=SANS){g.font=`${wt} ${fs}px ${font}`;g.textAlign=align;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y);}
function fitT(s,x,y,fs,maxW,wt=900,col=FG,align='center',font=SANS){g.font=`${wt} ${fs}px ${font}`;const w=g.measureText(s).width;if(w>maxW)fs*=maxW/w;T(s,x,y,fs,wt,col,align,font);}
function gradT(s,x,y,fs,c1,c2,wt=900,font=SANS,align='center'){g.font=`${wt} ${fs}px ${font}`;g.textAlign=align;g.textBaseline='middle';const w=g.measureText(s).width;const x0=align==='center'?x-w/2:x;const gr=g.createLinearGradient(x0,y-fs/2,x0+w,y+fs/2);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillText(s,x,y);}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function card(x,y,w,h,r=28,fill=SURF,stroke='rgba(255,255,255,.1)'){g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=40;g.shadowOffsetY=16;g.fillStyle=fill;rr(x,y,w,h,r);g.fill();g.restore();g.strokeStyle=stroke;g.lineWidth=2;rr(x,y,w,h,r);g.stroke();}
function glow(x,y,r,col,a){if(a<=0)return;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',a));gr.addColorStop(1,col.replace('A',0));g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
function chip(s,x,y,p,col=ICE,fs=34,fg='#0e191e'){if(p<=0)return;g.save();g.translate(x,y);const sc=back(p);g.scale(sc,sc);g.globalAlpha*=clamp(p*2);g.font=`800 ${fs}px ${SANS}`;const w=g.measureText(s).width+56;g.fillStyle=col;rr(-w/2,-fs*.85,w,fs*1.7,fs*.85);g.fill();T(s,0,2,fs,800,fg);g.restore();}
function label(s,y,col=ICE){T(s,W/2,y,36,700,col,'center',MONO);}
function makeBG(){const c=document.createElement('canvas');c.width=W;c.height=H;const p=c.getContext('2d');
  p.fillStyle='#070707';p.fillRect(0,0,W,H);
  p.strokeStyle='rgba(255,255,255,.035)';p.lineWidth=1;for(let x=0;x<=W;x+=60){p.beginPath();p.moveTo(x,0);p.lineTo(x,H);p.stroke();}for(let y=0;y<=H;y+=60){p.beginPath();p.moveTo(0,y);p.lineTo(W,y);p.stroke();}
  const id=p.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*10;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}p.putImageData(id,0,0);
  const v=p.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');p.fillStyle=v;p.fillRect(0,0,W,H);return c;}
async function setup(tl){TL=tl;EV=tl.ev;await document.fonts.load(`900 40px ${SANS}`);await document.fonts.load(`700 40px ${MONO}`);BG=makeBG();}

function chunks(sc){const out=[];let cur=[];sc.sub.forEach(w=>{cur.push(w);if(cur.length>=4){out.push(cur);cur=[];}});if(cur.length)out.push(cur);return out;}
let CH=null;
function subs(t,si){if(!CH)CH=TL.scenes.map(chunks);let cur=null;for(const c of CH[si])if(t>=c[0][0]-.05)cur=c;if(!cur||t>cur[cur.length-1][1]+.6)return;
  let fs=66;g.font=`900 ${fs}px ${SANS}`;const words=cur.map(w=>w[2].toUpperCase());const sp=24;
  let tw=words.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(words.length-1);if(tw>940){fs*=940/tw;g.font=`900 ${fs}px ${SANS}`;tw=words.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(words.length-1);}
  let x=W/2-tw/2;const y=1475;g.save();g.globalAlpha=k(t,cur[0][0]-.05,.12);
  words.forEach((w,i)=>{const ww=g.measureText(w).width;const on=t>=cur[i][0]-.03&&(i==words.length-1||t<cur[i+1][0]-.03);
    if(on){g.fillStyle=BLUE;rr(x-14,y-fs*.62,ww+28,fs*1.24,16);g.fill();}
    T(w,x,y,fs,900,on?'#fff':'rgba(238,242,244,.92)','left');x+=ww+sp;});g.restore();}
function chrome(t){g.fillStyle=ICE;rr(60,266,330,58,29);g.fill();T('NOTICIA EXPLICADA',225,296,30,800,'#0e191e');

  g.fillStyle='rgba(255,255,255,.08)';rr(60,1578,960,8,4);g.fill();g.fillStyle=ICE;rr(60,1578,960*clamp(t/TL.total),8,4);g.fill();}
function sceneAt(t){let si=0;TL.scenes.forEach((s,i)=>{if(t>=s.start)si=i;});return si;}
function enter(t,at){const p=ease(k(t,at,.45));g.globalAlpha=clamp(p*1.4);const s=lerp(1.05,1,p);g.translate(W/2,H/2);g.scale(s,s);g.translate(-W/2,-H/2);}
const f1=n=>n.toFixed(1);
function money(v,x,y,fs,c1='#ffe39a',c2=GOLD,suf=' M',align='center',dec=1){gradT('L '+v.toFixed(dec)+suf,x,y,fs,c1,c2,800,MONO,align);}
function ring(cx,cy,r,lw,p,col,p0=0){g.save();g.lineCap='round';g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.arc(cx,cy,r,-Math.PI/2+p0*2*Math.PI,-Math.PI/2+(p0+p)*2*Math.PI);if(p>0.001)g.stroke();g.restore();}

function bars(t,count,y0,showFrom){

  TOP.forEach(([n,v],i)=>{const at=showFrom[i];const a=k(t,at,.35);if(a<=0)return;const y=y0+i*rowH;g.save();g.globalAlpha*=a;
    fitT(n,90,y,36,900,800,i==0?GOLD:FG,'left');
    const w=690*v/20*eio(k(t,at,.7));g.fillStyle=i==0?GOLD:(v==12?ICE:v==11?BLUE:'#5b6cff');rr(90,y+26,Math.max(w,1),36,10);g.fill();
    T('L '+v+' M',90+w+16,y+45,34,800,FG,'left',MONO);g.restore();});
