<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:'Mk';src:url(fonts/permanent-marker-latin-400-normal.woff2)}@font-face{font-family:'Hand';src:url(fonts/kalam-latin-700-normal.woff2)}html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,cv=document.getElementById('c'),g=cv.getContext('2d');
let TL,EV,BOARD,TIP=null;
const BK='#1f2328',BL='#1f5fbf',RD='#d0312d',GR='#2e8b57';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,k=(t,at,d=.35)=>clamp((t-at)/d);
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
function rnd(s){let x=Math.sin(s*999.13)*43758.5453;return x-Math.floor(x);}
async function setup(tl){TL=tl;EV=tl.ev;await document.fonts.load('40px Mk');await document.fonts.load('40px Hand');BOARD=makeBoard();}
function makeBoard(){const c=document.createElement('canvas');c.width=W;c.height=H;const p=c.getContext('2d');
  p.fillStyle='#f6f6f2';p.fillRect(0,0,W,H);
  // smudges of old erased marker
  for(let i=0;i<26;i++){p.save();p.globalAlpha=.035;p.strokeStyle=i%3?'#555':'#3a5f9f';p.lineWidth=30+rnd(i)*40;p.lineCap='round';p.beginPath();const x=rnd(i+1)*W,y=rnd(i+2)*H;p.moveTo(x,y);p.quadraticCurveTo(x+rnd(i+3)*300-150,y+rnd(i+4)*120-60,x+rnd(i+5)*400-200,y+rnd(i+6)*80-40);p.stroke();p.restore();}
  const id=p.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*6;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}p.putImageData(id,0,0);
  // aluminium frame
  const fr=p.createLinearGradient(0,0,W,0);fr.addColorStop(0,'#b9bec4');fr.addColorStop(.5,'#e3e6ea');fr.addColorStop(1,'#a9aeb4');p.fillStyle=fr;
  p.fillRect(0,0,W,22);p.fillRect(0,H-22,W,22);p.fillRect(0,0,22,H);p.fillRect(W-22,0,22,H);
  // marker tray at bottom
  p.fillStyle='#c9cdd2';p.fillRect(22,H-70,W-44,48);p.fillStyle='#9aa0a6';p.fillRect(22,H-70,W-44,6);
  [[160,BK],[300,BL],[440,RD]].forEach(([x,c])=>{p.fillStyle=c;p.fillRect(x,H-58,110,22);p.fillStyle='#fff';p.fillRect(x+80,H-58,30,22);});
  p.fillStyle='#3b3f45';p.fillRect(700,H-64,180,34);p.fillStyle='#d8c9a8';p.fillRect(700,H-40,180,10);
  return c;}
// --- hand-drawn geometry ---
function J(pts,seed,a=3){return pts.map((p,i)=>[p[0]+(rnd(seed+i*1.7)-.5)*a,p[1]+(rnd(seed+i*2.3)-.5)*a]);}
function L(x1,y1,x2,y2,n=8){const o=[];for(let i=0;i<=n;i++)o.push([lerp(x1,x2,i/n),lerp(y1,y2,i/n)]);return o;}
function C(cx,cy,r,n=40,a0=-Math.PI/2,sweep=Math.PI*2.08,ry=r){const o=[];for(let i=0;i<=n;i++){const a=a0+sweep*i/n;o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*ry]);}return o;}
function R(x,y,w,h){return [...L(x,y,x+w,y,6),...L(x+w,y,x+w,y+h,6).slice(1),...L(x+w,y+h,x,y+h,6).slice(1),...L(x,y+h,x,y-4,6).slice(1)];}
function len(pts){let s=0;for(let i=1;i<pts.length;i++)s+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return s;}
function ink(pts,p,col=BK,w=9,seed=0){if(p<=0)return;pts=J(pts,seed+pts.length,2.5);const tot=len(pts)*clamp(p);let acc=0;g.save();g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(pts[0][0],pts[0][1]);let tip=pts[0];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);if(acc+d>=tot){const u=(tot-acc)/d;tip=[lerp(pts[i-1][0],pts[i][0],u),lerp(pts[i-1][1],pts[i][1],u)];g.lineTo(tip[0],tip[1]);break;}acc+=d;g.lineTo(pts[i][0],pts[i][1]);tip=pts[i];}
  g.globalAlpha=.92;g.stroke();g.restore();if(p<1)TIP={x:tip[0],y:tip[1],col};}
// draw a list of strokes sequentially over duration
function seq(strokes,t,at,dur,col=BK,w=9){const tot=strokes.reduce((a,s)=>a+len(s),0);let acc=0;strokes.forEach((s,i)=>{const l=len(s);const p=(k(t,at,dur)*tot-acc)/l;ink(s,p,col,w,i*13);acc+=l;});}
// handwriting reveal
function write(s,x,y,fs,col,t,at,dur=null,font='Mk',align='center',rot=0){const p=k(t,at,dur||Math.max(.25,s.length*.045));if(p<=0)return;g.save();g.translate(x,y);g.rotate(rot);g.font=`${fs}px ${font}`;g.textAlign=align;g.textBaseline='middle';const w=g.measureText(s).width;const x0=align==='center'?-w/2:align==='right'?-w:0;
  g.beginPath();g.rect(x0-10,-fs,(w+20)*p,fs*2);g.clip();g.fillStyle=col;g.globalAlpha=.94;g.fillText(s,0,0);g.restore();if(p<1){const tx=x+Math.cos(rot)*(x0+w*p),ty=y+Math.sin(rot)*(x0+w*p)+fs*.15+Math.sin(t*40)*fs*.15;TIP={x:tx,y:ty,col};}}
function fitFs(s,fs,maxW,font='Mk'){g.font=`${fs}px ${font}`;const w=g.measureText(s).width;return w>maxW?fs*maxW/w:fs;}
// marker hand at the drawing tip
function marker(t){if(!TIP)return;const {x,y,col}=TIP;g.save();g.translate(x,y);g.rotate(-.55);
  g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(30,40,60,22,0,0,7);g.fill();
  g.fillStyle=col;g.beginPath();g.moveTo(0,0);g.lineTo(10,-8);g.lineTo(10,8);g.closePath();g.fill();
  g.fillStyle='#e9eaec';g.fillRect(10,-14,150,28);g.fillStyle=col;g.fillRect(120,-15,60,30);g.fillRect(10,-14,22,28);
  // hand
  g.fillStyle='#e0ac8a';g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=3;g.beginPath();g.ellipse(120,26,62,40,.2,0,7);g.fill();g.stroke();g.beginPath();g.ellipse(70,8,26,16,-.2,0,7);g.fill();g.stroke();
  g.fillStyle='#e0ac8a';g.fillRect(160,30,140,60);g.restore();}
// stick person
function person(x,y,s,seed){return [C(x,y-70*s,18*s,22),L(x,y-52*s,x,y),L(x,y,x-18*s,y+42*s,3),L(x,y,x+18*s,y+42*s,3),L(x-24*s,y-36*s,x+24*s,y-36*s,3)];}
function magnetNote(x,y,w,h,rot,t,at,lines,col=BK){const p=k(t,at,.3);if(p<=0)return;g.save();g.translate(x,y-(1-ease(p))*60);g.rotate(rot);g.globalAlpha=ease(p);
  g.fillStyle='rgba(0,0,0,.12)';g.fillRect(-w/2+6,-h/2+8,w,h);g.fillStyle='#fff3a6';g.fillRect(-w/2,-h/2,w,h);
  g.fillStyle=RD;g.beginPath();g.arc(0,-h/2+4,16,0,7);g.fill();g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(-5,-h/2,5,0,7);g.fill();
  lines.forEach(([s,fs,c],i)=>{g.font=`${fs}px Hand`;g.textAlign='center';g.textBaseline='middle';g.fillStyle=c||col;g.fillText(s,0,-h/2+40+i*fs*1.1);});g.restore();}

// ---- subtitles: handwritten-style lower strip ----
function chunks(sc){const out=[];let cur=[];(sc.sub||sc.words).forEach(w=>{cur.push(w);if(cur.length>=4){out.push(cur);cur=[];}});if(cur.length)out.push(cur);return out;}
let CH=null;
function subs(t,si){if(!CH)CH=TL.scenes.map(chunks);let cur=null;for(const c of CH[si])if(t>=c[0][0]-.05)cur=c;if(!cur||t>cur[cur.length-1][1]+.5)return;
  let fs=66;g.font=`${fs}px Hand`;const ws=cur.map(w=>w[2].replace(/[.,]$/,''));const sp=22;let tw=ws.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(ws.length-1);
  if(tw>930){fs*=930/tw;g.font=`${fs}px Hand`;tw=ws.reduce((a,w)=>a+g.measureText(w).width,0)+sp*(ws.length-1);}
  let x=W/2-tw/2;const y=1490;g.save();g.globalAlpha=k(t,cur[0][0]-.05,.1);
  ws.forEach((w,i)=>{const ww=g.measureText(w).width;const on=t>=cur[i][0]-.03&&(i==ws.length-1||t<cur[i+1][0]-.03);
    g.font=`${fs}px Hand`;g.textAlign='left';g.textBaseline='middle';g.fillStyle=on?BL:BK;g.fillText(w,x,y);
    if(on){g.strokeStyle=RD;g.lineWidth=6;g.lineCap='round';g.beginPath();g.moveTo(x,y+fs*.5);g.quadraticCurveTo(x+ww/2,y+fs*.62,x+ww,y+fs*.48);g.stroke();}x+=ww+sp;});g.restore();}

// ---- scenes ----
function sc1(t){
  write('¿Te acordás?',W/2,330,fitFs('¿Te acordás?',130,900),BK,t,.05,.6);
  // alcaldía building
  seq([R(80,620,230,300),L(80,620,195,540),L(195,540,310,620),R(165,820,60,100),R(110,660,50,50),R(250,660,50,50),R(110,740,50,50),R(250,740,50,50)],t,.1,1.2,BK,8);
  write('ALCALDÍA',195,960,40,BK,t,.9,.4);
  // queue of people growing
  for(let i=0;i<6;i++){const x=400+i*100;seq(person(x,860,1.1,i),t,EV.filas+i*.22,.35,i%3==0?BL:BK,8);}
  // calendar
  write('en enero',W/2,450,64,RD,t,EV.enero-.1,.4,'Hand');
  write('permiso de operación',W/2,1110,64,BL,t,EV.permiso,.7,'Hand');
}
function sc2(t){const S=EV.S[1];
  // timeline arrow 8:00 -> 17:00
  seq([L(120,760,920,760),L(920,760,880,730,2),L(920,760,880,790,2)],t,S+.05,.6,BK,9);
  write('8:00',170,820,52,BK,t,S+.4,.3);
  write('17:00',880,820,52,BK,t,S+1.0,.3);
  write('1 día',W/2,560,120,RD,t,EV.perdido-.1,.4);seq([C(W/2,560,170,40,-Math.PI/2,Math.PI*2.1,90)],t,EV.perdido+.3,.5,RD,7);
  // tramitador with $
  seq(person(470,1100,1.2,3),t,EV.trami-.5,.5,BK,8);
  write('$',620,1010,110,GR,t,EV.trami-.1,.25);
  write('tramitador',470,1210,50,BK,t,EV.trami+.2,.4,'Hand');
}
function sc3(t){const S=EV.S[2];
  for(let i=0;i<6;i++){const s=person(240+i*120,820,1.1,i);s.forEach((st,j)=>ink(st,1,BK,8,i*7+j));}
  seq([L(170,640,920,940),L(920,640,170,940)],t,S,.35,RD,16);
  write('¡SE ACABA!',W/2,1150,fitFs('¡SE ACABA!',140,900),RD,t,EV.acaba-.05,.3);
}
function sc4(t){const S=EV.S[3];
  write('Permiso 2027',W/2,330,fitFs('Permiso 2027',120,900),BK,t,S+.05,.5);
  seq([R(340,460,400,760),L(490,500,590,500),C(540,1170,22,20)],t,S+.3,.8,BK,9);
  seq([R(430,860,220,110)],t,EV.linea-.3,.3,GR,8);
  write('RENOVAR',540,915,44,GR,t,EV.linea-.1,.25);
  seq([L(470,1040,525,1095),L(525,1095,630,980)],t,EV.linea+.2,.3,GR,14);
  write('desde tu celular',W/2,1300,62,BL,t,EV.cel,.5,'Hand');
}
function sc5(t){const S=EV.S[4];
  write('Declaraciones:',W/2,330,fitFs('Declaraciones:',110,900),BK,t,S+.02,.5);
  write('también en línea',W/2,460,66,GR,t,EV.decl+.3,.5,'Hand');
  const it=[['ir al centro',EV.x1],['hacer filas',EV.x2],['pagar tramitador',EV.x3]];
  it.forEach(([s,at],i)=>{const y=680+i*190;write(s,W/2,y,76,BK,t,at-.45,.4,'Hand');
    g.font='76px Hand';const ww=g.measureText(s).width;seq([L(W/2-ww/2-15,y+6,W/2+ww/2+15,y-4)],t,at,.25,RD,9);});
}
function fitW(s){g.font='72px Hand';return g.measureText(s).width;}
function sc6(t){const S=EV.S[5];
  magnetNote(W/2,380,560,150,-.03,t,EV.sar-.1,[['como con el SAR',60,BK]]);
  write('1 firma',230,860,110,BL,t,EV.contrato-.3,.5,'Hand');
  // signature
  const sg=[];for(let i=0;i<=60;i++){const u=i/60;sg.push([120+u*230,1020+Math.sin(u*28)*22-u*14+Math.cos(u*9)*10]);}ink(sg,k(t,EV.contrato+.1,.9),BL,7,5);
  seq([L(430,800,600,800),L(600,800,565,770,1),L(600,800,565,830,1)],t,EV.todo-.7,.3,BK,10);
  seq([C(810,800,170,44)],t,EV.todo-.5,.5,GR,9);write('todo',810,760,80,GR,t,EV.todo-.1,.3);write('en línea',810,850,60,GR,t,EV.todo+.15,.3,'Hand');
}
function sc7(t){const S=EV.S[6];
  seq([R(90,280,900,170)],t,S+.05,.5,BK,7);write('Alcalde',W/2,330,54,BL,t,S+.3,.3,'Hand');write('Juan Diego Zelaya',W/2,400,fitFs('Juan Diego Zelaya',80,820),BK,t,EV.alc,.5);
  write('en los próximos días',W/2,540,60,RD,t,EV.formal,.5,'Hand','center',-.03);
  // mind map
  const cx=W/2,cy=900;seq([C(cx,cy,140,40,-Math.PI/2,Math.PI*2.05,80)],t,EV.formal+.6,.5,BK,8);write('CAMPAÑA',cx,cy,56,BK,t,EV.formal+.9,.3);
  [[EV.malls,'MALLS',200,720],[EV.medios,'MEDIOS',860,720],[EV.redes,'REDES',W/2,1170]].forEach(([at,s,x,y],i)=>{
    const ex=lerp(cx,x,.55),ey=lerp(cy,y,.55);seq([L(lerp(cx,x,.3),lerp(cy,y,.3),ex,ey)],t,at-.35,.2,BK,6);
    seq([C(x,y,120,30,-Math.PI/2,Math.PI*2.05,60)],t,at-.2,.25,[BL,RD,GR][i],7);write(s,x,y,52,[BL,RD,GR][i],t,at-.05,.2);});
}
function sc8(t){const S=EV.S[7];
  write('No se trata de',W/2,430,78,BK,t,S+.05,.5,'Hand');
  write('digitalizar,',W/2,560,110,BK,t,EV.digit-.1,.45);
  seq([L(220,575,860,540)],t,EV.digit+.55,.25,RD,14);
  write('se trata de',W/2,720,78,BK,t,EV.digit+.6,.4,'Hand');
  write('REINVENTAR',W/2,870,fitFs('REINVENTAR',140,880),RD,t,EV.reinv-.1,.4);
  write('LA BUROCRACIA',W/2,1010,fitFs('LA BUROCRACIA',110,880),RD,t,EV.reinv+.35,.45);
  write('— Juan Diego Zelaya',W/2+120,1170,48,BL,t,EV.reinv+.8,.5,'Hand');
}
function sc9(t){const S=EV.S[8];
  write('¿Esta vez sí',W/2,360,fitFs('¿Esta vez sí',120,900),BK,t,S+.02,.4);
  write('va a funcionar?',W/2,500,fitFs('va a funcionar?',120,900),BL,t,EV.vez,.5);
  seq([R(220,700,140,140)],t,EV.vez+.4,.3,BK,8);write('SÍ',460,770,100,GR,t,EV.vez+.55,.2);
  seq([R(620,700,140,140)],t,EV.vez+.5,.3,BK,8);write('NO',860,770,100,RD,t,EV.vez+.65,.2);
  seq([L(245,770,285,815),L(285,815,350,710)],t,EV.cta-.3,.25,GR,14);seq([L(645,725,735,815),L(735,725,645,815)],t,EV.cta-.05,.25,RD,14);
  write('¡Comentá!',W/2,1060,130,RD,t,EV.cta,.4);
}
const SC=[sc1,sc2,sc3,sc4,sc5,sc6,sc7,sc8,sc9];
function sceneAt(t){let si=0;TL.scenes.forEach((s,i)=>{if(t>=s.start)si=i;});return si;}
function eraser(x){g.save();g.translate(x,H/2);g.rotate(.05);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(-70,-1010,150,2040);g.fillStyle='#3b3f45';g.fillRect(-80,-1000,140,2000);g.fillStyle='#d8c9a8';g.fillRect(40,-1000,22,2000);g.restore();}
function frame(t){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.drawImage(BOARD,0,0);TIP=null;
  const si=sceneAt(t),st=EV.S[si];const ed=.32;const e=si>0?k(t,st,ed):1;
  if(e<1){const ex=lerp(-100,W+100,e);g.save();g.beginPath();g.rect(ex,0,W,H);g.clip();SC[si-1](st-.001);g.restore();TIP=null;
    g.save();g.beginPath();g.rect(0,0,ex,H);g.clip();SC[si](t);g.restore();eraser(ex);}
  else SC[si](t);
  subs(t,si);if(e>=1)marker(t);
  g.fillStyle='rgba(31,35,40,.15)';g.fillRect(60,1580,960,6);g.fillStyle=BL;g.fillRect(60,1580,960*clamp(t/TL.total),6);
  return cv.toDataURL('image/jpeg',.9);}
</script></body></html>
