<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="local-fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'), g=cv.getContext('2d');
let TL=null;
const INK='#15191c', MUTED='#6d767c', ACC='#0e191e', ICE='#d0e1e8';
const A_COL=['#cfe3e6','#8fb4bb','#4f7a84']; // Ana: azul hielo
const B_COL=['#efe2d2','#c9ad8c','#8a6c4c']; // Luis: arena
const FLOOR=1180;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');

function bg(){
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#eef0ee');gr.addColorStop(.55,'#e4e2dc');gr.addColorStop(1,'#d6d2ca');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // floor glow
  const fg=g.createRadialGradient(W/2,FLOOR+40,50,W/2,FLOOR+40,700);
  fg.addColorStop(0,'rgba(255,255,255,.55)');fg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=fg;g.fillRect(0,FLOOR-300,W,900);
}
function shadow(x,y,rx,ry,a=.18){
  const s=g.createRadialGradient(x,y,0,x,y,rx);
  s.addColorStop(0,`rgba(40,35,30,${a})`);s.addColorStop(1,'rgba(40,35,30,0)');
  g.save();g.translate(x,y);g.scale(1,ry/rx);g.translate(-x,-y);
  g.fillStyle=s;g.beginPath();g.arc(x,y,rx,0,Math.PI*2);g.fill();g.restore();
}
function shade(x,y,r,col){
  const s=g.createRadialGradient(x-r*.35,y-r*.45,r*.1,x,y,r*1.3);
  s.addColorStop(0,col[0]);s.addColorStop(.55,col[1]);s.addColorStop(1,col[2]);return s;
}
function capsule(x1,y1,x2,y2,r,col){
  const ang=Math.atan2(y2-y1,x2-x1),len=Math.hypot(x2-x1,y2-y1);
  g.save();g.translate(x1,y1);g.rotate(ang);
  const s=g.createLinearGradient(0,-r,0,r);
  s.addColorStop(0,col[0]);s.addColorStop(.45,col[1]);s.addColorStop(1,col[2]);
  g.fillStyle=s;g.beginPath();
  g.moveTo(0,-r);g.lineTo(len,-r);g.arc(len,0,r,-Math.PI/2,Math.PI/2);g.lineTo(0,r);g.arc(0,0,r,Math.PI/2,Math.PI*1.5);
  g.fill();g.restore();
}
function sphere(x,y,r,col){g.fillStyle=shade(x,y,r,col);g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
// faceless mannequin, feet at (x,y), height ~ 520*s. pose: {armL:[dx,dy], armR:[dx,dy], step:0..1}
function mannequin(x,y,s,col,pose={}){
  const k=s; shadow(x,y+6*k,150*k,28*k,.22);
  const hip=[x,y-250*k], sh=[x,y-430*k];
  const step=pose.step||0;
  // legs
  capsule(x-28*k,hip[1],x-34*k+step*30*k,y-14*k,24*k,col);
  capsule(x+28*k,hip[1],x+34*k-step*30*k,y-14*k,24*k,col);
  // torso
  sphere(x,hip[1]+6*k,44*k,col);
  capsule(x,hip[1]-10*k,x,sh[1]+20*k,54*k,col);
  // arms
  const aL=pose.armL||[-70,170], aR=pose.armR||[70,170];
  capsule(x-78*k,sh[1]+18*k,x+aL[0]*k,sh[1]+aL[1]*k,19*k,col);
  capsule(x+78*k,sh[1]+18*k,x+aR[0]*k,sh[1]+aR[1]*k,19*k,col);
  sphere(x-78*k,sh[1]+18*k,30*k,col);sphere(x+78*k,sh[1]+18*k,30*k,col);
  // neck + head
  capsule(x,sh[1],x,sh[1]-40*k,18*k,col);
  g.save();g.translate(x,sh[1]-95*k);g.scale(1,1.18);sphere(0,0,52*k,col);g.restore();
  return {hand:[x+aR[0]*k,sh[1]+aR[1]*k],handL:[x+aL[0]*k,sh[1]+aL[1]*k],head:[x,sh[1]-95*k-62*k*1.18]};
}
function coin(x,y,r,tilt=.34,a=1){
  g.save();g.globalAlpha*=a;
  const h=r*tilt, th=r*.16;
  g.fillStyle='#b8862b';g.beginPath();g.ellipse(x,y+th,r,h,0,0,Math.PI*2);g.fill();
  g.fillRect(x-r,y,2*r,th);
  const s=g.createLinearGradient(x-r,y-h,x+r,y+h);
  s.addColorStop(0,'#fff1b8');s.addColorStop(.45,'#f1c44f');s.addColorStop(1,'#c99325');
  g.fillStyle=s;g.beginPath();g.ellipse(x,y,r,h,0,0,Math.PI*2);g.fill();
  g.strokeStyle='rgba(150,100,20,.45)';g.lineWidth=r*.06;g.beginPath();g.ellipse(x,y,r*.72,h*.72,0,0,Math.PI*2);g.stroke();
  g.restore();
}
function stack(x,yBase,r,n){ // stack of n coins
  const th=r*.16;
  for(let i=0;i<n;i++) coin(x,yBase-i*th*1.25,r);
}
function tower(x,yBase,r,hpx){ // tower by pixel height
  const th=r*.16*1.25; const n=Math.max(0,Math.floor(hpx/th));
  shadow(x,yBase+8,r*1.6,r*.5,.25);
  stack(x,yBase,r,n);
}
function chip(text,x,y,opt={}){
  const fs=opt.fs||44; g.font=`${opt.w||700} ${fs}px 'Space Grotesk'`;
  const tw=g.measureText(text).width, px=fs*.6, py=fs*.38, h=fs+py*2;
  const bx=opt.align==='left'?x:x-(tw+px*2)/2;
  g.fillStyle=opt.bg||INK;g.beginPath();g.roundRect(bx,y-h/2,tw+px*2,h,h/2);g.fill();
  g.fillStyle=opt.fg||'#fff';g.textBaseline='middle';g.textAlign='left';g.fillText(text,bx+px,y+fs*.04);
}
function title(text,y,fs,alpha=1,sc=1,col=INK){
  g.save();g.globalAlpha*=alpha;g.translate(W/2,y);g.scale(sc,sc);
  g.font=`700 ${fs}px 'Space Grotesk'`;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=col;g.fillText(text,0,0);g.restore();
}
function pop(lt,at,dur=.35){return back((lt-at)/dur)}
function fade(lt,at,dur=.25){return ease((lt-at)/dur)}

// ---------------- scenes ----------------
const S=[];
S[0]=(lt,d)=>{ // hook
  const grow=ease(lt/2.2);
  // coin mountain behind Ana
  for(let i=0;i<7;i++){const ox=[-160,-80,0,80,160,-120,120][i],hh=[260,380,470,380,260,150,150][i];
    tower(330+ox,FLOOR-10+(i>4?40:0),62,hh*grow);}
  mannequin(330,FLOOR+40,1.0,A_COL,{armR:[110,150]});
  mannequin(760,FLOOR+40,1.0,B_COL,{armR:[60,175],armL:[-60,175]});
  chip('ANA',330,FLOOR+110,{fs:36,bg:'#fff',fg:INK});chip('LUIS',760,FLOOR+110,{fs:36,bg:'#fff',fg:INK});
  const p=pop(lt,1.6);
  if(lt>1.6){g.save();g.translate(W/2,420);g.scale(p,p);chip('+$70,000 más',0,0,{fs:96});g.restore();}
  title('Mismo sueldo que tú',290,52,fade(lt,.1),1,MUTED);
};
S[1]=(lt,d)=>{
  mannequin(360,FLOOR+40,1.0,A_COL);mannequin(720,FLOOR+40,1.0,B_COL);
  chip('ANA',360,FLOOR+110,{fs:36,bg:'#fff',fg:INK});chip('LUIS',720,FLOOR+110,{fs:36,bg:'#fff',fg:INK});
  // equal sign between
  g.globalAlpha=fade(lt,.2);g.fillStyle=INK;g.fillRect(510,820,60,14);g.fillRect(510,850,60,14);g.globalAlpha=1;
  const items=[['Mismo sueldo',.0],['Misma edad',1.3]];
  items.forEach(([t,at],i)=>{const a=fade(lt,at);if(a>0)title(t,300+i*90,64,a,1,INK)});
  if(lt>2.6){const p=pop(lt,2.6);g.save();g.translate(W/2,520);g.scale(p,p);chip('1 sola diferencia',0,0,{fs:72,bg:'#1f6f7c'});g.restore();}
};
function jar(x,yb,w,h,fill){ // glass jar with coins
  // coins inside
  g.save();g.beginPath();g.roundRect(x-w/2,yb-h,w,h,40);g.clip();
  const lvl=h*fill; const r=w*.36, th=r*.16*1.25; const n=Math.floor(lvl/th);
  for(let i=0;i<n;i++)coin(x+((i%3)-1)*8,yb-24-i*th,r);
  g.restore();
  const gl=g.createLinearGradient(x-w/2,0,x+w/2,0);
  gl.addColorStop(0,'rgba(255,255,255,.55)');gl.addColorStop(.25,'rgba(255,255,255,.12)');gl.addColorStop(.8,'rgba(255,255,255,.08)');gl.addColorStop(1,'rgba(255,255,255,.4)');
  g.fillStyle=gl;g.strokeStyle='rgba(120,140,150,.55)';g.lineWidth=6;
  g.beginPath();g.roundRect(x-w/2,yb-h,w,h,40);g.fill();g.stroke();
  g.fillStyle='rgba(120,140,150,.35)';g.beginPath();g.roundRect(x-w/2-14,yb-h-30,w+28,36,12);g.fill();
}
S[2]=(lt,d)=>{
  shadow(680,FLOOR+20,170,30,.2);
  const drops=[.4,1.3,2.2,3.1];
  let fill=.08;drops.forEach(t=>{if(lt>t+.45)fill+=.13});
  jar(680,FLOOR+10,260,420,fill);
  drops.forEach(t=>{const k=(lt-t)/.45;if(k>0&&k<1){coin(680,lerp(FLOOR-600,FLOOR-200,k*k),70)}});
  mannequin(330,FLOOR+40,1.0,A_COL,{armR:[230,60]});
  chip('ANA',330,FLOOR+110,{fs:36,bg:'#fff',fg:INK});
  const a=fade(lt,.1);g.globalAlpha=a;
  chip('$100 / mes',W/2,330,{fs:88,bg:'#1f6f7c'});
  chip('desde los 25 años',W/2,470,{fs:50,bg:'#fff',fg:INK});
  g.globalAlpha=1;
};
function clock(x,y,r,t){
  g.save();shadow(x,y+r+40,r*.9,24,.18);
  g.fillStyle=shade(x,y,r,['#ffffff','#f1efe9','#c9c4b9']);g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  g.strokeStyle=INK;g.lineWidth=14;g.stroke();
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;g.lineWidth=i%3?5:10;g.beginPath();
    g.moveTo(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8);g.lineTo(x+Math.cos(a)*r*.9,y+Math.sin(a)*r*.9);g.stroke();}
  const hm=t*Math.PI*2*3, hh=t*Math.PI*2*.25;
  g.lineCap='round';g.lineWidth=12;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(hh)*r*.45,y-Math.cos(hh)*r*.45);g.stroke();
  g.lineWidth=8;g.strokeStyle='#c0492f';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(hm)*r*.7,y-Math.cos(hm)*r*.7);g.stroke();
  g.fillStyle=INK;g.beginPath();g.arc(x,y,14,0,Math.PI*2);g.fill();g.restore();
}
S[3]=(lt,d)=>{
  clock(700,800,190,ease(lt/2.6));
  const yrs=Math.round(lerp(25,35,ease(lt/2.6)));
  mannequin(330,FLOOR+40,1.0,B_COL,{armR:[150,40],armL:[-40,40]});
  chip('LUIS',330,FLOOR+110,{fs:36,bg:'#fff',fg:INK});
  g.globalAlpha=fade(lt,.1);
  chip('$100 / mes',W/2,330,{fs:88,bg:'#8a6c4c'});
  g.globalAlpha=1;
  chip(`empieza a los ${yrs}`,700,1100,{fs:50,bg:'#fff',fg:INK});
};
const AMAX=640; // px height for 122k
S[4]=(lt,d)=>{
  const k=easeIO((lt-.3)/(d-2.0));
  tower(620,FLOOR,90,AMAX*k);
  // contributed marker line
  mannequin(300,FLOOR+40,1.0,A_COL,{armR:[200,20]});
  chip('ANA',300,FLOOR+110,{fs:36,bg:'#fff',fg:INK});
  chip(`${Math.round(lerp(25,55,k))} años`,W/2,270,{fs:46,bg:'#fff',fg:INK});
  title(`$${fmt(lerp(0,122000,k))}`,390,128,1,1,'#1f6f7c');
  const a=fade(lt,2.0);g.globalAlpha=a;title('puso solo $36,000',490,50,a,1,MUTED);g.globalAlpha=1;
  g.font="500 30px 'Onest'";g.fillStyle=MUTED;g.textAlign='center';g.fillText('Supuesto: 7% anual promedio en dólares. No garantizado.',W/2,1740);
};
S[5]=(lt,d)=>{
  const k=easeIO((lt-.2)/(d-1.6));
  tower(330,FLOOR,80,AMAX);
  tower(760,FLOOR,80,AMAX*(52093/121997)*k);
  chip('ANA',330,FLOOR+90,{fs:36,bg:'#fff',fg:INK});chip('LUIS',760,FLOOR+90,{fs:36,bg:'#fff',fg:INK});
  chip('$122,000',330,FLOOR-AMAX-60,{fs:44,bg:'#1f6f7c'});
  title(`$${fmt(lerp(0,52000,k))}`,300,128,1,1,'#8a6c4c');
  const a=fade(lt,1.4);title('puso $24,000',400,50,a,1,MUTED);
  g.font="500 30px 'Onest'";g.fillStyle=MUTED;g.textAlign='center';g.fillText('Supuesto: 7% anual promedio en dólares. No garantizado.',W/2,1740);
};
function hourglass(x,y,s){
  g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='#8a6c4c';g.fillRect(-46,-70,92,14);g.fillRect(-46,56,92,14);
  g.fillStyle='rgba(255,255,255,.6)';g.strokeStyle='rgba(120,140,150,.7)';g.lineWidth=4;
  g.beginPath();g.moveTo(-36,-56);g.lineTo(36,-56);g.lineTo(4,0);g.lineTo(36,56);g.lineTo(-36,56);g.lineTo(-4,0);g.closePath();g.fill();g.stroke();
  g.fillStyle='#e7b94a';g.beginPath();g.moveTo(-26,56);g.lineTo(26,56);g.lineTo(0,22);g.closePath();g.fill();
  g.restore();
}
S[6]=(lt,d)=>{
  // staircase
  const n=6, sw=150, sh=90, x0=120, y0=FLOOR+60;
  for(let i=0;i<n;i++){const x=x0+i*sw, y=y0-i*sh;
    const s=g.createLinearGradient(0,y,0,y+sh);s.addColorStop(0,'#fbfaf7');s.addColorStop(1,'#d8d3c9');
    g.fillStyle=s;g.fillRect(x,y,sw,y0-y+60);g.fillStyle='#ffffff';g.fillRect(x,y,sw,12);
    hourglass(x+sw/2,y-80,.75);}
  const p=clamp((lt-.3)/(d-.8))*(n-1.2);
  const i=Math.floor(p), f=p-i;
  const mx=x0+sw*.5+p*sw, my=y0-i*sh-ease(f)*sh;
  mannequin(mx,my,.5,A_COL,{step:Math.sin(lt*8)*.5,armR:[60,160],armL:[-60,160]});
  const a=fade(lt,2.4);
  title('No puso más dinero.',270,64,fade(lt,.1),1,MUTED);
  if(lt>2.4){const q=pop(lt,2.4);g.save();g.translate(W/2,390);g.scale(q,q);chip('Puso más tiempo',0,0,{fs:84,bg:'#1f6f7c'});g.restore();}
};
S[7]=(lt,d)=>{
  const h=mannequin(W/2,FLOOR+40,1.05,A_COL,{armR:[175,40]});
  const k=ease(lt/1.2);
  coin(h.hand[0]+lerp(30,90,k),h.hand[1]-30+lerp(0,-60,k),lerp(50,120,k),lerp(.34,.95,k));
  const p=pop(lt,.0);
  g.save();g.translate(W/2,360);g.scale(p,p);
  g.font="700 56px 'Space Grotesk'";g.fillStyle=INK;g.textAlign='center';g.fillText('Comenta',0,-110);
  chip('PLAN',0,60,{fs:130,bg:'#1f6f7c'});g.restore();
  title('y te paso cómo empezar',600,48,fade(lt,1.0),1,MUTED);
};

// ---------------- subtitles ----------------
function subtitles(t){
  const words=[];TL.scenes.forEach(s=>s.words.forEach(w=>words.push(w)));
  // chunks of max 3 words inside each scene
  let chunks=[];TL.scenes.forEach(s=>{for(let i=0;i<s.words.length;i+=3)chunks.push(s.words.slice(i,i+3))});
  const ch=chunks.find((c,i)=>t>=c[0][0]-.05 && (i+1>=chunks.length||t<chunks[i+1][0][0]-.05) && t<c[c.length-1][1]+.6);
  if(!ch)return;
  const fs=66;g.font=`800 ${fs}px 'Onest'`;g.textBaseline='middle';g.textAlign='left';
  const parts=ch.map(w=>w[2].toUpperCase());const sp=22;
  let ws=parts.map(p=>g.measureText(p).width);let total=ws.reduce((a,b)=>a+b,0)+sp*(parts.length-1);let fsz=fs;if(total>W-140){fsz=Math.floor(fs*(W-140)/total);g.font=`800 ${fsz}px 'Onest'`;ws=parts.map(p=>g.measureText(p).width);total=ws.reduce((a,b)=>a+b,0)+sp*(parts.length-1);}
  let x=(W-total)/2;const y=1440;
  parts.forEach((p,i)=>{const nx=i+1<ch.length?ch[i+1][0]-.03:ch[i][1]+.25;const active=t>=ch[i][0]-.03&&t<nx;
    if(active){g.fillStyle='#15191c';g.beginPath();g.roundRect(x-14,y-fsz*.62,ws[i]+28,fsz*1.24,18);g.fill();}
    g.lineWidth=10;g.strokeStyle=active?'#15191c':'rgba(255,255,255,.95)';g.lineJoin='round';
    if(!active)g.strokeText(p,x,y);
    g.fillStyle=active?ICE:'#15191c';g.fillText(p,x,y);x+=ws[i]+sp;});
}

function render(t){
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;
  bg();
  let si=TL.scenes.findIndex((s,i)=>t>=s.start&&(i==TL.scenes.length-1||t<TL.scenes[i+1].start));
  if(si<0)si=0;
  const s=TL.scenes[si], lt=t-s.start;
  // punch-in camera
  const z=lerp(1.07,1,ease(lt/.35))*(1+lt*.006);
  g.save();g.translate(W/2,H*.5);g.scale(z,z);g.translate(-W/2,-H*.5);
  S[si](lt,s.dur);
  g.restore();
  subtitles(t);
  // flash on cut
  const fl=1-clamp(lt/.12);if(si>0&&fl>0){g.fillStyle=`rgba(255,255,255,${fl*.6})`;g.fillRect(0,0,W,H);}
  // progress bar
  g.fillStyle='rgba(21,25,28,.12)';g.fillRect(0,0,W,10);g.fillStyle='#1f6f7c';g.fillRect(0,0,W*t/TL.total,10);
}
window.setup=async(tl)=>{TL=tl;await document.fonts.load("700 40px 'Space Grotesk'");await document.fonts.load("800 40px 'Onest'");await document.fonts.load("500 40px 'Onest'");await document.fonts.ready;return true};
window.frame=(t)=>{render(t);return cv.toDataURL('image/jpeg',.93)};
</script></body></html>
